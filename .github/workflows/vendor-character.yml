name: Vendor CC0 character model

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/vendor-character.yml"

permissions:
  contents: write

jobs:
  download-character:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download CC0 rigged character
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://grab3d.com/dl/man-base-character-rigged/man-base-character-rigged.glb" \
            --output assets/man-base-character-rigged.glb
          test "$(stat -c%s assets/man-base-character-rigged.glb)" -gt 1000000
          test "$(head -c 4 assets/man-base-character-rigged.glb)" = "glTF"

      - name: Commit model into this repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/man-base-character-rigged.glb
          git commit -m "Add CC0 rigged character model [skip ci]"
          git push origin HEAD:main
