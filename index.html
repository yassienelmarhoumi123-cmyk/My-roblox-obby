<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Bugatti Simulator</title>
    <style>
        body { margin: 0; overflow: hidden; background: #a0a0a0; font-family: sans-serif; user-select: none; }
        #info {
            position: absolute; top: 15px; left: 15px;
            color: white; background: rgba(15, 23, 42, 0.85);
            padding: 15px; border-radius: 8px; font-size: 16px;
            pointer-events: none; line-height: 1.5;
            border: 1px solid #38bdf8; z-index: 10;
        }
        #status { color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>

    <div id="info">
        <b>⚙️ STEUERUNG:</b><br>
        Laufen / Fahren: <span style="color:#facc15">W, A, S, D</span><br>
        Einsteigen: <span style="color:#34d399">E</span> (Nahe am Auto stehen)<br>
        Aussteigen: <span style="color:#ef4444">F</span><br><br>
        Status: <span id="status">Zu Fuß</span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        // 1. 3D-Szene, Kamera und Renderer erstellen
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xd1d5db); // Hellgrauer Himmel
        scene.fog = new THREE.Fog(0xd1d5db, 20, 100);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 2. Beleuchtung für schöne Schatten und Reflexionen
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 3. Glatter Boden (Graue Testfläche)
        const floorGeo = new THREE.PlaneGeometry(1000, 1000);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x374151, roughness: 0.5 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Ein sichtbares Gitter auf dem glatten Boden zur Orientierung
        const grid = new THREE.GridHelper(1000, 200, 0x111827, 0x4b5563);
        grid.position.y = 0.01;
        scene.add(grid);

        // 4. Logik-Variablen
        let carModel = null;
        let inCar = false;

        let playerPos = { x: 0, z: 8 };
        let carPos = { x: 0, z: 0 };
        let carSpeed = 0;
        let carAngle = 0;

        // Tuning-Werte für das Fahrverhalten des Bugattis
        const maxSpeed = 0.6;
        const acceleration = 0.015;
        const friction = 0.006;
        const turnSpeed = 0.035;

        const keys = { w: false, a: false, s: false, d: false };

        // Tastatur abfragen
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = true;

            // E-Taste gedrückt: Einsteigen
            if (key === 'e' && !inCar) {
                let distance = Math.hypot(playerPos.x - carPos.x, playerPos.z - carPos.z);
                if (distance < 5) { // Wenn du nah genug dran bist
                    inCar = true;
                    document.getElementById("status").innerText = "Im Bugatti";
                    document.getElementById("status").style.color = "#34d399";
                }
            }

            // F-Taste gedrückt: Aussteigen
            if (key === 'f' && inCar) {
                inCar = false;
                // Setzt den Spieler ein kleines Stück links neben dem Auto ab
                playerPos.x = carPos.x - Math.cos(carAngle) * 2.5;
                playerPos.z = carPos.z + Math.sin(carAngle) * 2.5;
                document.getElementById("status").innerText = "Zu Fuß";
                document.getElementById("status").style.color = "#38bdf8";
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = false;
        });

        // 5. DEIN BUGATTI MODELL LADEN
        const loader = new THREE.GLTFLoader();
        
        // Nutzt genau den Dateinamen aus deinem GitHub-Upload
        loader.load('2016_bugatti_chiron.glb', function (gltf) {
            carModel = gltf.scene;
            carModel.position.set(carPos.x, 0, carPos.z);
            
            // Schattenwurf für das Auto aktivieren
            carModel.traverse(function (child) {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            scene.add(carModel);
            console.log("Bugatti Chiron geladen!");
        }, undefined, function (error) {
            console.error("Fehler beim Laden des 3D-Modells:", error);
        });

        // 6. Game-Loop (wird ca. 60 Mal pro Sekunde ausgeführt)
        function animate() {
            requestAnimationFrame(animate);

            if (inCar) {
                // --- AUTO-MODUS ---
                if (keys.w) {
                    carSpeed = Math.min(carSpeed + acceleration, maxSpeed); // Vorwärtsgas
                } else if (keys.s) {
                    carSpeed = Math.max(carSpeed - acceleration, -maxSpeed / 2); // Rückwärtsgas / Bremse
                } else {
                    // Automatisches Ausrollen durch Reibung
                    if (carSpeed > 0) carSpeed = Math.max(0, carSpeed - friction);
                    if (carSpeed < 0) carSpeed = Math.min(0, carSpeed + friction);
                }

                // Lenken nur, wenn sich das Auto auch bewegt
                if (Math.abs(carSpeed) > 0.01) {
                    const currentTurn = turnSpeed * (carSpeed / maxSpeed + 0.3);
                    if (keys.a) carAngle += carSpeed > 0 ? currentTurn : -currentTurn;
                    if (keys.d) carAngle -= carSpeed > 0 ? currentTurn : -currentTurn;
                }

                // Neue Position berechnen (Z-Achse und X-Achse im 3D-Raum)
                carPos.x += Math.sin(carAngle) * carSpeed;
                carPos.z += Math.cos(carAngle) * carSpeed;

                // Modell bewegen und rotieren
                if (carModel) {
                    carModel.position.set(carPos.x, 0, carPos.z);
                    carModel.rotation.y = carAngle;
                }

                // Dritte-Person-Kamera schräg hinter dem Auto positionieren
                camera.position.set(
                    carPos.x - Math.sin(carAngle) * 9,
                    4,
                    carPos.z - Math.cos(carAngle) * 9
                );
                camera.lookAt(carPos.x, 1, carPos.z);

            } else {
                // --- ZU FUSS MODUS ---
                const moveSpeed = 0.15;
                if (keys.w) playerPos.z -= moveSpeed;
                if (keys.s) playerPos.z += moveSpeed;
                if (keys.a) playerPos.x -= moveSpeed;
                if (keys.d) playerPos.x += moveSpeed;

                // Kamera folgt der Position des Spielers zu Fuß
                camera.position.set(playerPos.x, 6, playerPos.z + 12);
                camera.lookAt(playerPos.x, 0, playerPos.z);
            }

            renderer.render(scene, camera);
        }

        // Unterstützung bei Größenänderung des Fensters
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Spielschleife starten
        animate();
    </script>
</body>
</html>
