<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Halal Games Portal</title>
    <style>
        body { 
            background: radial-gradient(circle, #1a0033, #000000); 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
        }

        h1 { 
            font-size: 2.5em; 
            text-shadow: 0 0 15px #8a2be2; 
            margin-top: 20px; 
            margin-bottom: 30px; 
        }

        .grid { 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            flex-wrap: wrap; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        .card { 
            background: rgba(255,255,255,0.05); 
            border-radius: 25px; 
            padding: 15px; 
            width: 160px; 
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.2s;
            cursor: pointer;
        }

        .card:active {
            transform: scale(0.95);
        }
        
        .card img { 
            width: 100%; 
            aspect-ratio: 1/1; 
            object-fit: cover; 
            border-radius: 18px; 
            margin-bottom: 10px;
        }

        .game-title { 
            font-size: 0.9em; 
            font-weight: bold; 
            text-transform: uppercase; 
        }

        /* GAME OVERLAY */
        #game-view { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; 
            z-index: 5000; 
        }
        
        iframe { 
            width: 100%; 
            height: calc(100% - 60px); 
            border: none; 
        }

        .btn-close { 
            background: #ff0000; 
            color: white; 
            border: none; 
            padding: 12px 25px; 
            border-radius: 12px; 
            font-weight: bold; 
            cursor: pointer; 
            margin: 10px;
        }
    </style>
</head>
<body>

    <div id="game-view">
        <div style="height: 60px; display: flex; justify-content: center; align-items: center; background: #111;">
            <button class="btn-close" onclick="closeGame()">✖ SCHLIESSEN</button>
        </div>
        <iframe id="game-frame" src="" allow="camera; microphone; display-capture; fullscreen"></iframe>
    </div>

    <h1>HALAL PORTAL</h1>
    
    <div class="grid">
        <div class="card" onclick="launchGame('https://gamulo.com/game/dta-6-unblocked/', true)">
            <img src="gta.png">
            <div class="game-title" style="color: #ffde00;">DTA 6</div>
        </div>

        <div class="card" onclick="launchGame('https://horrorgamesfree.com/granny2', false)">
            <img src="granny.png">
            <div class="game-title" style="color: #888;">Granny</div>
        </div>

        <div class="card" onclick="launchGame('https://my.cbox.ws/Yassien', false)">
            <img src="https://cdn-icons-png.flaticon.com/512/134/134937.png">
            <div class="game-title" style="color: #25D366;">Messenger</div>
        </div>

        <div class="card" onclick="launchGame('https://murder-unblocked.github.io/', false)">
            <img src="Murder.png">
            <div class="game-title" style="color: #ff4444;">Murder</div>
        </div>

        <div class="card" onclick="launchGame('https://ducky443747.github.io/games/DriveMad/', false)">
            <img src="https://play-lh.googleusercontent.com/Anm2S-MvTuxPzD4lqP7kH0H8uC_o7YvF1O7jB_9Gz9V0M9f6I8P6j1g_3p8P0w">
            <div class="game-title" style="color: #ffde00;">Drive Mad</div>
        </div>

        <div class="card" onclick="launchGame('https://basketballrandom.gitlab.io/', false)">
            <img src="basket.png">
            <div class="game-title">Basket Random</div>
        </div>

        <div class="card" onclick="launchGame('https://wordledeutsch.org/', false)">
            <img src="wordle.png">
            <div class="game-title" style="color: #4CAF50;">Wordle</div>
        </div>

        <div class="card" onclick="launchGame('https://ommogle.com/', false)">
            <img src="halal-chat.png">
            <div class="game-title" style="color: #00d4ff;">Chat</div>
        </div>

        <div class="card" onclick="launchGame('https://crazygames-unblocked.github.io/play/highway-racer-3d.html', false)">
            <img src="halal-racer.png">
            <div class="game-title" style="color: #00ff88;">Racer</div>
        </div>
    </div>

    <script>
        const PASSWORT = "6767";

        function launchGame(url, newTab) {
            const eingabe = prompt("Passwort eingeben:");
            if (eingabe === PASSWORT) {
                if (newTab) {
                    // Öffnet DTA 6 in einem neuen Tab
                    window.open(url, '_blank');
                } else {
                    // Öffnet alle anderen Spiele im Overlay
                    document.getElementById('game-frame').src = url;
                    document.getElementById('game-view').style.display = 'block';
                    document.body.style.overflow = 'hidden';
                }
            } else if (eingabe !== null) {
                alert("Falsches Passwort!");
            }
        }

        function closeGame() {
            document.getElementById('game-view').style.display = 'none';
            document.getElementById('game-frame').src = "";
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
