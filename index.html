<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Showdown.io - 2D Multiplayer Shooter</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: #0f172a; color: white;
            font-family: 'Segoe UI', sans-serif;
            text-align: center; overflow: hidden; user-select: none;
        }
        #lobby {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95);
            padding: 30px; border-radius: 15px;
            border: 2px solid #38bdf8; z-index: 20; width: 80%; max-width: 320px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }
        input, button {
            font-size: 18px; padding: 12px; width: 100%; border-radius: 8px; margin-top: 10px; box-sizing: border-box;
        }
        input { border: 1px solid #334155; background: #1e293b; color: white; text-align: center; }
        button { background: #38bdf8; border: none; font-weight: bold; color: #0f172a; cursor: pointer; }
        #gameCanvas { background: #1e293b; display: none; }
        #uiOverlay {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: none; justify-content: space-between; pointer-events: none; z-index: 10;
        }
        .hud-box { background: rgba(15, 23, 42, 0.7); padding: 10px 15px; border-radius: 8px; font-size: 14px; }
        #hpBarOuter { width: 150px; height: 16px; background: #475569; border-radius: 8px; overflow: hidden; margin-top: 5px; }
        #hpBarInner { width: 100%; height: 100%; background: #ef4444; transition: width 0.1s; }
    </style>
</head>
<body>

    <div id="lobby">
        <h2 style="color: #38bdf8; margin-top: 0;">🔫 SHOWDOWN.IO</h2>
        <p style="font-size: 14px; color: #94a3b8;">Erstelle einen Raum und kämpfe gegen deine Klasse!</p>
        <input type="number" id="roomInput" placeholder="Raum-Nummer (4-stellig)">
        <button onclick="joinRoom()">In den Kampf! 🚀</button>
    </div>

    <div id="uiOverlay">
        <div class="hud-box">
            <div><b>SPIELER:</b> <span id="hudName">-</span></div>
            <div id="hpBarOuter"><div id="hpBarInner"></div></div>
        </div>
        <div class="hud-box" style="text-align: right;">
            <b style="color: #38bdf8;">TOP KILLS:</b>
            <div id="leaderboard"></div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // Nutzt dieselbe stabile Firebase-Datenbank wie zuvor
        const firebaseConfig = {
            apiKey: "AIzaSyDVCk8f0nhfJLLwycEZJN0-zJ05KURuGSQ",
            authDomain: "halal-bomben-spiel.firebaseapp.com",
            databaseURL: "https://halal-bomben-spiel-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "halal-bomben-spiel",
            storageBucket: "halal-bomben-spiel.firebasestorage.app",
            messagingSenderId: "709287849072",
            appId: "1:709287849072:web:0a477d52580b2cd3d598b5"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let roomId = "", playerId = "";
        let players = {};
        const MAP_SIZE = 1500; // Größe des Schlachtfelds

        // Spieler-Eigenschaften
        let myX = Math.random() * (MAP_SIZE - 200) + 100;
        let myY = Math.random() * (MAP_SIZE - 200) + 100;
        let myHp = 100;
        let myKills = 0;
        let myColor = 'hsl(' + Math.random() * 360 + ', 85%, 50%)';
        let alive = true;
        let aimAngle = 0;

        // Lokale Kugel-Liste (jede Kugel wird vom Schützen simuliert)
        let myBullets = [];

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Steuerung (Tastatur für PC, Klicks/Touch für iPad)
        let keys = {};
        window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
        window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

        function joinRoom() {
            const input = document.getElementById("roomInput").value;
            if(input.length < 4) { alert("Bitte 4 Zahlen eingeben!"); return; }
            roomId = "shooter_" + input;
            playerId = "Agent_" + Math.floor(Math.random() * 900 + 100);

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            document.getElementById("lobby").style.display = "none";
            canvas.style.display = "block";
            document.getElementById("uiOverlay").style.display = "flex";
            document.getElementById("hudName").innerText = playerId;

            // Verbindung trennen -> Automatisch aus DB löschen
            database.ref(roomId + "/players/" + playerId).onDisconnect().remove();

            // Synchronisation mit Firebase
            database.ref(roomId + "/players").on("value", snapshot => {
                players = snapshot.val() || {};
                if (players[playerId]) {
                    // Falls ein anderes iPad uns Schaden geschossen hat, updaten wir unser lokales Leben
                    if (players[playerId].hp !== undefined && players[playerId].hp < myHp) {
                        myHp = players[playerId].hp;
                        if (myHp <= 0 && alive) triggerDeath();
                    }
                    if (players[playerId].kills !== undefined) {
                        myKills = players[playerId].kills;
                    }
                }
            });

            // Globaler Kugel-Empfänger (um die Schüsse der anderen zu sehen)
            database.ref(roomId + "/bullets").on("child_added", snapshot => {
                let b = snapshot.val();
                // Wenn die Kugel von jemand anderem ist, prüfen wir, ob sie UNS trifft
                if (b && b.owner !== playerId && alive) {
                    let dist = Math.hypot(myX - b.x, myY - b.y);
                    if (dist < 25) { // Radius-Check (getroffen!)
                        myHp -= 20; // 20 Schaden pro Treffer
                        database.ref(roomId + "/players/" + playerId).update({ hp: myHp });
                        if (myHp <= 0) {
                            triggerDeath();
                            // Dem Schützen einen Kill gutschreiben
                            database.ref(roomId + "/players/" + b.owner + "/kills").set(firebase.database.ServerValue.increment(1));
                        }
                    }
                }
                // Sofort wieder löschen, da es nur ein Signal-Event war
                snapshot.ref.remove();
            });

            setInterval(gameLoop, 1000 / 50); // Physik & Upload
        }

        // Ziel-Erkennung & Schießen auf dem iPad (Klick/Touch)
        window.addEventListener("pointerdown", e => {
            if (!alive) return;
            // Winkel vom Spieler-Zentrum zum Klick berechnen
            let screenX = e.clientX - canvas.width / 2;
            let screenY = e.clientY - canvas.height / 2;
            let angle = Math.atan2(screenY, screenX);

            // Kugel abfeuern
            let bullet = {
                owner: playerId,
                x: myX,
                y: myY,
                vx: Math.cos(angle) * 12, // Kugelgeschwindigkeit
                vy: Math.sin(angle) * 12,
                life: 60 // Wie viele Frames fliegt die Kugel
            };

            // 1. Lokale Liste hinzufügen, damit wir sie sofort fliegen sehen
            myBullets.push(bullet);

            // 2. An Firebase melden, damit andere Spieler prüfen können, ob sie getroffen wurden
            database.ref(roomId + "/bullets").push(bullet);
        });

        function triggerDeath() {
            alive = false;
            myHp = 0;
            database.ref(roomId + "/players/" + playerId).update({ hp: 0 });
            setTimeout(() => {
                // Respawn nach 2 Sekunden
                myX = Math.random() * (MAP_SIZE - 200) + 100;
                myY = Math.random() * (MAP_SIZE - 200) + 100;
                myHp = 100;
                alive = true;
                database.ref(roomId + "/players/" + playerId).update({ x: myX, y: myY, hp: 100 });
            }, 2000);
        }

        function gameLoop() {
            if (alive) {
                // Bewegung (WASD oder Pfeiltasten)
                let speed = 4.5;
                if (keys["w"] || keys["arrowup"]) myY -= speed;
                if (keys["s"] || keys["arrowdown"]) myY += speed;
                if (keys["a"] || keys["arrowleft"]) myX -= speed;
                if (keys["d"] || keys["arrowright"]) myX += speed;

                // Map-Grenzen einhalten
                myX = Math.max(20, Math.min(MAP_SIZE - 20, myX));
                myY = Math.max(20, Math.min(MAP_SIZE - 20, myY));

                // Position an Server senden
                database.ref(roomId + "/players/" + playerId).set({
                    id: playerId, x: myX, y: myY, color: myColor, hp: myHp, kills: myKills
                });
            }

            // Eigene Kugeln lokal weiterbewegen
            for (let i = myBullets.length - 1; i >= 0; i--) {
                let b = myBullets[i];
                b.x += b.vx;
                b.y += b.vy;
                b.life--;
                if (b.life <= 0) myBullets.splice(i, 1);
            }

            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Kamera auf den Spieler zentrieren
            ctx.save();
            ctx.translate(-(myX - canvas.width / 2), -(myY - canvas.height / 2));

            // Raster/Boden zeichnen (Map-Struktur)
            ctx.strokeStyle = "#334155"; ctx.lineWidth = 1;
            for (let x = 0; x <= MAP_SIZE; x += 50) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE); ctx.stroke();
            }
            for (let y = 0; y <= MAP_SIZE; y += 50) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_SIZE, y); ctx.stroke();
            }
            // Roter Map-Rand
            ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 6; ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

            // Eigene fliegende Kugeln zeichnen
            ctx.fillStyle = "#fbbf24";
            myBullets.forEach(b => {
                ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI * 2); ctx.fill();
            });

            // Alle Spieler aus der Datenbank zeichnen
            let leaderboardList = [];
            Object.keys(players).forEach(pId => {
                let p = players[pId];
                if (p.hp <= 0) return; // Tote Spieler nicht zeichnen

                leaderboardList.push({ id: p.id, kills: p.kills || 0 });

                // Spieler-Kreis
                ctx.beginPath();
                ctx.arc(p.x, p.y, 18, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.strokeStyle = "white"; ctx.lineWidth = 2; ctx.stroke();

                // Name über dem Spieler
                ctx.fillStyle = "white"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center";
                ctx.fillText(p.id, p.x, p.y - 26);

                // Kleiner HP-Balken über dem Spieler
                ctx.fillStyle = "#475569"; ctx.fillRect(p.x - 20, p.y - 22, 40, 4);
                ctx.fillStyle = "#10b981"; ctx.fillRect(p.x - 20, p.y - 22, (p.hp / 100) * 40, 4);
            });

            ctx.restore();

            // HUD UI Updaten
            document.getElementById("hpBarInner").style.width = myHp + "%";
            
            // Bestenliste sortieren und anzeigen
            leaderboardList.sort((a, b) => b.kills - a.kills);
            let lbHtml = "";
            leaderboardList.slice(0, 3).forEach((p, i) => {
                lbHtml += `<div>${i+1}. ${p.id === playerId ? "<b>DU</b>" : p.id} (${p.kills})</div>`;
            });
            document.getElementById("leaderboard").innerHTML = lbHtml;
        }

        window.addEventListener("resize", () => {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
