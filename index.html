<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mein Browser Minecraft - Neustart</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #78a7ff; font-family: sans-serif; touch-action: none; }
        canvas { display: block; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 10px; height: 10px;
            background: white; transform: translate(-50%, -50%);
            mix-blend-mode: difference; pointer-events: none;
        }
        #info {
            position: absolute; top: 10px; left: 10px;
            color: white; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="info"><b>Schritt 1: Das Fundament läuft!</b><br>Laufen: WASD oder Pfeiltasten<br>Springen: LEERTASTE<br>Umsehen: Mit dem Finger wischen</div>

    <script>
        // --- 1. DAS 3D-FENSTER AUFSETZEN ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x78a7ff); // Blauer Himmel
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Licht hinzufügen, damit die Blöcke plastisch aussehen
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 15);
        scene.add(directionalLight);

        // --- 2. DIE ERSTEN BLÖCKE ---
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const grassColor = new THREE.MeshLambertMaterial({color: 0x557a2b});
        const dirtColor = new THREE.MeshLambertMaterial({color: 0x866043});
        const materials = [dirtColor, dirtColor, grassColor, dirtColor, dirtColor, dirtColor];

        // Der eine Block in der Mitte
        const block = new THREE.Mesh(geometry, materials);
        block.position.set(0, 0, 0);
        scene.add(block);

        // Die große grüne Bodenplatte, auf der wir laufen
        const floorGeometry = new THREE.BoxGeometry(20, 0.2, 20);
        const floorMaterial = new THREE.MeshLambertMaterial({color: 0x446622});
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.position.set(0, -0.6, 0);
        scene.add(floor);

        // Startposition des Spielers (Augenhöhe über dem Boden)
        camera.position.set(0, 1.6, 5);

        // --- 3. TASTATUR-STEUERUNG (Laufen & Springen) ---
        const keys = { forward: false, backward: false, left: false, right: false, jump: false };
        let velocityY = 0;
        const gravity = -0.01;
        const jumpStrength = 0.18;
        const speed = 0.08;
        let canJump = false;

        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.forward = true;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.backward = true;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = true;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = true;
            if (e.code === 'Space') keys.jump = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.forward = false;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.
