<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Bugatti Splitscreen-Rennen</title>
    <style>
        body { margin: 0; overflow: hidden; background: #9ca3af; font-family: 'Segoe UI', sans-serif; user-select: none; }
        #info {
            position: absolute; top: 15px; left: 15px;
            color: white; background: rgba(15, 23, 42, 0.9);
            padding: 15px 22px; border-radius: 12px; font-size: 16px;
            pointer-events: none; border: 2px solid #38bdf8; z-index: 10;
        }
    </style>
</head>
<body>

    <div id="info">
        🏎️ <b>BUGATTI REAL-DRIVE SIMULATOR</b><br>
        Spieler 1: W, A, S, D | Spieler 2: Pfeiltasten
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x9ca3af);
        scene.fog = new THREE.Fog(0x9ca3af, 60, 400);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const camera1 = new THREE.PerspectiveCamera(60, (window.innerWidth / 2) / window.innerHeight, 0.1, 1000);
        const camera2 = new THREE.PerspectiveCamera(60, (window.innerWidth / 2) / window.innerHeight, 0.1, 1000);

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(40, 80, 40);
        scene.add(dirLight);

        // Straße breiter gemacht (40 statt 24)
        const roadWidth = 40; 
        const roadLength = 10000;
        const road = new THREE.Mesh(new THREE.PlaneGeometry(roadWidth, roadLength), new THREE.MeshStandardMaterial({ color: 0x1e1e1e }));
        road.rotation.x = -Math.PI / 2;
        scene.add(road);

        const keys = { w: false, a: false, s: false, d: false, arrowup: false, arrowdown: false, arrowleft: false, arrowright: false };
        
        // Physik-Parameter
        function createCar() {
            return { pos: {x: 0, z: 0}, speed: 0, angle: 0, gear: 1, model: null };
        }
        let car1 = createCar(); car1.pos.x = -10;
        let car2 = createCar(); car2.pos.x = 10;

        window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        const loader = new THREE.GLTFLoader();
        loader.load('2016_bugatti_chiron.glb', (gltf) => {
            car1.model = gltf.scene.clone(); car1.model.scale.set(450, 450, 450); scene.add(car1.model);
            car2.model = gltf.scene.clone(); car2.model.scale.set(450, 450, 450); scene.add(car2.model);
        });

        function updatePhysics(car, f, b, l, r) {
            // Realistische Beschleunigung & Gänge
            if (keys[f]) {
                let acc = 0.05 / (1 + car.speed * 0.2); // Weniger Beschleunigung bei hohem Tempo
                car.speed = Math.min(car.speed + acc, 4.0);
            } else if (keys[b]) {
                car.speed = Math.max(car.speed - 0.08, -1.0); // Bremsen
            } else {
                car.speed *= 0.99; // Rollwiderstand
            }

            // Lenkung abhängig von Geschwindigkeit
            if (Math.abs(car.speed) > 0.1) {
                let steerFactor = 0.02 / (1 + car.speed * 0.1); 
                if (keys[l]) car.angle += steerFactor;
                if (keys[r]) car.angle -= steerFactor;
            }

            car.pos.x += Math.sin(car.angle) * car.speed;
            car.pos.z += Math.cos(car.angle) * car.speed;

            if (car.model) {
                car.model.position.set(car.pos.x, 0, car.pos.z);
                car.model.rotation.y = car.angle;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePhysics(car1, 'w', 's', 'a', 'd');
            updatePhysics(car2, 'arrowup', 'arrowdown', 'arrowleft', 'arrowright');

            const w = window.innerWidth, h = window.innerHeight;
            renderer.setScissorTest(true);

            renderer.setViewport(0, 0, w / 2, h); renderer.setScissor(0, 0, w / 2, h);
            camera1.position.set(car1.pos.x - Math.sin(car1.angle) * 50, 20, car1.pos.z - Math.cos(car1.angle) * 50);
            camera1.lookAt(car1.pos.x, 5, car1.pos.z);
            renderer.render(scene, camera1);

            renderer.setViewport(w / 2, 0, w / 2, h); renderer.setScissor(w / 2, 0, w / 2, h);
            camera2.position.set(car2.pos.x - Math.sin(car2.angle) * 50, 20, car2.pos.z - Math.cos(car2.angle) * 50);
            camera2.lookAt(car2.pos.x, 5, car2.pos.z);
            renderer.render(scene, camera2);
        }
        animate();
    </script>
</body>
</html>
