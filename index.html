<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #8a2be2; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; }
        .card { background: rgba(0,0,0,0.3); border-radius: 10px; padding: 10px; text-decoration: none; color: white; display: block; }
        .card img { width: 100%; border-radius: 5px; aspect-ratio: 1/1; object-fit: cover; }
    </style>
</head>
<body>
    <h2>Top Unblocked Games</h2>
    <div class="grid">
        <!-- Granny Kachel -->
        <a href="https://granny-unblocked.github.io" class="card">
            <img src="https://play-lh.googleusercontent.com/6X9k7aHhK8V6zCj6X_O3o7G3_5R6T-mU6n-9f_8R3n-v_8" alt="Granny">
            <p>Granny</p>
        </a>
        <!-- Hier kannst du weitere Kacheln einfügen -->
    </div>
</body>
</html>
