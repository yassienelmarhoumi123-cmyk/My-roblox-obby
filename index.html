<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meine Spiele Sammlung</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #fff;
      text-align: center;
    }
    h1 {
      margin: 20px 0;
      color: #00ffcc;
    }
    .game-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }
    .game-card {
      background: #1e1e1e;
      border: 2px solid #333;
      border-radius: 10px;
      width: 280px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .game-cover {
      display: block;
      width: 100%;
      height: 158px;
      object-fit: cover;
      border-radius: 7px;
      margin-bottom: 14px;
      background: #101820;
    }
    .granny-cover {
      object-fit: contain;
      padding: 10px;
      box-sizing: border-box;
    }
    .game-card h3 {
      margin-bottom: 15px;
      font-size: 18px;
    }
    .game-card button {
      background-color: #00ffcc;
      color: #000;
      border: none;
      padding: 10px 20px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
    }
    .game-card button:hover {
      background-color: #00cc99;
    }
    /* Spiel-Ansicht (wird anfangs versteckt) */
    #player-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: #000;
      z-index: 100;
    }
    #game-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .back-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #ff4d4d;
      color: white;
      border: none;
      padding: 10px 15px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      z-index: 101;
    }
  </style>
</head>
<body>

  <!-- Hauptmenü mit allen Spielen -->
  <div id="menu">
    <h1>Meine Games Sammlung</h1>
    <div class="game-grid">
      
      <!-- Spiel 1 -->
      <div class="game-card">
        <img class="game-cover" src="https://images.igdb.com/igdb/image/upload/t_1080p/cobv91.jpg" alt="Schoolboy Escape: Runaway Titelbild" loading="lazy">
        <h3>Schoolboy Escape</h3>
        <button onclick="loadGame('https://cdn.vietdp.com/file/vietdp-games/games/t52025/schoolboy-escape-runaway/index.html')">Spielen</button>
      </div>

      <!-- Spiel 2 -->
      <div class="game-card">
        <img class="game-cover" src="https://brainide.com/uploads/thumbnails/dragon-simulator-3d-online_game_img-online_game_img-1777751280097.webp" alt="Dragon Simulator 3D Titelbild" loading="lazy">
        <h3>Dragon Simulator 3D</h3>
        <button onclick="loadGame('https://ub-g.github.io/embed/dragon-simulator-3d')">Spielen</button>
      </div>

      <!-- Spiel 3 -->
      <div class="game-card">
        <img class="game-cover" src="https://raw.githubusercontent.com/UBGHyper/GameList.github.io/main/How-To-Fish/how-to-fish.jpg" alt="How to Fish Titelbild" loading="lazy">
        <h3>How to Fish</h3>
        <button onclick="loadGame('https://ubghyper.github.io/GameList.github.io/How-To-Fish/')">Spielen</button>
      </div>

      <!-- Spiel 4 -->
      <div class="game-card">
        <img class="game-cover granny-cover" src="https://upload.wikimedia.org/wikipedia/commons/4/4a/Granny_Game_Logo.png" alt="Granny Spiellogo" loading="lazy">
        <h3>Granny</h3>
        <button onclick="loadGame('https://ubghyper.github.io/GameList.github.io/Granny/', true)">Spielen</button>
      </div>

    </div>
  </div>

  <!-- Vollbild-Player, wenn ein Spiel gestartet wird -->
  <div id="player-container">
    <button class="back-btn" onclick="closeGame()">← Zurück zur Übersicht</button>
    <iframe id="game-iframe" src="" allow="fullscreen; autoplay" allowfullscreen></iframe>
  </div>

  <script>
    function loadGame(url, useGrannyPermissions = false) {
      document.getElementById('menu').style.display = 'none';
      const container = document.getElementById('player-container');
      const iframe = document.getElementById('game-iframe');

      // Granny benötigt zusätzliche iframe-Berechtigungen (z. B. Pointer Lock).
      if (useGrannyPermissions) {
        iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-top-navigation-by-user-activation allow-popups');
      } else {
        iframe.removeAttribute('sandbox');
      }

      iframe.src = url;
      container.style.display = 'block';
    }

    function closeGame() {
      const container = document.getElementById('player-container');
      const iframe = document.getElementById('game-iframe');
      iframe.src = ""; // Stoppt das Spiel im Hintergrund
      iframe.removeAttribute('sandbox');
      container.style.display = 'none';
      document.getElementById('menu').style.display = 'block';
    }
  </script>

</body>
</html>
