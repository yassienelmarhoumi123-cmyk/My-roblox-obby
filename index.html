<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Halal Games Portal</title>
    <style>
        body { 
            background: radial-gradient(circle, #1a0033, #000000); 
            color: white; font-family: sans-serif; text-align: center; 
            margin: 0; padding: 20px; min-height: 100vh;
        }

        h1 { font-size: 2.5em; text-shadow: 0 0 15px #8a2be2; margin-bottom: 20px; }

        /* SEARCH BOX */
        .search-container {
            background: rgba(138, 43, 226, 0.15);
            padding: 15px; border-radius: 20px;
            border: 1px solid rgba(138, 43, 226, 0.4);
            max-width: 450px; margin: 0 auto 30px auto;
        }

        #proxy-input {
            width: 60%; padding: 12px; border-radius: 10px;
            border: none; background: #111; color: #00ff88; font-weight: bold;
        }

        .btn-go {
            background: #8a2be2; color: white; border: none;
            padding: 12px 20px; border-radius: 10px; cursor: pointer; font-weight: bold;
        }

        /* GRID */
        .grid { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }

        .card { 
            background: rgba(255,255,255,0.05); border-radius: 20px; padding: 12px; 
            width: 130px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer;
        }

        .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 15px; }
        .game-title { font-size: 0.8em; font-weight: bold; margin-top: 8px; text-transform: uppercase; }

        /* OVERLAY */
        #game-view { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 9999; 
        }
        
        #game-frame { width: 100%; height: calc(100% - 60px); border: none; margin-top: 60px; }

        #jumpscare-video {
            width: 100%; height: 100%; object-fit: fill; 
            position: absolute; top: 0; left: 0; display: none;
        }

        #close-bar {
            height: 60px; display: flex; justify-content: center; 
            align-items: center; background: #111; 
            position: absolute; top: 0; left: 0; width: 100%;
        }

        .btn-close { background: #ff0000; color: white; border: none; padding: 10px 25px; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="game-view">
        <div id="close-bar">
            <button class="btn-close" onclick="closeGame()">✖ SCHLIESSEN</button>
        </div>
        <iframe id="game-frame"></iframe>
        <video id="jumpscare-video" playsinline>
            <source src="ScreenRecording_05-11-2026 18-17-01_1.mov" type="video/quicktime">
        </video>
    </div>

    <h1>HALAL PORTAL</h1>

    <div class="search-container">
        <input type="text" id="proxy-input" placeholder="poki.com oder url...">
        <button class="btn-go" onclick="startProxy()">GO</button>
    </div>
    
    <div class="grid">
        <div class="card" onclick="triggerJumpscare()">
            <img src="https://cdn-icons-png.flaticon.com/512/564/564619.png">
            <div class="game-title" style="color: #00d4ff;">Steal a Brainrot</div>
        </div>

        <div class="card" onclick="openLink('https://ducky443747.github.io/games/DriveMad/')">
            <img src="https://play-lh.googleusercontent.com/Anm2S-MvTuxPzD4lqP7kH0H8uC_o7YvF1O7jB_9Gz9V0M9f6I8P6j1g_3p8P0w">
            <div class="game-title">Drive Mad</div>
        </div>

        <div class="card" onclick="openLink('https://murder-unblocked.github.io/')">
            <img src="Murder.png">
            <div class="game-title">Murder</div>
        </div>
    </div>

    <script>
        const PW = "6767";

        function checkPW() {
            return prompt("Passwort:") === PW;
        }

        function startProxy() {
            let val = document.getElementById('proxy-input').value;
            if(!val) return;
            if(checkPW()) {
                if(!val.startsWith('http')) val = "https://" + (val.includes('.') ? val : val + ".com");
                const tunnel = "https://translate.google.com/translate?sl=en&tl=de&u=" + encodeURIComponent(val);
                showView(tunnel, false);
            }
        }

        function openLink(url) {
            if(checkPW()) showView(url, false);
        }

        function triggerJumpscare() {
            if(checkPW()) showView('', true);
        }

        function showView(url, isJumpscare) {
            const view = document.getElementById('game-view');
            const frame = document.getElementById('game-frame');
            const video = document.getElementById('jumpscare-video');
            const closeBar = document.getElementById('close-bar');

            view.style.display = 'block';
            
            if(isJumpscare) {
                frame.style.display = 'none';
                closeBar.style.display = 'none';
                video.style.display = 'block';
                video.muted = false;
                video.currentTime = 0;
                video.play().catch(() => {
                    // Falls iPad Autoplay blockt:
                    alert("Klicke OK für das Spiel");
                    video.play();
                });
                video.onended = () => { closeBar.style.display = 'flex'; };
            } else {
                video.style.display = 'none';
                frame.style.display = 'block';
                closeBar.style.display = 'flex';
                frame.src = url;
            }
        }

        function closeGame() {
            document.getElementById('game-view').style.display = 'none';
            document.getElementById('game-frame').src = "";
            document.getElementById('jumpscare-video').pause();
        }
    </script>
</body>
</html>
