<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Halal Bomb Tag</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a2e;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            overflow: hidden;
            user-select: none;
        }
        #lobby {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid #00f588;
            z-index: 10;
        }
        button {
            background: #00f588;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
        }
        #gameCanvas {
            background: #161625;
            display: none;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            margin: 10px auto;
        }
        #status {
            font-size: 24px;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="lobby">
        <h2>💣 Halal Bomb Tag 💣</h2>
        <p>Gib eine 4-stellige Raum-Nummer ein:</p>
        <input type="number" id="roomInput" placeholder="6767" style="font-size: 20px; width: 100px; text-align: center; padding: 5px; border-radius: 5px;"><br>
        <button onclick="joinRoom()">Spiel beitreten / erstellen</button>
    </div>

    <div id="status">Warte auf Spieler...</div>
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <p>Bewege deinen Kreis mit dem Finger auf dem Bildschirm!</p>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // Eingerichtet für deinen Belgien-Server
        const firebaseConfig = {
            apiKey: "AIzaSyDVCk8f0nhfJLLwycEZJN0-zJ05KURuGSQ",
            authDomain: "halal-bomben-spiel.firebaseapp.com",
            databaseURL: "https://halal-bomben-spiel-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "halal-bomben-spiel",
            storageBucket: "halal-bomben-spiel.firebasestorage.app",
            messagingSenderId: "709287849072",
            appId: "1:709287849072:web:0a477d52580b2cd3d598b5"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let roomId = "";
        let playerId = "";
        let players = {};
        let gameState = { timer: 20, bombHolder: "" };
        let isGameOver = false;

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        let myX = Math.random() * 500 + 50;
        let myY = Math.random() * 300 + 50;
        const radius = 20;

        function joinRoom() {
            const input = document.getElementById("roomInput").value;
            if(input.length < 4) { alert("Bitte 4 Zahlen eingeben!"); return; }
            roomId = "room_" + input;
            playerId = "player_" + Math.floor(Math.random() * 100000);

            document.getElementById("lobby").style.display = "none";
            canvas.style.display = "block";

            // Spieler in Datenbank setzen
            database.ref(roomId + "/players/" + playerId).set({
                x: myX, y: myY, id: playerId, color: 'hsl(' + Math.random() * 360 + ', 100%, 50%)'
            });

            // Erster Spieler bekommt die Bombe
            database.ref(roomId + "/players").once("value", snapshot => {
                if(Object.keys(snapshot.val() || {}).length === 1) {
                    database.ref(roomId + "/gameState").set({
                        bombHolder: playerId,
                        timer: 20,
                        active: true
                    });
                }
            });

            // Updates empfangen
            database.ref(roomId + "/players").on("value", snapshot => {
                players = snapshot.val() || {};
            });

            database.ref(roomId + "/gameState").on("value", snapshot => {
                if(!snapshot.val()) return;
                gameState = snapshot.val();
                document.getElementById("status").innerText = "Zeit bis BOOM: " + Math.ceil(gameState.timer) + "s";
                
                if(gameState.timer <= 0 && !isGameOver) {
                    isGameOver = true;
                    if(gameState.bombHolder === playerId) {
                        document.getElementById("status").innerText = "💥 BOOM! DU BIST EXPLODIERT! 💥";
                    } else {
                        document.getElementById("status").innerText = "👑 GEWONNEN! Du hast überlebt! 👑";
                    }
                }
            });

            setInterval(updateGame, 30);
            
            // Timer verringern (nur durch den Bombenbesitzer synchronisiert)
            setInterval(() => {
                if(gameState.bombHolder === playerId && gameState.timer > 0) {
                    database.ref(roomId + "/gameState/timer").set(gameState.timer - 1);
                }
            }, 1000);
        }

        // Touch-Events für iPad-Wischen
        canvas.addEventListener("touchmove", (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            myX = e.touches[0].clientX - rect.left;
            myY = e.touches[0].clientY - rect.top;

            if(myX < radius) myX = radius;
            if(myX > canvas.width - radius) myX = canvas.width - radius;
            if(myY < radius) myY = radius;
            if(myY > canvas.height - radius) myY = canvas.height - radius;

            if(roomId) {
                database.ref(roomId + "/players/" + playerId).update({ x: myX, y: myY });
            }
        }, {passive: false});

        function updateGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if(isGameOver) return;

            let playerIds = Object.keys(players);

            // Alle Kreise zeichnen
            playerIds.forEach(id => {
                let p = players[id];
                ctx.beginPath();
                ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.closePath();

                // Bombe anzeigen
                if(gameState.bombHolder === id) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y - 30, 10, 0, Math.PI * 2);
                    ctx.fillStyle = "black";
                    ctx.fill();
                    ctx.fillStyle = "red";
                    ctx.font = "14px Arial";
                    ctx.fillText("💣", p.x - 7, p.y - 25);
                    ctx.closePath();
                }
            });

            // Berührung/Übergabe prüfen
            if(gameState.bombHolder === playerId && playerIds.length > 1) {
                playerIds.forEach(id => {
                    if(id !== playerId) {
                        let other = players[id];
                        let dist = Math.sqrt((myX - other.x)**2 + (myY - other.y)**2);
                        if(dist < radius * 2) {
                            database.ref(roomId + "/gameState/bombHolder").set(id);
                        }
                    }
                });
            }
        }

        window.onbeforeunload = function() {
            if(roomId && playerId) {
                database.ref(roomId + "/players/" + playerId).remove();
            }
        };
    </script>
</body>
</html>
