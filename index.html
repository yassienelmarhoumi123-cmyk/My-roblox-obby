<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slither.io PRO Klassen-Edition</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: #0b0f19; color: white;
            font-family: 'Segoe UI', sans-serif;
            text-align: center; overflow: hidden; user-select: none;
        }
        #lobby {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(11, 15, 25, 0.95);
            padding: 30px; border-radius: 20px;
            border: 2px solid #00f588; z-index: 20; width: 80%; max-width: 350px;
            box-shadow: 0 0 30px rgba(0, 245, 136, 0.2);
        }
        button {
            background: #00f588; border: none; padding: 12px 25px;
            font-size: 18px; font-weight: bold; color: #0b0f19;
            border-radius: 10px; cursor: pointer; margin-top: 15px; width: 100%;
        }
        #gameCanvas {
            background: #111827; display: none;
        }
        #scoreBoard {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.7); padding: 10px 15px;
            border-radius: 8px; text-align: right; font-size: 14px;
            display: none; pointer-events: none; max-width: 200px; z-index: 10;
        }
        /* CHAT STYLE */
        #chatBox {
            position: absolute; bottom: 10px; left: 10px;
            width: 280px; height: 180px; background: rgba(15, 23, 42, 0.8);
            border-radius: 10px; border: 1px solid #374151;
            display: none; flex-direction: column; text-align: left; z-index: 10;
        }
        #chatMessages {
            flex: 1; padding: 8px; overflow-y: auto; font-size: 12px; color: #e5e7eb;
        }
        #chatInput {
            border: none; padding: 8px; background: #1f2937; color: white;
            border-bottom-left-radius: 10px; border-bottom-right-radius: 10px; font-size: 13px;
        }
    </style>
</head>
<body>

    <!-- LOBBY -->
    <div id="lobby">
        <h2>🐍 Slither.io PRO 🐍</h2>
        <p>Gib den 4-stelligen Raum-Code ein:</p>
        <input type="number" id="roomInput" placeholder="2026" style="font-size: 24px; width: 100%; text-align: center; padding: 8px; border-radius: 8px; border: 1px solid #374151; background: #1f2937; color: white;"><br>
        <button onclick="joinRoom()">Ab in die Riesen-Arena! 🚀</button>
    </div>

    <!-- LEADERBOARD -->
    <div id="scoreBoard">
        <b style="color: #00f588;">TOP SCHLANGEN:</b>
        <div id="leaderboardList"></div>
    </div>

    <!-- LIVE CHAT -->
    <div id="chatBox">
        <div id="chatMessages"></div>
        <input type="text" id="chatInput" placeholder="Sende Nachricht an die Klasse..." onkeydown="sendChatMessage(event)">
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- Firebase laden -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // BELGIEN-SERVER:
        const firebaseConfig = {
            apiKey: "AIzaSyDVCk8f0nhfJLLwycEZJN0-zJ05KURuGSQ",
            authDomain: "halal-bomben-spiel.firebaseapp.com",
            databaseURL: "https://halal-bomben-spiel-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "halal-bomben-spiel",
            storageBucket: "halal-bomben-spiel.firebasestorage.app",
            messagingSenderId: "709287849072",
            appId: "1:709287849072:web:0a477d52580b2cd3d598b5"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let roomId = "", playerId = "";
        let snakes = {}, foods = {};
        
        // RIESIGE MAP DIMENSIONEN
        const MAP_WIDTH = 2400;
        const MAP_HEIGHT = 1800;

        let myLength = 6;
        let myTail = [];
        let alive = true;
        let myColor = "";

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        let myX = Math.random() * (MAP_WIDTH - 200) + 100;
        let myY = Math.random() * (MAP_HEIGHT - 200) + 100;
        let angle = Math.random() * Math.PI * 2;
        let baseSpeed = 4;
        let currentSpeed = 4;
        let isBoosting = false;

        function joinRoom() {
            const input = document.getElementById("roomInput").value;
            if(input.length < 4) { alert("Bitte 4 Zahlen eingeben!"); return; }
            roomId = "snake_" + input;
            playerId = "Spieler_" + Math.floor(Math.random() * 1000);
            myColor = 'hsl(' + Math.random() * 360 + ', 100%, 50%)';

            // Canvas Größe an iPad-Bildschirm anpassen
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            document.getElementById("lobby").style.display = "none";
            canvas.style.display = "block";
            document.getElementById("scoreBoard").style.display = "block";
            document.getElementById("chatBox").style.display = "flex";

            // Viel Futter generieren für die Riesen-Map
            database.ref(roomId + "/food").once("value", snapshot => {
                if(!snapshot.val()) {
                    let initialFood = {};
                    for(let i=0; i<150; i++) {
                        let fId = "f_" + i;
                        initialFood[fId] = { x: Math.random() * (MAP_WIDTH-20) + 10, y: Math.random() * (MAP_HEIGHT-20) + 10, color: 'hsl(' + Math.random() * 360 + ', 100%, 60%)' };
                    }
                    database.ref(roomId + "/food").set(initialFood);
                }
            });

            // Live-Updates empfangen
            database.ref(roomId + "/snakes").on("value", snapshot => { snakes = snapshot.val() || {}; });
            database.ref(roomId + "/food").on("value", snapshot => { foods = snapshot.val() || {}; });
            
            // Chat Synchronisation
            database.ref(roomId + "/chat").limitToLast(15).on("value", snapshot => {
                let chatDiv = document.getElementById("chatMessages");
                chatDiv.innerHTML = "";
                snapshot.forEach(child => {
                    let msg = child.val();
                    chatDiv.innerHTML += `<div><span style="color:${msg.color}; font-weight:bold;">${msg.user}:</span> ${msg.text}</div>`;
                });
                chatDiv.scrollTop = chatDiv.scrollHeight;
            });

            // Loops starten
            setInterval(gameLoop, 1000 / 45);
            setInterval(boostDrainLoop, 600); // Längenverlust bei Boost alle 0.6 Sek
        }

        // --- STEUERUNGEN ---
        // 1. iPad Touch (Wischen steuert Richtung, zweiter Finger = Boost)
        canvas.addEventListener("touchmove", (e) => {
            e.preventDefault();
            if(!alive) return;
            const rect = canvas.getBoundingClientRect();
            let touchX = e.touches[0].clientX - rect.left;
            let touchY = e.touches[0].clientY - rect.top;
            
            // Richtung relativ zur Mitte des Bildschirms berechnen (da Kamera zentriert ist)
            let screenCenterX = canvas.width / 2;
            let screenCenterY = canvas.height / 2;
            angle = Math.atan2(touchY - screenCenterY, touchX - screenCenterX);
            
            // Wenn 2 Finger auf dem iPad liegen -> Boost an!
            isBoosting = (e.touches.length > 1);
        }, {passive: false});

        canvas.addEventListener("touchend", () => { isBoosting = false; });

        // 2. Tastatur-Steuerung (WASD / Pfeiltasten / Leertaste für Boost)
        window.addEventListener("keydown", (e) => {
            if(!alive) return;
            if(document.activeElement === document.getElementById("chatInput")) return; // Nicht steuern wenn man chattet

            if (e.key === "ArrowUp" || e.key.toLowerCase() === "w") angle = -Math.PI / 2;
            if (e.key === "ArrowDown" || e.key.toLowerCase() === "s") angle = Math.PI / 2;
            if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") angle = Math.PI;
            if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") angle = 0;
            if (e.key === " ") isBoosting = true; // Leertaste gedrückt halten
        });
        window.addEventListener("keyup", (e) => { if (e.key === " ") isBoosting = false; });

        // --- CHAT FUNKTION ---
        function sendChatMessage(e) {
            if(e.key === "Enter") {
                let input = document.getElementById("chatInput");
                if(input.value.trim() === "") return;
                database.ref(roomId + "/chat").push({
                    user: playerId,
                    text: input.value,
                    color: myColor
                });
                input.value = "";
                input.blur(); // Tastatur einklappen
            }
        }

        // Längenabzug beim Boosten
        function boostDrainLoop() {
            if(alive && isBoosting && myLength > 4) {
                myLength--;
            }
        }

        // --- RESPAWN FUNKTION ---
        function respawn() {
            myX = Math.random() * (MAP_WIDTH - 200) + 100;
            myY = Math.random() * (MAP_HEIGHT - 200) + 100;
            myLength = 6;
            myTail = [];
            alive = true;
        }

        // --- HAUPT GAME LOOP ---
        function gameLoop() {
            if (alive) {
                // Boost-Speed setzen
                currentSpeed = (isBoosting && myLength > 4) ? baseSpeed * 1.8 : baseSpeed;

                // Position berechnen
                myX += Math.cos(angle) * currentSpeed;
                myY += Math.sin(angle) * currentSpeed;

                // Map-Grenzen abfangen
                if(myX < 0) myX = MAP_WIDTH; if(myX > MAP_WIDTH) myX = 0;
                if(myY < 0) myY = MAP_HEIGHT; if(myY > MAP_HEIGHT) myY = 0;

                // Schweif updaten
                myTail.unshift({x: myX, y: myY});
                if(myTail.length > myLength * 3) {
                    myTail.pop();
                }

                // Eigene Daten hochladen
                database.ref(roomId + "/snakes/" + playerId).set({
                    id: playerId, x: myX, y: myY, tail: myTail, length: myLength, color: myColor, alive: true
                });

                // Futter fressen prüfen
                Object.keys(foods).forEach(fId => {
                    let f = foods[fId];
                    let dist = Math.sqrt((myX - f.x)**2 + (myY - f.y)**2);
                    if(dist < 15) {
                        myLength += 1;
                        // Neues Futter auf der Riesen-Map platzieren
                        database.ref(roomId + "/food/" + fId).set({
                            x: Math.random() * (MAP_WIDTH-20) + 10,
                            y: Math.random() * (MAP_HEIGHT-20) + 10,
                            color: 'hsl(' + Math.random() * 360 + ', 100%, 60%)'
                        });
                    }
                });

                // Kollision / Crash in andere Schlangen
                Object.keys(snakes).forEach(sId => {
                    if(sId !== playerId && snakes[sId].alive) {
                        let other = snakes[sId];
                        let otherTail = other.tail || [];
                        
                        for(let i = 4; i < otherTail.length; i += 2) {
                            let segment = otherTail[i];
                            let distToBody = Math.sqrt((myX - segment.x)**2 + (myY - segment.y)**2);
                            if(distToBody < 14) {
                                // CRASH! Du bist tot.
                                alive = false;
                                database.ref(roomId + "/snakes/" + playerId).update({ alive: false });
                                
                                // Nachricht im Chat für alle anzeigen
                                database.ref(roomId + "/chat").push({ user: "📢 SERVER", text: `${playerId} ist zerschellt!`, color: "#ef4444" });
                                
                                // Automatisch als kleine Schlange neu spawnen nach 1 Sekunde
                                setTimeout(respawn, 1000);
                            }
                        }
                    }
                });
            }

            drawArena();
        }

        // --- ZEICHNEN MIT KAMERA VERFOLGUNG ---
        function drawArena() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Kamera-Fokus berechnen (Zentriert auf meine Schlange)
            let camX = myX - canvas.width / 2;
            let camY = myY - canvas.height / 2;

            // Kamera an den absoluten Map-Rändern stoppen (optional, für sauberen Look)
            ctx.save();
            ctx.translate(-camX, -camY); // Schiebt das Spielfeld passend zur Bewegung

            // 1. Spielfeldrand-Barriere zeichnen
            ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 5;
            ctx.strokeRect(0, 0, MAP_WIDTH, MAP_HEIGHT);

            // 2. Kachel-Hintergrundmuster im Grid-Look
            ctx.strokeStyle = "#1f2937"; ctx.lineWidth = 1;
            for(let x=0; x<MAP_WIDTH; x+=50) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_HEIGHT); ctx.stroke(); }
            for(let y=0; y<MAP_HEIGHT; y+=50) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_WIDTH, y); ctx.stroke(); }

            // 3. Futter zeichnen
            Object.keys(foods).forEach(fId => {
                let f = foods[fId];
                ctx.beginPath(); ctx.arc(f.x, f.y, 5, 0, Math.PI * 2);
                ctx.fillStyle = f.color; ctx.fill(); ctx.closePath();
            });

            // 4. Alle Schlangen im Raum live zeichnen
            let list = [];
            Object.keys(snakes).forEach(sId => {
                let s = snakes[sId];
                if(!s.alive) return;

                list.push({id: s.id, score: s.length});
                let t = s.tail || [];
                
                // Schlangenkörper gliedern
                for(let i = t.length - 1; i >= 0; i -= 2) {
                    ctx.beginPath();
                    ctx.arc(t[i].x, t[i].y, 10 + (i/t.length)*3, 0, Math.PI * 2);
                    ctx.fillStyle = s.color; ctx.fill(); ctx.closePath();
                }

                // Kopf der Schlange zeichnen
                ctx.beginPath(); ctx.arc(s.x, s.y, 13, 0, Math.PI * 2);
                ctx.fillStyle = "white"; ctx.fill(); ctx.closePath();
                
                // Namens-Tag über der Schlange anzeigen
                ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.font = "12px sans-serif";
                ctx.fillText(s.id, s.x - 20, s.y - 20);
            });

            ctx.restore(); // Kamera-Verschiebung zurücksetzen für UI-Elemente

            // 5. Leaderboard Text aktualisieren
            list.sort((a,b) => b.score - a.score);
            let html = "";
            list.slice(0, 5).forEach((player, index) => {
                html += `<div>${index+1}. ${player.id === playerId ? "<b>DU</b>" : player.id} (${player.score})</div>`;
            });
            document.getElementById("leaderboardList").innerHTML = html;
        }

        // Fenster-Größenänderung abfangen (falls iPad gedreht wird)
        window.addEventListener("resize", () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

        window.onbeforeunload = function() {
            if(roomId && playerId) database.ref(roomId + "/snakes/" + playerId).remove();
        };
    </script>
</body>
</html>
