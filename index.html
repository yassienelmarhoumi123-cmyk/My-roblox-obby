<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stickman Multiplayer Fight</title>
    <!-- PeerJS für den Multiplayer-Netzwerkcode -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #menu {
            position: absolute;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,255,100,0.3);
            z-index: 10;
        }
        input, button {
            padding: 10px;
            font-size: 16px;
            margin: 5px;
            border-radius: 5px;
            border: none;
        }
        button {
            background: #00ff66;
            color: #111;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #00cc52; }
        canvas {
            background: linear-gradient(to bottom, #222, #050505);
            border-bottom: 4px solid #00ff66;
            display: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            font-size: 20px;
            font-weight: bold;
            display: none;
            width: 800px;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div id="menu">
        <h1>Stickman Fight Multiplayer</h1>
        <p>Kämpfe gegen deinen Freund über das Internet!</p>
        <button onclick="hostGame()">Spiel erstellen (Host)</button>
        <br><br>
        <input type="text" id="joinId" placeholder="Host Code eingeben...">
        <button onclick="joinGame()">Beitreten</button>
        <p id="status" style="color: #00ff66; margin-top: 15px;"></p>
    </div>

    <div id="ui">
        <div id="p1Health" style="color: #ff3333;">Spieler 1 HP: 100</div>
        <div id="p2Health" style="color: #3388ff;">Spieler 2 HP: 100</div>
    </div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let peer, conn;
    let isHost = false;
    let gameStarted = false;

    // Spieler-Objekte
    let p1 = { x: 150, y: 300, w: 30, h: 70, vx: 0, vy: 0, hp: 100, color: "#ff3333", facing: 1, attacking: false };
    let p2 = { x: 620, y: 300, w: 30, h: 70, vx: 0, vy: 0, hp: 100, color: "#3388ff", facing: -1, attacking: false };

    let keys = {};

    window.addEventListener("keydown", (e) => keys[e.key] = true);
    window.addEventListener("keyup", (e) => keys[e.key] = false);

    function hostGame() {
        peer = new Peer();
        peer.on("open", (id) => {
            document.getElementById("status").innerText = "Dein Code: " + id + "\nWarte auf Mitspieler...";
        });
        peer.on("connection", (c) => {
            conn = c;
            isHost = true;
            setupConnection();
        });
    }

    function joinGame() {
        const id = document.getElementById("joinId").value;
        peer = new Peer();
        peer.on("open", () => {
            conn = peer.connect(id);
            isHost = false;
            setupConnection();
        });
    }

    function setupConnection() {
        conn.on("open", () => {
            document.getElementById("menu").style.display = "none";
            canvas.style.display = "block";
            document.getElementById("ui").style.display = "flex";
            gameStarted = true;
            loop();
        });

        conn.on("data", (data) => {
            if (isHost) {
                // Host empfängt Steuerung von Spieler 2
                p2.x = data.x;
                p2.y = data.y;
                p2.vx = data.vx;
                p2.vy = data.vy;
                p2.hp = data.hp;
                p2.attacking = data.attacking;
            } else {
                // Client empfängt komplette Welt vom Host
                p1 = data.p1;
                p2 = data.p2;
            }
        });
    }

    function updatePhysics(player) {
        // Schwerkraft
        player.vy += 0.5;
        player.y += player.vy;

        // Bodenkollision
        if (player.y + player.h > 370) {
            player.y = 370 - player.h;
            player.vy = 0;
        }

        // Grenzen
        if (player.x < 0) player.x = 0;
        if (player.x > canvas.width - player.w) player.x = canvas.width - player.w;
    }

    function loop() {
        if (!gameStarted) return;

        if (isHost) {
            // Host berechnet die Logik für Spieler 1 (A/D = Bewegen, W = Springen, Leertaste = Schlag)
            if (keys["a"] || keys["A"]) { p1.vx = -4; p1.facing = -1; }
            else if (keys["d"] || keys["D"]) { p1.vx = 4; p1.facing = 1; }
            else { p1.vx = 0; }

            if ((keys["w"] || keys["W"]) && p1.y + p1.h >= 370) {
                p1.vy = -12;
            }

            p1.attacking = keys[" "] ? true : false;
            p1.x += p1.vx;

            updatePhysics(p1);
            updatePhysics(p2);

            // Schlag-Kollisionsabfrage (Host prüft Treffer)
            if (p1.attacking && Math.abs(p1.x - p2.x) < 50 && Math.abs(p1.y - p2.y) < 50) {
                p2.hp -= 0.5;
            }
            if (p2.attacking && Math.abs(p2.x - p1.x) < 50 && Math.abs(p2.y - p1.y) < 50) {
                p1.hp -= 0.5;
            }

            // Daten an Client senden
            conn.send({ p1: p1, p2: p2 });

        } else {
            // Client steuert Spieler 2 (Pfeiltasten / Enter zum Schlagen)
            if (keys["ArrowLeft"]) { p2.vx = -4; p2.facing = -1; }
            else if (keys["ArrowRight"]) { p2.vx = 4; p2.facing = 1; }
            else { p2.vx = 0; }

            if (keys["ArrowUp"] && p2.y + p2.h >= 370) {
                p2.vy = -12;
            }

            p2.attacking = keys["Enter"] ? true : false;
            p2.x += p2.vx;
            updatePhysics(p2);

            // Eigene Daten an Host senden
            conn.send({ x: p2.x, y: p2.y, vx: p2.vx, vy: p2.vy, hp: p2.hp, attacking: p2.attacking });
        }

        draw();
        requestAnimationFrame(loop);
    }

    function drawStickman(p) {
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 4;
        ctx.fillStyle = p.color;

        let cx = p.x + p.w / 2;
        let cy = p.y;

        // Kopf
        ctx.beginPath();
        ctx.arc(cx, cy + 12, 12, 0, Math.PI * 2);
        ctx.stroke();

        // Körper
        ctx.beginPath();
        ctx.moveTo(cx, cy + 24);
        ctx.lineTo(cx, cy + 50);
        ctx.stroke();

        // Arme & Schlag-Animation
        ctx.beginPath();
        ctx.moveTo(cx, cy + 30);
        let armX = p.attacking ? cx + (p.facing * 35) : cx + (p.facing * 15);
        ctx.lineTo(armX, cy + 40);
        ctx.stroke();

        // Beine
        ctx.beginPath();
        ctx.moveTo(cx, cy + 50);
        ctx.lineTo(cx - 10, cy + 70);
        ctx.moveTo(cx, cy + 50);
        ctx.lineTo(cx + 10, cy + 70);
        ctx.stroke();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Boden zeichnen
        ctx.fillStyle = "#00ff66";
        ctx.fillRect(0, 370, canvas.width, 80);

        // Figuren zeichnen
        drawStickman(p1);
        drawStickman(p2);

        // UI aktualisieren
        document.getElementById("p1Health").innerText = "Spieler 1 (Rot) HP: " + Math.max(0, Math.floor(p1.hp));
        document.getElementById("p2Health").innerText = "Spieler 2 (Blau) HP: " + Math.max(0, Math.floor(p2.hp));
    }
</script>

</body>
</html>
