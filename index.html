<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Classroom Resources</title>
    <style>
        body { 
            background-color: #8a2be2; 
            color: white; 
            font-family: sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }
        h1 { margin-bottom: 30px; font-size: 2.5em; }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); 
            gap: 25px; 
            max-width: 900px;
            margin: 0 auto;
        }

        .card { 
            background: rgba(0, 0, 0, 0.4); 
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px; 
            padding: 15px; 
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .card:hover { transform: translateY(-5px); background: rgba(0, 0, 0, 0.6); }
        
        /* Das Bild-Styling */
        .card-img { 
            width: 100%; 
            aspect-ratio: 1/1; 
            background-color: #333;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #game-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 9999;
        }

        iframe { width: 100%; height: 100%; border: none; }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: red;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            z-index: 10000;
        }
    </style>
</head>
<body>

    <div id="game-overlay">
        <button class="close-btn" onclick="closeGame()">X ZU</button>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <h1>Classroom Resources</h1>

    <div class="grid">
        <!-- Basket Random -->
        <div class="card" onclick="openGame('https://basketballrandom.gitlab.io/')">
            <div class="card-img">🏀</div>
            <div class="game-title">Basket Random</div>
        </div>

        <!-- Granny 2 -->
        <div class="card" onclick="openGame('https://horrorgamesfree.com/granny2')">
            <div class="card-img">👵</div>
            <div class="game-title">Granny 2</div>
        </div>
    </div>

    <script>
        function openGame(url) {
            document.getElementById('game-frame').src = url;
            document.getElementById('game-overlay').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeGame() {
            document.getElementById('game-overlay').style.display = 'none';
            document.getElementById('game-frame').src = '';
            document.body.style.overflow = 'auto';
        }
    </script>

</body>
</html>
