<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#aebbc7}
body{user-select:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;outline:none}
#topbar{position:fixed;left:22px;top:20px;display:flex;align-items:center;gap:12px;z-index:5;pointer-events:none}
#mark{width:38px;height:38px;border:1px solid #ffffff36;border-radius:12px;background:#111820b8;display:grid;place-items:center;backdrop-filter:blur(12px);box-shadow:0 8px 30px #0002}
#mark svg{width:20px;height:20px}
#heading{font-size:12px;font-weight:800;letter-spacing:.16em;color:#fff;text-shadow:0 2px 10px #0005}
#subheading{font-size:10px;color:#e5eaf0b8;letter-spacing:.12em;margin-top:3px}
#status{position:fixed;right:22px;top:22px;z-index:5;border:1px solid #ffffff35;border-radius:999px;padding:8px 12px;background:#1118209c;color:#e9eef2;font-size:10px;font-weight:700;letter-spacing:.12em;backdrop-filter:blur(12px)}
#status:before{content:"";display:inline-block;width:7px;height:7px;margin-right:8px;border-radius:50%;background:#e9b45e;box-shadow:0 0 10px #e9b45e;vertical-align:1px}
#status.ready:before{background:#79d7a1;box-shadow:0 0 10px #79d7a1}
#help{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:18px;padding:11px 16px;border:1px solid #ffffff30;border-radius:14px;background:#111820b8;backdrop-filter:blur(14px);box-shadow:0 12px 40px #0002;color:#eef2f6;white-space:nowrap}
.help-item{display:flex;align-items:center;gap:8px;font-size:11px;color:#e9edf2c9}
.keys{display:flex;gap:3px}
.key{height:23px;min-width:23px;padding:0 6px;display:grid;place-items:center;border:1px solid #ffffff38;border-bottom-width:2px;border-radius:6px;background:#ffffff12;color:#fff;font-size:10px;font-weight:800}
#camera-reset{position:fixed;right:22px;bottom:22px;z-index:5;width:42px;height:42px;border:1px solid #ffffff30;border-radius:13px;background:#111820b8;color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(12px)}
#camera-reset:hover{background:#26313c}
#camera-reset svg{width:18px;height:18px}
#loading{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:linear-gradient(180deg,#20283222,#10151dcc);color:#fff;transition:opacity .45s ease,visibility .45s ease}
#loading.hidden{opacity:0;visibility:hidden;pointer-events:none}
.spinner{width:36px;height:36px;border:2px solid #ffffff32;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#load-title{font-size:13px;font-weight:800;letter-spacing:.18em}
#load-copy{font-size:11px;color:#ffffff9c;letter-spacing:.04em;text-align:center;max-width:260px;line-height:1.6}
#error{display:none;max-width:340px;padding:18px 20px;border:1px solid #ffffff30;border-radius:14px;background:#111820ed;text-align:center;line-height:1.6;font-size:12px;color:#f0d9d9}
#credit{position:fixed;left:22px;bottom:22px;z-index:5;color:#edf1f5a0;font-size:9px;letter-spacing:.04em;pointer-events:none}
@media(max-width:650px){
 #topbar{left:14px;top:14px}#status{right:14px;top:14px;font-size:9px}
 #help{bottom:14px;gap:10px;padding:9px 11px;max-width:calc(100% - 28px);white-space:normal;justify-content:center;flex-wrap:wrap}
 .help-item{font-size:10px}#camera-reset{right:14px;bottom:82px;width:38px;height:38px}
 #credit{left:14px;bottom:66px}
}

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const root = document.getElementById("game");
const statusEl = document.getElementById("status");
const loadingEl = document.getElementById("loading");
const loadTitle = document.getElementById("load-title");
const loadCopy = document.getElementById("load-copy");
const spinner = document.getElementById("spinner");
const errorEl = document.getElementById("error");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb9c6d2);
scene.fog = new THREE.Fog(0xb9c6d2, 55, 185);

const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 260);
camera.position.set(0, 2.8, -6);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false, powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.8));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
root.appendChild(renderer.domElement);


const hemi = new THREE.HemisphereLight(0xe8f1ff, 0x646b75, 1.65);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xffedda, 2.25);
keyLight.position.set(-7, 13, -5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048,2048);
keyLight.shadow.camera.left = -16;
keyLight.shadow.camera.right = 16;
keyLight.shadow.camera.top = 16;
keyLight.shadow.camera.bottom = -16;
keyLight.shadow.bias = -0.00025;
keyLight.shadow.normalBias = 0.025;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xc4d9ff, 0.65);
fillLight.position.set(8, 6, 7);
scene.add(fillLight);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(600,600),
  new THREE.MeshStandardMaterial({color:0x747b82, roughness:0.96, metalness:0})
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.025;
ground.receiveShadow = true;
scene.add(ground);


/* ------------------------------------------------------------------
   PROCEDURAL CITY BLOCK
   Buildings and road layout are built locally with Three.js.
   No additional city assets or downloads are required.
------------------------------------------------------------------- */
function buildCity() {
  const city = new THREE.Group();
  city.name = "Detailed Downtown Buildings";
  scene.add(city);

  const roadMat = new THREE.MeshStandardMaterial({ color: 0x30363c, roughness: 0.98 });
  const laneMat = new THREE.MeshStandardMaterial({ color: 0xe2d7b8, roughness: 0.9 });
  const darkMetal = new THREE.MeshStandardMaterial({ color: 0x343c42, roughness: 0.7, metalness: 0.28 });
  const balconyGlass = new THREE.MeshStandardMaterial({
    color: 0x9bb5bf, roughness: 0.22, metalness: 0.16,
    transparent: true, opacity: 0.76
  });
  const windowGlass = new THREE.MeshStandardMaterial({
    color: 0x68899a, roughness: 0.23, metalness: 0.2,
    envMapIntensity: 0.8
  });
  const windowDark = new THREE.MeshStandardMaterial({
    color: 0x263640, roughness: 0.26, metalness: 0.16
  });
  const concreteTrim = new THREE.MeshStandardMaterial({ color: 0xd1cec5, roughness: 0.88 });
  const brickTrim = new THREE.MeshStandardMaterial({ color: 0x785c50, roughness: 0.94 });

  let seed = 18473;
  const rand = () => {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  };

  const makeBox = (parent, name, width, height, depth, material, x, y, z) => {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material);
    mesh.name = name;
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    parent.add(mesh);
    return mesh;
  };

  const streetPositions = [-60, -36, -12, 12, 36, 60];
  const roadLength = 190;

  // Fine procedural asphalt grain, generated locally without external textures.
  const asphaltSize = 256;
  const asphaltPixels = new Uint8Array(asphaltSize * asphaltSize * 4);
  for (let i = 0; i < asphaltSize * asphaltSize; i++) {
    const grain = 48 + Math.floor(rand() * 30);
    const speckle = rand() > 0.985 ? 18 : 0;
    const value = Math.min(112, grain + speckle);
    const p = i * 4;
    asphaltPixels[p] = value;
    asphaltPixels[p + 1] = value + 2;
    asphaltPixels[p + 2] = value + 4;
    asphaltPixels[p + 3] = 255;
  }
  const asphaltTexture = new THREE.DataTexture(
    asphaltPixels, asphaltSize, asphaltSize, THREE.RGBAFormat
  );
  asphaltTexture.colorSpace = THREE.SRGBColorSpace;
  asphaltTexture.wrapS = THREE.RepeatWrapping;
  asphaltTexture.wrapT = THREE.RepeatWrapping;
  asphaltTexture.magFilter = THREE.LinearFilter;
  asphaltTexture.minFilter = THREE.LinearMipmapLinearFilter;
  asphaltTexture.generateMipmaps = true;
  asphaltTexture.needsUpdate = true;

  const asphaltAlongZ = new THREE.MeshStandardMaterial({
    color: 0x85888a, map: asphaltTexture.clone(), roughness: 0.99, metalness: 0
  });
  asphaltAlongZ.map.repeat.set(7, 160);
  asphaltAlongZ.map.needsUpdate = true;
  const asphaltAlongX = new THREE.MeshStandardMaterial({
    color: 0x85888a, map: asphaltTexture.clone(), roughness: 0.99, metalness: 0
  });
  asphaltAlongX.map.repeat.set(160, 7);
  asphaltAlongX.map.needsUpdate = true;

  const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0xa4a5a2, roughness: 0.96 });
  const curbMat = new THREE.MeshStandardMaterial({ color: 0xc3c3bd, roughness: 0.92 });
  const drainMat = new THREE.MeshStandardMaterial({ color: 0x333a3e, roughness: 0.82, metalness: 0.35 });
  const manholeMat = new THREE.MeshStandardMaterial({ color: 0x555c60, roughness: 0.7, metalness: 0.5 });
  const paverJointMat = new THREE.MeshStandardMaterial({ color: 0x777d7c, roughness: 1 });

  const streetPositions = [-60, -36, -12, 12, 36, 60];
  const roadLength = 190;

  // Asphalt carriageways with subtle grain and expanded paved sidewalks.
  for (const x of streetPositions) {
    const foundation = makeBox(city, "road asphalt foundation", 8.6, 0.08, roadLength,
      roadMat, x, 0.015, 0);
    foundation.receiveShadow = true;
    const surface = new THREE.Mesh(new THREE.PlaneGeometry(8.6, roadLength), asphaltAlongZ);
    surface.name = "textured asphalt road surface";
    surface.rotation.x = -Math.PI / 2;
    surface.position.set(x, 0.058, 0);
    surface.receiveShadow = true;
    city.add(surface);

    for (const side of [-1, 1]) {
      makeBox(city, "raised stone curb", 0.2, 0.2, roadLength, curbMat,
        x + side * 4.42, 0.12, 0);
      makeBox(city, "wide paved sidewalk", 1.4, 0.13, roadLength, sidewalkMat,
        x + side * 5.25, 0.055, 0);
    }
  }

  for (const z of streetPositions) {
    const foundation = makeBox(city, "road asphalt foundation", roadLength, 0.08, 8.6,
      roadMat, 0, 0.016, z);
    foundation.receiveShadow = true;
    const surface = new THREE.Mesh(new THREE.PlaneGeometry(roadLength, 8.6), asphaltAlongX);
    surface.name = "textured asphalt road surface";
    surface.rotation.x = -Math.PI / 2;
    surface.position.set(0, 0.059, z);
    surface.receiveShadow = true;
    city.add(surface);

    for (const side of [-1, 1]) {
      makeBox(city, "raised stone curb", roadLength, 0.2, 0.2, curbMat,
        0, 0.12, z + side * 4.42);
      makeBox(city, "wide paved sidewalk", roadLength, 0.13, 1.4, sidewalkMat,
        0, 0.055, z + side * 5.25);
    }
  }

  // Sidewalk slab joints: a visible regular paving pattern.
  const seamsZ = [];
  const seamsX = [];
  const seamDummy = new THREE.Object3D();
  const seamZGeometry = new THREE.BoxGeometry(1.35, 0.012, 0.035);
  const seamXGeometry = new THREE.BoxGeometry(0.035, 0.012, 1.35);
  for (const x of streetPositions) {
    for (const side of [-1, 1]) {
      for (let z = -94; z <= 94; z += 2.7) {
        seamDummy.position.set(x + side * 5.25, 0.122, z);
        seamDummy.rotation.set(0, 0, 0);
        seamDummy.updateMatrix();
        seamsZ.push(seamDummy.matrix.clone());
      }
    }
  }
  for (const z of streetPositions) {
    for (const side of [-1, 1]) {
      for (let x = -94; x <= 94; x += 2.7) {
        seamDummy.position.set(x, 0.122, z + side * 5.25);
        seamDummy.rotation.set(0, 0, 0);
        seamDummy.updateMatrix();
        seamsX.push(seamDummy.matrix.clone());
      }
    }
  }
  const seamMeshZ = new THREE.InstancedMesh(seamZGeometry, paverJointMat, seamsZ.length);
  const seamMeshX = new THREE.InstancedMesh(seamXGeometry, paverJointMat, seamsX.length);
  seamsZ.forEach((m, i) => seamMeshZ.setMatrixAt(i, m));
  seamsX.forEach((m, i) => seamMeshX.setMatrixAt(i, m));
  seamMeshZ.instanceMatrix.needsUpdate = true;
  seamMeshX.instanceMatrix.needsUpdate = true;
  city.add(seamMeshZ, seamMeshX);

  // Dashed white centre lines and solid road-edge lines.
  const centerZ = [];
  const centerX = [];
  const edgeZ = [];
  const edgeX = [];
  const markingDummy = new THREE.Object3D();

  for (const x of streetPositions) {
    for (let z = -92; z <= 92; z += 7.2) {
      markingDummy.position.set(x, 0.074, z);
      markingDummy.rotation.set(0, 0, 0);
      markingDummy.updateMatrix();
      centerZ.push(markingDummy.matrix.clone());
    }
    for (const side of [-1, 1]) {
      markingDummy.position.set(x + side * 3.88, 0.071, 0);
      markingDummy.updateMatrix();
      edgeZ.push(markingDummy.matrix.clone());
    }
  }
  for (const z of streetPositions) {
    for (let x = -92; x <= 92; x += 7.2) {
      markingDummy.position.set(x, 0.074, z);
      markingDummy.rotation.set(0, Math.PI / 2, 0);
      markingDummy.updateMatrix();
      centerX.push(markingDummy.matrix.clone());
    }
    for (const side of [-1, 1]) {
      markingDummy.position.set(0, 0.071, z + side * 3.88);
      markingDummy.rotation.set(0, Math.PI / 2, 0);
      markingDummy.updateMatrix();
      edgeX.push(markingDummy.matrix.clone());
    }
  }
  const centerMeshZ = new THREE.InstancedMesh(new THREE.BoxGeometry(0.13, 0.022, 2.8), laneMat, centerZ.length);
  const centerMeshX = new THREE.InstancedMesh(new THREE.BoxGeometry(2.8, 0.022, 0.13), laneMat, centerX.length);
  const edgeMeshZ = new THREE.InstancedMesh(new THREE.BoxGeometry(0.10, 0.018, roadLength), laneMat, edgeZ.length);
  const edgeMeshX = new THREE.InstancedMesh(new THREE.BoxGeometry(roadLength, 0.018, 0.10), laneMat, edgeX.length);
  centerZ.forEach((m, i) => centerMeshZ.setMatrixAt(i, m));
  centerX.forEach((m, i) => centerMeshX.setMatrixAt(i, m));
  edgeZ.forEach((m, i) => edgeMeshZ.setMatrixAt(i, m));
  edgeX.forEach((m, i) => edgeMeshX.setMatrixAt(i, m));
  for (const mesh of [centerMeshZ, centerMeshX, edgeMeshZ, edgeMeshX]) {
    mesh.instanceMatrix.needsUpdate = true;
  }
  city.add(centerMeshZ, centerMeshX, edgeMeshZ, edgeMeshX);

  // Zebra crossings at every street intersection.
  const crossZ = [];
  const crossX = [];
  for (const x of streetPositions) {
    for (const z of streetPositions) {
      for (let i = -3; i <= 3; i++) {
        markingDummy.position.set(x + i * 0.68, 0.078, z);
        markingDummy.rotation.set(0, 0, 0);
        markingDummy.updateMatrix();
        crossZ.push(markingDummy.matrix.clone());

        markingDummy.position.set(x, 0.078, z + i * 0.68);
        markingDummy.rotation.set(0, 0, 0);
        markingDummy.updateMatrix();
        crossX.push(markingDummy.matrix.clone());
      }
    }
  }
  const zebraZ = new THREE.InstancedMesh(
    new THREE.BoxGeometry(0.43, 0.025, 7.75), laneMat, crossZ.length
  );
  const zebraX = new THREE.InstancedMesh(
    new THREE.BoxGeometry(7.75, 0.025, 0.43), laneMat, crossX.length
  );
  crossZ.forEach((m, i) => zebraZ.setMatrixAt(i, m));
  crossX.forEach((m, i) => zebraX.setMatrixAt(i, m));
  zebraZ.instanceMatrix.needsUpdate = true;
  zebraX.instanceMatrix.needsUpdate = true;
  city.add(zebraZ, zebraX);

  // Drain grates close to curbs and cast-iron manhole covers between junctions.
  const drainGeometry = new THREE.BoxGeometry(0.92, 0.035, 0.22);
  const drainCount = streetPositions.length * 2 * 7 * 2;
  const drains = new THREE.InstancedMesh(drainGeometry, drainMat, drainCount);
  let drainIndex = 0;
  for (const x of streetPositions) {
    for (const side of [-1, 1]) {
      for (let z = -84; z <= 84; z += 28) {
        markingDummy.position.set(x + side * 3.55, 0.073, z);
        markingDummy.rotation.set(0, 0, 0);
        markingDummy.updateMatrix();
        drains.setMatrixAt(drainIndex++, markingDummy.matrix);
      }
    }
  }
  for (const z of streetPositions) {
    for (const side of [-1, 1]) {
      for (let x = -84; x <= 84; x += 28) {
        markingDummy.position.set(x, 0.073, z + side * 3.55);
        markingDummy.rotation.set(0, Math.PI / 2, 0);
        markingDummy.updateMatrix();
        drains.setMatrixAt(drainIndex++, markingDummy.matrix);
      }
    }
  }
  drains.count = drainIndex;
  drains.instanceMatrix.needsUpdate = true;
  city.add(drains);

  const manholeGeometry = new THREE.CylinderGeometry(0.36, 0.36, 0.035, 32);
  const manholes = new THREE.InstancedMesh(
    manholeGeometry, manholeMat, streetPositions.length * 5 * 2
  );
  let manholeIndex = 0;
  for (const x of streetPositions) {
    for (const z of [-48, -24, 0, 24, 48]) {
      markingDummy.position.set(x + 1.8, 0.083, z);
      markingDummy.rotation.set(0, 0, 0);
      markingDummy.updateMatrix();
      manholes.setMatrixAt(manholeIndex++, markingDummy.matrix);
    }
  }
  for (const z of streetPositions) {
    for (const x of [-48, -24, 0, 24, 48]) {
      markingDummy.position.set(x, 0.084, z + 1.8);
      markingDummy.rotation.set(0, 0, 0);
      markingDummy.updateMatrix();
      manholes.setMatrixAt(manholeIndex++, markingDummy.matrix);
    }
  }
  manholes.count = manholeIndex;
  manholes.instanceMatrix.needsUpdate = true;
  city.add(manholes);

  // Detailed, instanced window assemblies: outer frame, glass, mullions and sill.
  const maxWindows = 12000;
  const frames = new THREE.InstancedMesh(
    new THREE.BoxGeometry(1.18, 1.62, 0.16), darkMetal, maxWindows
  );
  const panes = new THREE.InstancedMesh(
    new THREE.BoxGeometry(0.96, 1.38, 0.075), windowGlass, maxWindows
  );
  const verticalBars = new THREE.InstancedMesh(
    new THREE.BoxGeometry(0.045, 1.36, 0.105), darkMetal, maxWindows
  );
  const horizontalBars = new THREE.InstancedMesh(
    new THREE.BoxGeometry(0.96, 0.045, 0.105), darkMetal, maxWindows
  );
  const sills = new THREE.InstancedMesh(
    new THREE.BoxGeometry(1.25, 0.09, 0.28), concreteTrim, maxWindows
  );
  const lintels = new THREE.InstancedMesh(
    new THREE.BoxGeometry(1.25, 0.08, 0.18), concreteTrim, maxWindows
  );
  const instancedWindows = [frames, panes, verticalBars, horizontalBars, sills, lintels];
  for (const mesh of instancedWindows) {
    mesh.castShadow = false;
    mesh.receiveShadow = false;
    city.add(mesh);
  }
  const winDummy = new THREE.Object3D();
  let windowIndex = 0;

  const addWindow = (x, y, z, rotationY) => {
    if (windowIndex >= maxWindows) return;
    const rotateOffset = (ox, oy, oz) => {
      const offset = new THREE.Vector3(ox, oy, oz).applyAxisAngle(
        new THREE.Vector3(0, 1, 0), rotationY
      );
      return new THREE.Vector3(x, y, z).add(offset);
    };
    const put = (mesh, px, py, pz) => {
      const p = rotateOffset(px, py, pz);
      winDummy.position.copy(p);
      winDummy.rotation.set(0, rotationY, 0);
      winDummy.scale.set(1, 1, 1);
      winDummy.updateMatrix();
      mesh.setMatrixAt(windowIndex, winDummy.matrix);
    };
    put(frames, 0, 0, 0);
    put(panes, 0, 0, 0.055);
    put(verticalBars, 0, 0, 0.11);
    put(horizontalBars, 0, 0, 0.11);
    put(sills, 0, -0.82, 0.08);
    put(lintels, 0, 0.82, 0.07);
    windowIndex++;
  };

  const facadePalette = [
    { wall: 0xb9b5ab, trim: 0xd8d3c8, accent: 0x8b8175, kind: "stone" },
    { wall: 0x9ca7a9, trim: 0xc2c8c5, accent: 0x5f7078, kind: "concrete" },
    { wall: 0xa77e69, trim: 0xd2b59d, accent: 0x785447, kind: "brick" },
    { wall: 0xc7bda9, trim: 0xe1d8c7, accent: 0x8e7964, kind: "stucco" },
    { wall: 0x879399, trim: 0xb8c0c2, accent: 0x475963, kind: "modern" },
    { wall: 0xb0a9a0, trim: 0xd3cbc0, accent: 0x77716b, kind: "stone" },
    { wall: 0x9f8d7e, trim: 0xc8b39e, accent: 0x6d5b50, kind: "brick" },
    { wall: 0xd0c9bc, trim: 0xe7e0d3, accent: 0x8f9898, kind: "stucco" }
  ];
  const plotPositions = [-72, -48, -24, 24, 48, 72];

  for (const x of plotPositions) {
    for (const z of plotPositions) {
      // Leave the central crossing open so the player has room to move.
      if (Math.abs(x) === 24 && Math.abs(z) === 24) continue;

      const style = Math.floor(rand() * 4);
      const floors = style === 0 ? 4 + Math.floor(rand() * 4) : 6 + Math.floor(rand() * 8);
      const floorHeight = style === 0 ? 3.05 : 2.9;
      const height = floors * floorHeight;
      const width = 10.2 + rand() * 2.0;
      const depth = 10.2 + rand() * 2.0;
      const palette = facadePalette[Math.floor(rand() * facadePalette.length)];
      const wallMat = new THREE.MeshStandardMaterial({
        color: palette.wall, roughness: palette.kind === "modern" ? 0.72 : 0.92
      });
      const trimMat = new THREE.MeshStandardMaterial({ color: palette.trim, roughness: 0.86 });
      const accentMat = new THREE.MeshStandardMaterial({ color: palette.accent, roughness: 0.9 });
      const building = new THREE.Group();
      building.position.set(x + (rand() - 0.5) * 1.0, 0, z + (rand() - 0.5) * 1.0);
      building.name = "Detailed " + palette.kind + " apartment building";
      city.add(building);

      // Main facade, lower stone plinth and darker ground-floor band.
      const body = makeBox(building, "plastered facade", width, height, depth, wallMat, 0, height / 2, 0);
      body.receiveShadow = true;
      makeBox(building, "stone base course", width + 0.32, 0.46, depth + 0.32,
        accentMat, 0, 0.23, 0);
      makeBox(building, "ground floor fascia", width + 0.08, 0.18, depth + 0.08,
        trimMat, 0, 2.62, 0);

      // Repeated horizontal floor courses give the facade a believable scale.
      for (let level = 1; level < floors; level++) {
        const bandY = level * floorHeight;
        makeBox(building, "front floor belt", width + 0.12, 0.075, 0.16,
          trimMat, 0, bandY, depth / 2 + 0.035);
        makeBox(building, "back floor belt", width + 0.12, 0.075, 0.16,
          trimMat, 0, bandY, -depth / 2 - 0.035);
        makeBox(building, "right floor belt", 0.16, 0.075, depth,
          trimMat, width / 2 + 0.035, bandY, 0);
        makeBox(building, "left floor belt", 0.16, 0.075, depth,
          trimMat, -width / 2 - 0.035, bandY, 0);
      }

      // Corner pilasters and framed front facade details.
      for (const side of [-1, 1]) {
        makeBox(building, "front vertical pilaster", 0.2, height, 0.24,
          accentMat, side * (width / 2 - 0.16), height / 2, depth / 2 + 0.04);
        makeBox(building, "side vertical pilaster", 0.24, height, 0.2,
          accentMat, side * (width / 2 + 0.04), height / 2, 0);
      }

      // Entrance: stone portal, glazed door, side lights and a projecting canopy.
      const entranceZ = depth / 2 + 0.11;
      const doorFrameMat = new THREE.MeshStandardMaterial({ color: 0x515a5e, roughness: 0.72 });
      const doorGlassMat = new THREE.MeshStandardMaterial({
        color: 0x243c49, roughness: 0.22, metalness: 0.15
      });
      makeBox(building, "entrance portal left", 0.13, 2.55, 0.22,
        trimMat, -0.82, 1.28, entranceZ);
      makeBox(building, "entrance portal right", 0.13, 2.55, 0.22,
        trimMat, 0.82, 1.28, entranceZ);
      makeBox(building, "entrance portal top", 1.77, 0.16, 0.22,
        trimMat, 0, 2.48, entranceZ);
      makeBox(building, "glazed apartment entrance door", 1.42, 2.25, 0.07,
        doorGlassMat, 0, 1.18, entranceZ + 0.04);
      makeBox(building, "entrance canopy", 2.55, 0.12, 0.95,
        accentMat, 0, 2.63, depth / 2 + 0.52);
      for (const side of [-1, 1]) {
        makeBox(building, "entry side glazing", 0.72, 1.72, 0.055,
          windowGlass, side * 1.65, 1.22, entranceZ + 0.035);
      }
      makeBox(building, "entry steps", 2.5, 0.12, 0.62,
        concreteTrim, 0, 0.06, depth / 2 + 0.58);

      // Ground-floor shopfronts: broad glazing, narrow metal mullions and a sign band.
      if (style === 2 || style === 3) {
        const shopSignMat = new THREE.MeshStandardMaterial({ color: 0x343d43, roughness: 0.78 });
        makeBox(building, "shop sign fascia", width * 0.68, 0.4, 0.18,
          shopSignMat, 0, 2.48, depth / 2 + 0.13);
        for (const side of [-1, 1]) {
          makeBox(building, "shop display glass", 1.5, 1.8, 0.065,
            windowGlass, side * 2.55, 1.25, depth / 2 + 0.12);
          makeBox(building, "shop glass mullion", 0.055, 1.8, 0.09,
            darkMetal, side * 2.55, 1.25, depth / 2 + 0.16);
        }
      }

      // Four-sided window layout. Ground-floor center is kept clear for the door.
      const makeFacade = (faceWidth, side) => {
        const columns = Math.max(2, Math.floor(faceWidth / 2.25));
        for (let row = 0; row < floors; row++) {
          const py = 1.58 + row * floorHeight;
          for (let col = 0; col < columns; col++) {
            const spread = (col - (columns - 1) / 2) * (faceWidth / (columns + 0.35));
            if (row === 0 && side === "front" && Math.abs(spread) < 1.4) continue;
            if (side === "front") addWindow(building.position.x + spread, py, building.position.z + depth / 2 + 0.10, 0);
            if (side === "back") addWindow(building.position.x + spread, py, building.position.z - depth / 2 - 0.10, Math.PI);
            if (side === "right") addWindow(building.position.x + width / 2 + 0.10, py, building.position.z + spread, Math.PI / 2);
            if (side === "left") addWindow(building.position.x - width / 2 - 0.10, py, building.position.z + spread, -Math.PI / 2);
          }
        }
      };
      makeFacade(width, "front");
      makeFacade(width, "back");
      makeFacade(depth, "right");
      makeFacade(depth, "left");

      // Selected buildings have real projecting balconies with glass balustrades.
      if (style === 1 || (style === 0 && rand() > 0.5)) {
        const columns = Math.max(2, Math.floor(width / 2.5));
        const balconyRows = [];
        for (let row = 2; row < floors - 1; row += (floors > 8 ? 2 : 1)) balconyRows.push(row);
        for (let i = 0; i < Math.min(3, balconyRows.length); i++) {
          const row = balconyRows[i];
          const col = i % columns;
          const spread = (col - (columns - 1) / 2) * (width / (columns + 0.35));
          const balconyZ = depth / 2 + 0.62;
          const balconyY = row * floorHeight + 0.34;
          makeBox(building, "projecting balcony slab", 1.95, 0.13, 1.14,
            accentMat, spread, balconyY, balconyZ);
          makeBox(building, "balcony glass balustrade", 1.82, 0.7, 0.055,
            balconyGlass, spread, balconyY + 0.39, balconyZ + 0.53);
          for (const end of [-1, 1]) {
            makeBox(building, "balcony side railing", 0.055, 0.7, 1.0,
              darkMetal, spread + end * 0.92, balconyY + 0.39, balconyZ + 0.02);
          }
          makeBox(building, "balcony top rail", 1.9, 0.045, 0.075,
            darkMetal, spread, balconyY + 0.76, balconyZ + 0.53);
        }
      }

      // Selected air-conditioning units under some windows add residential detail.
      if (rand() > 0.44) {
        const acY = floorHeight * (2 + Math.floor(rand() * Math.max(1, floors - 3)));
        const acX = (rand() - 0.5) * width * 0.55;
        makeBox(building, "external air conditioning unit", 0.62, 0.32, 0.25,
          new THREE.MeshStandardMaterial({ color: 0xd2d4d0, roughness: 0.8 }),
          acX, acY, depth / 2 + 0.22);
        makeBox(building, "air conditioner grille", 0.42, 0.18, 0.03,
          darkMetal, acX, acY, depth / 2 + 0.37);
      }

      // Roof parapet, coping stones and roof plant equipment.
      const parapetMat = new THREE.MeshStandardMaterial({ color: palette.accent, roughness: 0.9 });
      const parapetH = 0.42;
      makeBox(building, "front roof parapet", width + 0.25, parapetH, 0.2,
        parapetMat, 0, height + parapetH / 2, depth / 2);
      makeBox(building, "rear roof parapet", width + 0.25, parapetH, 0.2,
        parapetMat, 0, height + parapetH / 2, -depth / 2);
      makeBox(building, "left roof parapet", 0.2, parapetH, depth,
        parapetMat, -width / 2, height + parapetH / 2, 0);
      makeBox(building, "right roof parapet", 0.2, parapetH, depth,
        parapetMat, width / 2, height + parapetH / 2, 0);

      const machineMat = new THREE.MeshStandardMaterial({ color: 0x687278, roughness: 0.86 });
      const machineX = (rand() - 0.5) * width * 0.3;
      const machineZ = (rand() - 0.5) * depth * 0.3;
      makeBox(building, "rooftop elevator housing", width * 0.27, 1.45, depth * 0.28,
        machineMat, machineX, height + 0.74, machineZ);
      for (let vent = 0; vent < 3; vent++) {
        makeBox(building, "roof ventilation louvre", 0.09, 0.78, depth * 0.18,
          darkMetal, machineX - 0.25 + vent * 0.25, height + 0.77, machineZ + depth * 0.145);
      }
      if (rand() > 0.55) {
        const tank = new THREE.Mesh(
          new THREE.CylinderGeometry(0.46, 0.46, 1.15, 16),
          machineMat
        );
        tank.name = "rooftop water tank";
        tank.position.set(machineX + 1.1, height + 0.7, machineZ);
        tank.castShadow = true;
        building.add(tank);
      }
    }
  }

  // Publish all window components in a handful of draw calls.
  for (const mesh of instancedWindows) {
    mesh.count = windowIndex;
    mesh.instanceMatrix.needsUpdate = true;
  }

  // A little city plaza remains free around the player spawn point.
  const plaza = makeBox(city, "central paved plaza", 20, 0.045, 20,
    new THREE.MeshStandardMaterial({ color: 0x9da19e, roughness: 0.94 }), 0, 0.012, 0);
  plaza.receiveShadow = true;

  console.info("Detailed city generated:", plotPositions.length * plotPositions.length - 4, "buildings");
}

buildCity();

const player = new THREE.Group();
scene.add(player);

const groundShadow = new THREE.Mesh(
  new THREE.CircleGeometry(0.52,48),
  new THREE.MeshBasicMaterial({color:0x20252b, transparent:true, opacity:0.15, depthWrite:false})
);
groundShadow.rotation.x = -Math.PI/2;
groundShadow.position.y = 0.004;
player.add(groundShadow);

const clock = new THREE.Clock();
const keys = Object.create(null);
const velocity = new THREE.Vector3();
const moveDir = new THREE.Vector3();
const forward = new THREE.Vector3();
const right = new THREE.Vector3();
const desiredVelocity = new THREE.Vector3();

let character = null;
let mixer = null;
let walkAction = null;
let runAction = null;
let activeAction = null;
let cameraYaw = 0;
let cameraPitch = 0.16;
let cameraDistance = 5.6;
let dragging = false;
let lastPointerX = 0;
let lastPointerY = 0;
let characterReady = false;

function showLoadError(message) {
  spinner.style.display = "none";
  loadTitle.textContent = "MODELL KONNTE NICHT GELADEN WERDEN";
  loadCopy.textContent = "Die lokale 3D-Datei ist noch nicht verfügbar.";
  errorEl.style.display = "block";
  errorEl.textContent = message + " Prüfe in GitHub unter Actions, ob der Grab3D-Download erfolgreich war.";
  statusEl.textContent = "MODELL NICHT GELADEN";
}

function styleModelMaterial(material, meshName) {
  const mat = material.clone();
  const label = ((mat.name || "") + " " + (meshName || "")).toLowerCase();

  if (/hair|brow/.test(label)) {
    mat.color.set("#2b1b13");
    if ("roughness" in mat) mat.roughness = 0.84;
    return mat;
  }

  if (/skin|face|head|hand|finger|ear|neck/.test(label)) {
    // Keep the model's high-resolution skin maps; use a fair, warm multiplier.
    mat.color.set("#fff0e7");
    if ("roughness" in mat) mat.roughness = 0.78;
    if ("metalness" in mat) mat.metalness = 0;
    return mat;
  }

  if (/shirt|tee|top|short|cloth|fabric|hood|sweat|pant|trouser|jean|shoe|sneaker/.test(label)) {
    mat.color.set("#17181b");
    if ("roughness" in mat) mat.roughness = 0.92;
    if ("metalness" in mat) mat.metalness = 0;
  }
  return mat;
}

function switchAction(nextAction) {
  if (!nextAction || activeAction === nextAction) return;
  if (activeAction) activeAction.fadeOut(0.18);
  nextAction.reset().fadeIn(0.18).play();
  activeAction = nextAction;
}

function prepareCharacter(gltf) {
  character = gltf.scene;
  character.traverse((obj) => {
    if (!obj.isMesh) return;
    obj.castShadow = true;
    obj.receiveShadow = true;
    if (Array.isArray(obj.material)) {
      obj.material = obj.material.map((mat) => styleModelMaterial(mat, obj.name));
    } else if (obj.material) {
      obj.material = styleModelMaterial(obj.material, obj.name);
    }
  });

  const bounds = new THREE.Box3().setFromObject(character);
  const height = bounds.max.y - bounds.min.y;
  if (!Number.isFinite(height) || height < 0.5) {
    throw new Error("Das geladene Modell hat keine gültige Körperhöhe.");
  }

  character.scale.setScalar(1.8 / height);
  const scaledBounds = new THREE.Box3().setFromObject(character);
  character.position.y -= scaledBounds.min.y;
  character.updateMatrixWorld(true);
  player.add(character);

  mixer = new THREE.AnimationMixer(character);
  const clips = gltf.animations || [];
  const walkClip = clips.find((clip) => /walk/i.test(clip.name));
  const runClip = clips.find((clip) => /run/i.test(clip.name));
  if (walkClip) walkAction = mixer.clipAction(walkClip);
  if (runClip) runAction = mixer.clipAction(runClip);

  characterReady = true;
  statusEl.textContent = "BEREIT · 1,80 M";
  statusEl.classList.add("ready");
  loadTitle.textContent = "BEREIT";
  loadCopy.textContent = "Echtes Grab3D-Modell geladen · WASD zum Laufen.";
  setTimeout(() => loadingEl.classList.add("hidden"), 450);
}

function loadCharacter() {
  const loader = new GLTFLoader();
  const modelUrl = "./assets/man-base-character-rigged.glb";

  loadCopy.textContent = "Lokales Grab3D-Modell wird geladen …";
  let loadFinished = false;
  const loadTimeout = setTimeout(() => {
    if (!loadFinished) {
      showLoadError("Der Download oder das Einlesen dauert ungewöhnlich lange. Bitte lade die Seite neu.");
    }
  }, 60000);

  loader.load(
    modelUrl,
    (gltf) => {
      loadFinished = true;
      clearTimeout(loadTimeout);
      try {
        prepareCharacter(gltf);
      } catch (error) {
        console.error("Character setup failed:", error);
        showLoadError(error.message || "Das Modell konnte nicht vorbereitet werden.");
      }
    },
    (event) => {
      if (event.total > 0) {
        const percent = Math.round(event.loaded / event.total * 100);
        loadCopy.textContent = "Grab3D-Modell wird geladen · " + percent + "%";
      } else {
        const megabytes = (event.loaded / (1024 * 1024)).toFixed(1);
        loadCopy.textContent = "Grab3D-Modell wird geladen · " + megabytes + " MB";
      }
    },
    (error) => {
      loadFinished = true;
      clearTimeout(loadTimeout);
      console.error("Local Grab3D GLB load failed:", error);
      const detail = error && error.message ? " (" + error.message + ")" : "";
      showLoadError("Lokale Grab3D-Datei konnte nicht gelesen werden" + detail + ".");
    }
  );
}

function updateMovement(delta) {
  if (!characterReady) return;

  const forwardInput = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  const sideInput = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);

  forward.set(Math.sin(cameraYaw), 0, Math.cos(cameraYaw));
  right.set(Math.cos(cameraYaw), 0, -Math.sin(cameraYaw));
  desiredVelocity.set(0,0,0);
  desiredVelocity.addScaledVector(forward, forwardInput);
  desiredVelocity.addScaledVector(right, sideInput);

  const isMoving = desiredVelocity.lengthSq() > 0.001;
  if (isMoving) {
    desiredVelocity.normalize();
    desiredVelocity.multiplyScalar(2.7);
    moveDir.copy(desiredVelocity).normalize();

    const targetRotation = Math.atan2(moveDir.x, moveDir.z);
    let rotationDifference = targetRotation - player.rotation.y;
    rotationDifference = Math.atan2(Math.sin(rotationDifference), Math.cos(rotationDifference));
    player.rotation.y += rotationDifference * (1 - Math.exp(-13 * delta));
  }

  const blend = 1 - Math.exp(-10 * delta);
  velocity.lerp(desiredVelocity, blend);
  player.position.x += velocity.x * delta;
  player.position.z += velocity.z * delta;

  if (isMoving) {
    if (walkAction) switchAction(walkAction);
    else if (runAction) switchAction(runAction);
  } else if (activeAction) {
    activeAction.fadeOut(0.18);
    activeAction = null;
  }
}

function updateCamera(delta) {
  const target = new THREE.Vector3(player.position.x, player.position.y + 1.16, player.position.z);
  const horizontalDistance = cameraDistance * Math.cos(cameraPitch);
  const offset = new THREE.Vector3(
    -Math.sin(cameraYaw) * horizontalDistance,
    cameraDistance * Math.sin(cameraPitch) + 0.18,
    -Math.cos(cameraYaw) * horizontalDistance
  );
  const wantedPosition = target.clone().add(offset);
  camera.position.lerp(wantedPosition, 1 - Math.exp(-7.5 * delta));
  camera.lookAt(target);
}

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.04);
  updateMovement(delta);
  if (mixer) mixer.update(delta);
  updateCamera(delta);
  renderer.render(scene,camera);
}
animate();
loadCharacter();

window.addEventListener("keydown", (event) => {
  if (["KeyW","KeyA","KeyS","KeyD","ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(event.code)) event.preventDefault();
  keys[event.code] = true;
});
window.addEventListener("keyup", (event) => { keys[event.code] = false; });
window.addEventListener("blur", () => { Object.keys(keys).forEach((key) => keys[key] = false); });

renderer.domElement.addEventListener("pointerdown", (event) => {
  if (event.button !== 0) return;
  dragging = true;
  lastPointerX = event.clientX;
  lastPointerY = event.clientY;
  renderer.domElement.setPointerCapture(event.pointerId);
});
renderer.domElement.addEventListener("pointermove", (event) => {
  if (!dragging) return;
  const dx = event.clientX - lastPointerX;
  const dy = event.clientY - lastPointerY;
  lastPointerX = event.clientX;
  lastPointerY = event.clientY;
  cameraYaw -= dx * 0.005;
  cameraPitch = THREE.MathUtils.clamp(cameraPitch + dy * 0.003, -0.08, 0.62);
});
renderer.domElement.addEventListener("pointerup", () => { dragging = false; });
renderer.domElement.addEventListener("pointercancel", () => { dragging = false; });
renderer.domElement.addEventListener("wheel", (event) => {
  cameraDistance = THREE.MathUtils.clamp(cameraDistance + event.deltaY * 0.004, 3.2, 9);
}, {passive:true});

document.getElementById("camera-reset").addEventListener("click", () => {
  cameraYaw = 0;
  cameraPitch = 0.16;
  cameraDistance = 5.6;
});

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.8));
});
</script>
