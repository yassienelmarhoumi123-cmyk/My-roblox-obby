<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash Royale 3D - Hog Rider Steuerung</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: Arial, sans-serif;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="info">
        <h3>Clash Royale Arena</h3>
        <p>Steuerung: <b>W, A, S, D</b> zum Bewegen des Hog Riders</p>
    </div>

    <!-- Three.js und Loader per CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 1. Grundsetup: Szene, Kamera, Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x202020);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 2. Licht
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const loader = new THREE.GLTFLoader();

        let hogRider = null;
        let moveSpeed = 0.15;
        const keys = { w: false, a: false, s: false, d: false };

        // ==========================================
        // 3. HIER TRÄGST DU DEN NAMEN DEINER ARENA EIN:
        // ==========================================
        loader.load('enviroment_clash_royal 3.glb', function (gltf) {
            const arena = gltf.scene;
            arena.position.set(0, 0, 0);
            scene.add(arena);
            console.log('Arena geladen!');
        }, undefined, function (error) {
            console.error('Fehler beim Laden der Arena:', error);
        });

        // ==========================================
        // 4. HIER TRÄGST DU DEN NAMEN DES HOG RIDERS EIN:
        // ==========================================
        loader.load('hog_rider_adventure.glb', function (gltf) {
            hogRider = gltf.scene;
            hogRider.position.set(0, 0, 5); // Startposition des Hog Riders
            hogRider.scale.set(1, 1, 1);     // Falls er zu groß/klein ist, hier anpassen (z.B. 0.5 oder 2)
            scene.add(hogRider);
            console.log('Hog Rider geladen!');
        }, undefined, function (error) {
            console.error('Fehler beim Laden des Hog Riders:', error);
        });

        // 5. Tastatur-Erkennung einrichten
        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W') keys.w = true;
            if (e.key === 'a' || e.key === 'A') keys.a = true;
            if (e.key === 's' || e.key === 'S') keys.s = true;
            if (e.key === 'd' || e.key === 'D') keys.d = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W') keys.w = false;
            if (e.key === 'a' || e.key === 'A') keys.a = false;
            if (e.key === 's' || e.key === 'S') keys.s = false;
            if (e.key === 'd' || e.key === 'D') keys.d = false;
        });

        // 6. Fenster-Resize
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 7. Animations- und Spiel-Schleife
        function animate() {
            requestAnimationFrame(animate);

            if (hogRider) {
                if (keys.w) hogRider.position.z -= moveSpeed;
                if (keys.s) hogRider.position.z += moveSpeed;
                if (keys.a) hogRider.position.x -= moveSpeed;
                if (keys.d) hogRider.position.x += moveSpeed;

                // Kamera folgt dem Hog Rider
                controls.target.copy(hogRider.position);
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
