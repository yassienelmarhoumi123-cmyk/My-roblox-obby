<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Halal Games Portal</title>
    <style>
        body { 
            background: radial-gradient(circle, #1a0033, #000000); 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            text-align: center; 
            margin: 0; padding: 20px; 
            min-height: 100vh;
        }

        /* WARTUNGS-SCREEN */
        #m-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 9000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #unlock-btn {
            margin-top: 20px;
            padding: 15px 30px;
            background: #8a2be2;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.4);
        }

        /* SPIELE GRID */
        .grid { 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
            flex-wrap: wrap; 
            margin-top: 30px; 
            margin-bottom: 100px;
        }

        .card { 
            background: rgba(255,255,255,0.05); 
            border-radius: 20px; 
            padding: 12px; 
            width: 140px; 
            border: 1px solid rgba(255,255,255,0.1);
        }

        .card img { 
            width: 100%; 
            aspect-ratio: 1/1; 
            object-fit: cover; 
            border-radius: 15px; 
            margin-bottom: 8px;
        }

        .game-title { font-size: 0.8em; font-weight: bold; }

        /* OVERLAYS */
        #game-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9500; }
        iframe { width: 100%; height: calc(100% - 60px); border: none; }
        .btn-ui { background: #8a2be2; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body onload="checkStatus()">

    <!-- WARTUNGS-MODUS (Wird durch Script gesteuert) -->
    <div id="m-overlay">
        <h1 style="color: #ff4444; font-size: 2.5em;">⚠️ WARTUNG</h1>
        <p>Dieses Portal ist zurzeit privat gesperrt.</p>
        <button id="unlock-btn" onclick="askAdmin()">Admin Code eingeben</button>
    </div>

    <!-- GAME OVERLAY -->
    <div id="game-view">
        <div style="height: 60px; display: flex; justify-content: center; align-items: center; background: #111;">
            <button class="btn-ui" style="background: #ff0000;" onclick="closeG()">✖ SCHLIESSEN</button>
        </div>
        <iframe id="game-frame" allow="camera; microphone; display-capture"></iframe>
    </div>

    <!-- HAUPTINHALT -->
    <div id="content">
        <h1>HALAL PORTAL</h1>
        <div class="grid">
            
            <!-- Messenger -->
            <div class="card" onclick="play('https://my.cbox.ws/Yassien')">
                <img src="https://cdn-icons-png.flaticon.com/512/134/134937.png">
                <div class="game-title" style="color: #25D366;">Messenger</div>
            </div>

            <!-- Murder -->
            <div class="card" onclick="play('https://murder-unblocked.github.io/')">
                <img src="Murder.png">
                <div class="game-title" style="color: #ff4444;">Murder</div>
            </div>

            <!-- Drive Mad -->
            <div class="card" onclick="play('https://ducky443747.github.io/games/DriveMad/')">
                <img src="https://play-lh.googleusercontent.com/Anm2S-MvTuxPzD4lqP7kH0H8uC_o7YvF1O7jB_9Gz9V0M9f6I8P6j1g_3p8P0w">
                <div class="game-title" style="color: #ffde00;">Drive Mad</div>
            </div>

            <!-- Basket Random -->
            <div class="card" onclick="play('https://basketballrandom.gitlab.io/')">
                <img src="basket.png">
                <div class="game-title">Basket Random</div>
            </div>

            <!-- Wordle -->
            <div class="card" onclick="play('https://wordledeutsch.org/')">
                <img src="wordle.png">
                <div class="game-title" style="color: #4CAF50;">Wordle</div>
            </div>

            <!-- Halal Chat -->
            <div class="card" onclick="play('https://ommogle.com/')">
                <img src="halal-chat.png">
                <div class="game-title" style="color: #00d4ff;">Chat</div>
            </div>

            <!-- Highway Racer -->
            <div class="card" onclick="play('https://crazygames-unblocked.github.io/play/highway-racer-3d.html')">
                <img src="halal-racer.png">
                <div class="game-title" style="color: #00ff88;">Racer</div>
            </div>

        </div>
    </div>

    <script>
        // --- DEINE EINSTELLUNGEN ---
        const MASTER = "9999"; 
        const PASS = "6767";
        
        // HIER ÄNDERN: true = Wartung AN / false = Wartung AUS
        const isLocked = true; 
        // ---------------------------

        function checkStatus() {
            const hasAccess = sessionStorage.getItem("admin_session") === "true";
            const overlay = document.getElementById('m-overlay');
            
            if (isLocked && !hasAccess) {
                overlay.style.display = 'flex';
            } else {
                overlay.style.display = 'none';
            }
        }

        function askAdmin() {
            if (prompt("Admin Code:") === MASTER) {
                sessionStorage.setItem("admin_session", "true");
                location.reload();
            }
        }

        function play(u) {
            if (prompt("Passwort?") === PASS) {
                document.getElementById('game-frame').src = u;
                document.getElementById('game-view').style.display = 'block';
                document.body.style.overflow = 'hidden';
            }
        }

        function closeG() {
            document.getElementById('game-view').style.display = 'none';
            document.getElementById('game-frame').src = "";
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
