<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Halal Games Portal</title>
    <style>
        body { 
            background: radial-gradient(circle, #1a0033, #000000); 
            color: white; font-family: 'Segoe UI', sans-serif; text-align: center; 
            margin: 0; padding: 20px;
        }

        h1 { font-size: 2.5em; text-shadow: 0 0 15px #8a2be2; margin-bottom: 40px; }

        /* GRID SYSTEM */
        .grid { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }

        .card { 
            background: rgba(255,255,255,0.05); border-radius: 25px; padding: 15px; 
            width: 150px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer;
            transition: 0.3s;
        }

        .card:hover { transform: translateY(-5px); border-color: #8a2be2; }
        .card:active { transform: scale(0.9); }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 18px; margin-bottom: 10px; }
        .game-title { font-size: 0.9em; font-weight: bold; text-transform: uppercase; }

        /* FULLSCREEN VIEW */
        #game-view { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 9999; 
        }
        
        #game-frame { width: 100%; height: calc(100% - 60px); border: none; margin-top: 60px; }

        #jumpscare-video {
            width: 100%; height: 100%; object-fit: fill; 
            position: absolute; top: 0; left: 0; display: none;
        }

        #close-bar {
            height: 60px; display: flex; justify-content: center; 
            align-items: center; background: #111; 
            position: absolute; top: 0; left: 0; width: 100%;
        }

        .btn-close { background: #ff0000; color: white; border: none; padding: 10px 25px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="game-view">
        <div id="close-bar">
            <button class="btn-close" onclick="closeGame()">✖ SCHLIESSEN</button>
        </div>
        <iframe id="game-frame" allow="autoplay; fullscreen; pointer-lock"></iframe>
        <video id="jumpscare-video" playsinline>
            <source src="ScreenRecording_05-11-2026 18-17-01_1.mov" type="video/quicktime">
        </video>
    </div>

    <h1>HALAL GAMES</h1>

    <div class="grid">
        <div class="card" onclick="openGame('https://sosa.centromariapolis.cl/')">
            <img src="https://cdn-icons-png.flaticon.com/512/287/287226.png">
            <div class="game-title" style="color: #00ff88;">Sosa Unblocker</div>
        </div>

        <div class="card" onclick="openGame('https://ducky443747.github.io/games/DriveMad/')">
            <img src="https://play-lh.googleusercontent.com/Anm2S-MvTuxPzD4lqP7kH0H8uC_o7YvF1O7jB_9Gz9V0M9f6I8P6j1g_3p8P0w">
            <div class="game-title">Drive Mad</div>
        </div>

        <div class="card" onclick="openGame('https://murder-unblocked.github.io/')">
            <img src="Murder.png">
            <div class="game-title">Murder</div>
        </div>

        <div class="card" onclick="triggerJumpscare()">
            <img src="https://cdn-icons-png.flaticon.com/512/564/564619.png">
            <div class="game-title" style="color: #ff00ff;">Secret Level</div>
        </div>
    </div>

    <script>
        const PIN = "6767";

        function openGame(url) {
            const pw = prompt("Sicherheits-Code:");
            if (pw === PIN) {
                const view = document.getElementById('game-view');
                const frame = document.getElementById('game-frame');
                const video = document.getElementById('jumpscare-video');
                
                video.style.display = 'none';
                frame.style.display = 'block';
                document.getElementById('close-bar').style.display = 'flex';
                frame.src = url;
                view.style.display = 'block';
            }
        }

        function triggerJumpscare() {
            const pw = prompt("Sicherheits-Code:");
            if (pw === PIN) {
                const view = document.getElementById('game-view');
                const video = document.getElementById('jumpscare-video');
                const frame = document.getElementById('game-frame');
                
                frame.style.display = 'none';
                document.getElementById('close-bar').style.display = 'none';
                video.style.display = 'block';
                view.style.display = 'block';
                
                video.muted = false;
                video.currentTime = 0;
                video.play().catch(() => {
                    alert("Click OK to Start Game");
                    video.play();
                });

                video.onended = () => { 
                    document.getElementById('close-bar').style.display = 'flex'; 
                };
            }
        }

        function closeGame() {
            document.getElementById('game-view').style.display = 'none';
            document.getElementById('game-frame').src = "";
            document.getElementById('jumpscare-video').pause();
        }
    </script>
</body>
</html>
