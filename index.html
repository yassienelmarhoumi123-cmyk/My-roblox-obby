<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Browser Minecraft - Schritt 1</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #78a7ff; font-family: sans-serif; }
        canvas { display: block; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 10px; height: 10px;
            background: white; transform: translate(-50%, -50%);
            mix-blend-mode: difference; pointer-events: none;
        }
        #info {
            position: absolute; top: 10px; left: 10px;
            color: white; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="info">Klicke zum Spielen! <br>Bewegung: WASD | Springen: LEERTASTE</div>

    <script>
        // --- 1. SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x78a7ff);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Licht
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 15);
        scene.add(directionalLight);

        // --- 2. MAUS-STEUERUNG ---
        const controls = new THREE.PointerLockControls(camera, document.body);
        document.body.addEventListener('click', () => { controls.lock(); });
        controls.addEventListener('lock', () => { document.getElementById('info').style.display = 'none'; });
        controls.addEventListener('unlock', () => { document.getElementById('info').style.display = 'block'; });

        // --- 3. DER BLOCK & EIN BODEN ---
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const grassColor = new THREE.MeshLambertMaterial({color: 0x557a2b});
        const dirtColor = new THREE.MeshLambertMaterial({color: 0x866043});
        const materials = [dirtColor, dirtColor, grassColor, dirtColor, dirtColor, dirtColor];

        // Ein einzelner Block in der Mitte
        const block = new THREE.Mesh(geometry, materials);
        block.position.set(0, 0, 0);
        scene.add(block);

        // Eine kleine Plattform (Boden) zum Draufstehen bauen
        const floorGeometry = new THREE.BoxGeometry(10, 0.2, 10);
        const floorMaterial = new THREE.MeshLambertMaterial({color: 0x446622});
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.position.set(0, -0.6, 0); // Direkt unter dem Block
        scene.add(floor);

        // Spieler Startposition
        camera.position.set(0, 1.6, 4); // 1.6 ist die Augenhöhe

        // --- 4. TASTATUR-STEUERUNG & PHYSIK-VARIABLEN ---
        const keys = { w: false, a: false, s: false, d: false, space: false };
        let velocityY = 0;
        const gravity = -0.01;
        const jumpStrength = 0.2;
        const speed = 0.1;
        let canJump = false;

        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.w = true;
            if (e.code === 'KeyA') keys.a = true;
            if (e.code === 'KeyS') keys.s = true;
            if (e.code === 'KeyD') keys.d = true;
            if (e.code === 'Space') keys.space = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.w = false;
            if (e.code === 'KeyA') keys.a = false;
            if (e.code === 'KeyS') keys.s = false;
            if (e.code === 'KeyD') keys.d = false;
            if (e.code === 'Space') keys.space = false;
        });

        // --- 5. GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            if (controls.isLocked) {
                // Vorwärts / Rückwärts bewegen
                if (keys.w) controls.moveForward(speed);
                if (keys.s) controls.moveForward(-speed);
                // Links / Rechts bewegen
                if (keys.a) controls.moveRight(-speed);
                if (keys.d) controls.moveRight(speed);

                // Schwerkraft berechnen
                velocityY += gravity;
                camera.position.y += velocityY;

                // Kollision mit dem Boden (damit man nicht unendlich fällt)
                if (camera.position.y < 1.6) { // 1.6 über dem Boden
                    camera.position.y = 1.6;
                    velocityY = 0;
                    canJump = true;
                }

                // Springen
                if (keys.space && canJump) {
                    velocityY = jumpStrength;
                    canJump = false;
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
