<!DOCTYPE html>
<html lang="de">
<head>
    <style>
        /* Das Design (ähnlich wie in IMG_2582.jpg) */
        body {
            background-color: #8a2be2; /* Lila Hintergrund */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        .grid-container {
            display: grid;
            /* Erstellt 3 Spalten (perfekt für das iPad-Querformat) */
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            padding: 10px;
        }

        .game-card {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 10px;
            transition: transform 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: white;
        }

        .game-card:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.1);
        }

        .game-card img {
            width: 100%;
            border-radius: 8px;
            aspect-ratio: 16/9;
            object-fit: cover;
        }

        .game-title {
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Top Unblocked Games</h2>

    <div class="grid-container">
        
        <!-- Spiel 1: Minecraft (Eaglercraft) -->
        <a href="https://fayadgamer13.github.io" class="game-card">
            <img src="https://magascia.com/wp-content/uploads/2023/11/minecraft-classic.jpg" alt="Minecraft">
            <div class="game-title">Minecraft 1.8</div>
        </a>

        <!-- Spiel 2: Granny (Horror) -->
        <a href="https://granny-unblocked.github.io" class="game-card">
            <img src="https://play-lh.googleusercontent.com/6X9k7aHhK8V6zCj6X_O3o7G3_5R6T-mU6n-9f_8R3n-v_8" alt="Granny">
            <div class="game-title">Granny</div>
        </a>

        <!-- Spiel 3: Snow Rider 3D -->
        <a href="https://snowrider3d.github.io" class="game-card">
            <img src="https://snow-rider-3d.com/logo.png" alt="Snow Rider">
            <div class="game-title">Snow Rider 3D</div>
        </a>

        <!-- Spiel 4: Bloxd.io (Minecraft Alternative) -->
        <a href="https://bloxd.io" class="game-card">
            <img src="https://bloxd.io/assets/logo.png" alt="Bloxd">
            <div class="game-title">Bloxd.io</div>
        </a>

    </div>

</body>
</html>
