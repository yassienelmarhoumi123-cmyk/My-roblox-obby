<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Classroom Resources</title>
    <style>
        body { 
            background-color: #8a2be2; 
            color: white; 
            font-family: sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }
        h1 { margin-bottom: 30px; font-size: 2.5em; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); 
            gap: 25px; 
            max-width: 900px;
            margin: 0 auto;
        }

        .card { 
            background: rgba(0, 0, 0, 0.4); 
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px; 
            padding: 15px; 
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .card:hover { transform: translateY(-5px); background: rgba(0, 0, 0, 0.6); border-color: white; }
        
        .card img { 
            width: 100%; 
            border-radius: 15px; 
            aspect-ratio: 1/1; 
            object-fit: cover;
            background-color: #333;
        }

        #game-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 9999;
        }

        iframe { width: 100%; height: 100%; border: none; }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff0000;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            z-index: 10000;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="game-overlay">
        <button class="close-btn" onclick="closeGame()">X SCHLIESSEN</button>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <h1>Classroom Resources</h1>

    <div class="grid">
        <!-- Basket Random -->
        <div class="card" onclick="openGame('https://basketballrandom.gitlab.io/')">
            <img src="https://play-lh.googleusercontent.com/I6P9S9X1vD2zQ7z_Xp6hY9Y9Q-W6zCj6X_O3o7G3_5R6T-mU6n-9f_8R3n-v_8" alt="Basket Random">
            <div class="game-title">Basket Random</div>
        </div>

        <!-- Halal Granny 2 -->
        <div class="card" onclick="openGame('https://horrorgamesfree.com/granny2')">
            <!-- Hier ist dein bearbeitetes Bild als direkter Link -->
            <img src="https://api.screenshotmachine.com/?key=bc892d&url=https://i.ibb.co/L6V8z9R/halal-granny.png&dimension=500x500" alt="Halal Granny 2" onerror="this.src='https://i.ibb.co/L6V8z9R/halal-granny.png'">
            <div style="color: #ff4444; font-weight: bold; margin-top: 5px;">HALAL GRANNY 2</div>
        </div>
    </div>

    <script>
        function openGame(url) {
            document.getElementById('game-frame').src = url;
            document.getElementById('game-overlay').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeGame() {
            document.getElementById('game-overlay').style.display = 'none';
            document.getElementById('game-frame').src = '';
            document.body.style.overflow = 'auto';
        }
    </script>

</body>
</html>
