<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Halal Classroom Games</title>
    <style>
        body { 
            background: radial-gradient(circle, #4b0082, #000000); 
            color: white; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px;
            min-height: 100vh;
        }

        h1 { 
            margin-bottom: 40px; 
            font-size: 3em; 
            text-shadow: 0 0 20px rgba(138, 43, 226, 0.8);
            letter-spacing: 2px;
        }

        .grid { 
            display: flex; 
            justify-content: center; 
            gap: 30px; 
            flex-wrap: wrap; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        .card { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px; 
            padding: 20px; 
            width: 250px; 
            cursor: pointer; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        .card:hover { 
            transform: translateY(-15px) scale(1.05); 
            background: rgba(255, 255, 255, 0.15); 
            border-color: #8a2be2;
            box-shadow: 0 20px 40px rgba(138, 43, 226, 0.4);
        }

        .card img { 
            width: 100%; 
            aspect-ratio: 1/1; 
            object-fit: cover; 
            border-radius: 20px; 
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .game-title { 
            font-size: 1.3em; 
            font-weight: 800; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Spezial-Effekt für Granny */
        .granny-card { border-color: rgba(255, 0, 0, 0.3); }
        .granny-card:hover { border-color: #ff0000; box-shadow: 0 20px 40px rgba(255, 0, 0, 0.4); }

        #game-overlay { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: black; 
            z-index: 9999; 
        }

        iframe { width: 100%; height: 100%; border: none; }

        .close-btn { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            background: #ff0000; 
            color: white; 
            border: 3px solid white; 
            padding: 15px 30px; 
            border-radius: 15px; 
            font-weight: 900; 
            cursor: pointer; 
            font-size: 1.2em;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="game-overlay">
        <button class="close-btn" onclick="closeGame()">✖ SCHLIESSEN</button>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <h1>HALAL GAMES PORTAL</h1>

    <div class="grid">
        <!-- Basket Random -->
        <div class="card" onclick="openGame('https://basketballrandom.gitlab.io/')">
            <img src="basket.png" alt="Basket Random">
            <div class="game-title">Basket Random</div>
        </div>

        <!-- Wordle Deutsch -->
        <div class="card" onclick="openGame('https://wordledeutsch.org/')">
            <img src="wordle.png" alt="Halal Wordle">
            <div class="game-title" style="color: #4CAF50;">Halal Wordle</div>
        </div>

        <!-- Granny 2 -->
        <div class="card granny-card" onclick="openGame('https://horrorgamesfree.com/granny2')">
            <img src="halalgranny.png" alt="Halal Granny 2">
            <div class="game-title" style="color: #ff4444;">Halal Granny 2</div>
        </div>
    </div>

    <script>
        function openGame(url) {
            const frame = document.getElementById('game-frame');
            frame.src = url;
            document.getElementById('game-overlay').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeGame() {
            document.getElementById('game-overlay').style.display = 'none';
            document.getElementById('game-frame').src = '';
            document.body.style.overflow = 'auto';
        }
    </script>

</body>
</html>
