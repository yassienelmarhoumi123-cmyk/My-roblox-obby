<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Halal Games Portal</title>
    <style>
        body { 
            background: radial-gradient(circle, #1a0033, #000000); 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
        }

        /* WARTUNGS-SCREEN */
        #maintenance-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 9000; /* Etwas niedriger als der Schalter */
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* DER SCHALTER (Immer ganz oben!) */
        #admin-switch-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10000; /* Höchster Wert, damit er immer sichtbar ist */
            background: rgba(20, 20, 20, 0.9);
            padding: 10px 15px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #8a2be2;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.4);
            -webkit-tap-highlight-color: transparent;
        }

        .switch-text { font-size: 12px; font-weight: bold; color: #fff; }

        .toggle-bg {
            width: 50px;
            height: 24px;
            background: #444;
            border-radius: 20px;
            position: relative;
            transition: 0.3s;
        }

        .toggle-circle {
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: 0.3s;
        }

        /* Status-Farben */
        .is-on .toggle-bg { background: #ff4444; } /* Wartung Aktiv */
        .is-on .toggle-circle { left: 29px; }
        .is-off .toggle-bg { background: #25D366; } /* Online */

        /* GAME VIEW */
        #game-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9500; }
        iframe { width: 100%; height: calc(100% - 60px); border: none; }

        /* DESIGN */
        h1 { font-size: 2.2em; text-shadow: 0 0 15px #8a2be2; }
        .grid { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 100px; }
        .card { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 12px; width: 140px; border: 1px solid rgba(255,255,255,0.1); }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 15px; }
        .btn-ui { background: #8a2be2; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body onload="checkStatus()">

    <!-- WARTUNGS-SCREEN -->
    <div id="maintenance-overlay">
        <h1 style="color: #ff4444;">WARTUNGSARBEITEN</h1>
        <p>Die Seite ist aktuell offline.</p>
        <p>Wir sind bald wieder für euch da!</p>
    </div>

    <!-- ADMIN SCHALTER (Bleibt immer sichtbar) -->
    <div id="admin-switch-container" onclick="toggleMaint()">
        <span class="switch-text">Wartungszeiten</span>
        <div id="toggle-visual" class="toggle-bg">
            <div class="toggle-circle"></div>
        </div>
    </div>

    <div id="game-view">
        <div style="height: 60px; display: flex; justify-content: center; align-items: center; background: #111;">
            <button class="btn-ui" style="background: #ff0000;" onclick="closeGame()">✖ SCHLIESSEN</button>
        </div>
        <iframe id="game-frame"></iframe>
    </div>

    <div id="content">
        <h1>HALAL PORTAL</h1>
        <div class="grid">
            <div class="card" onclick="play('https://murder-unblocked.github.io/')">
                <img src="Murder.png">
                <div style="color: #ff4444; font-weight: bold;">Murder</div>
            </div>
            <div class="card" onclick="play('https://my.cbox.ws/Yassien')">
                <img src="https://cdn-icons-png.flaticon.com/512/134/134937.png">
                <div style="color: #25D366; font-weight: bold;">Messenger</div>
            </div>
            <!-- Hier kannst du die anderen Karten wieder einfügen -->
        </div>
    </div>

    <script>
        const ADMIN = "9999";
        const USER = "6767";

        function checkStatus() {
            const active = localStorage.getItem("maint_active") === "true";
            const overlay = document.getElementById('maintenance-overlay');
            const toggle = document.getElementById('toggle-visual');

            if (active) {
                overlay.style.display = 'flex';
                toggle.parentElement.className = "is-on";
            } else {
                overlay.style.display = 'none';
                toggle.parentElement.className = "is-off";
            }
        }

        function toggleMaint() {
            const val = prompt("Admin Code:");
            if (val === ADMIN) {
                const current = localStorage.getItem("maint_active") === "true";
                localStorage.setItem("maint_active", !current);
                location.reload();
            } else if (val !== null) {
                alert("Falsch!");
            }
        }

        function play(url) {
            if (localStorage.getItem("maint_active") === "true") return;
            if (prompt("Passwort?") === USER) {
                document.getElementById('game-frame').src = url;
                document.getElementById('game-view').style.display = 'block';
            }
        }

        function closeGame() {
            document.getElementById('game-view').style.display = 'none';
            document.getElementById('game-frame').src = "";
        }
    </script>
</body>
</html>
