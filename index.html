<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Resources</title>
    <style>
        body { 
            background-color: #8a2be2; 
            color: white; 
            font-family: sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
            overflow-x: hidden;
        }
        h1 { margin-bottom: 30px; font-size: 2.5em; }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); 
            gap: 25px; 
            max-width: 900px;
            margin: 0 auto;
        }

        .card { 
            background: rgba(0, 0, 0, 0.4); 
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px; 
            padding: 15px; 
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .card:hover { transform: translateY(-5px); background: rgba(0, 0, 0, 0.6); }
        .card img { width: 100%; border-radius: 15px; aspect-ratio: 1/1; object-fit: cover; }
        
        /* Das Spielfenster (Overlay) */
        #game-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9999;
        }

        iframe {
            width: 80%;
            height: 80%;
            margin-top: 5%;
            border: 5px solid #fff;
            border-radius: 10px;
            background: white;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: red;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1.2em;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <button class="close-btn" onclick="closeGame()">X SCHLIESSEN</button>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <h1>Classroom Resources</h1>

    <div class="grid">
        <!-- Basket Random -->
        <div class="card" onclick="openGame('https://basketballrandom.gitlab.io/')">
            <img src="https://play-lh.googleusercontent.com/I6P9S9X1vD2zQ7z_Xp6hY9Y9Q-W6zCj6X_O3o7G3_5R6T-mU6n-9f_8R3n-v_8" alt="Basket Random">
            <div class="game-title">Basket Random</div>
        </div>

        <!-- Granny 2 -->
        <div class="card" onclick="openGame('https://horrorgamesfree.com/granny2')">
            <img src="https://play-lh.googleusercontent.com/6X9k7aHhK8V6zCj6X_O3o7G3_5R6T-mU6n-9f_8R3n-v_8" alt="Granny 2">
            <div class="game-title">Granny 2</div>
        </div>
    </div>

    <script>
        function openGame(url) {
            document.getElementById('game-frame').src = url;
            document.getElementById('game-container').style.display = 'block';
            document.body.style.overflow = 'hidden'; // Verhindert Scrollen im Hintergrund
        }

        function closeGame() {
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('game-frame').src = '';
            document.body.style.overflow = 'auto';
        }
    </script>

</body>
</html>
