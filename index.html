<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Halal Games Portal</title>
    <style>
        body { 
            background: radial-gradient(circle, #1a0033, #000000); 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            text-align: center; 
            margin: 0; padding: 20px; min-height: 100vh;
        }

        h1 { font-size: 2.5em; text-shadow: 0 0 15px #8a2be2; margin-bottom: 20px; }

        /* PROXY SEARCH BOX */
        .proxy-container {
            background: rgba(138, 43, 226, 0.1);
            padding: 20px; border-radius: 25px;
            border: 1px solid rgba(138, 43, 226, 0.3);
            max-width: 500px; margin: 0 auto 30px auto;
        }

        #proxy-input {
            width: 65%; padding: 12px; border-radius: 12px;
            border: none; background: #111; color: #00d4ff; font-weight: bold;
        }

        .btn-proxy {
            background: #8a2be2; color: white; border: none;
            padding: 12px 15px; border-radius: 12px; cursor: pointer; font-weight: bold;
        }

        .grid { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; max-width: 1200px; margin: 0 auto; }

        .card { 
            background: rgba(255,255,255,0.05); border-radius: 25px; padding: 15px; 
            width: 140px; border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.2s; cursor: pointer;
        }

        .card:active { transform: scale(0.95); }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 18px; margin-bottom: 10px; }
        .game-title { font-size: 0.8em; font-weight: bold; text-transform: uppercase; }

        #game-view { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 5000; 
        }
        
        /* WICHTIG: Erlaubt Pointer Lock & Fullscreen */
        #game-frame {
            width: 100%; height: calc(100% - 60px); 
            border: none; position: absolute; top: 60px; left: 0;
        }

        #jumpscare-video {
            width: 100%; height: 100%; object-fit: fill; 
            position: absolute; top: 0; left: 0; z-index: 6000; display: none;
        }

        #close-bar {
            height: 60px; display: flex; justify-content: center; 
            align-items: center; background: #111; 
            position: absolute; top: 0; left: 0; width: 100%; z-index: 100;
        }

        .btn-close { background: #ff0000; color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="game-view">
        <div id="close-bar">
            <button class="btn-close" onclick="closeGame()">✖ SCHLIESSEN</button>
        </div>
        <div id="content-container">
            <iframe id="game-frame" allow="autoplay; fullscreen; camera; microphone; pointer-lock" sandbox="allow-forms allow-scripts allow-pointer-lock allow-same-origin allow-popups allow-presentation"></iframe>
            <video id="jumpscare-video" playsinline>
                <source src="ScreenRecording_05-11-2026 18-17-01_1.mov" type="video/quicktime">
            </video>
        </div>
    </div>

    <h1>HALAL PORTAL</h1>

    <div class="proxy-container">
        <input type="text" id="proxy-input" placeholder="Suche oder URL (z.B. poki.com)">
        <button class="btn-proxy" onclick="openProxy()">GO</button>
    </div>
    
    <div class="grid">
        <div class="card" onclick="startJumpscare()">
            <img src="https://cdn-icons-png.flaticon.com/512/564/564619.png">
            <div class="game-title" style="color: #00d4ff;">Steal a Brainrot</div>
        </div>

        <div class="card" onclick="launchGame('https://ducky443747.github.io/games/DriveMad/', false)">
            <img src="https://play-lh.googleusercontent.com/Anm2S-MvTuxPzD4lqP7kH0H8uC_o7YvF1O7jB_9Gz9V0M9f6I8P6j1g_3p8P0w">
            <div class="game-title" style="color: #ffde00;">Drive Mad</div>
        </div>

        <div class="card" onclick="launchGame('https://horrorgamesfree.com/granny2', false)">
            <img src="halalgranny.png">
            <div class="game-title" style="color: #888;">Granny</div>
        </div>

        <div class="card" onclick="launchGame('https://gamulo.com/game/dta-6-unblocked/', true)">
            <img src="dta6.png">
            <div class="game-title" style="color: #ffde00;">DTA 6</div>
        </div>

        <div class="card" onclick="launchGame('https://my.cbox.ws/Yassien', false)">
            <img src="https://cdn-icons-png.flaticon.com/512/134/134937.png">
            <div class="game-title" style="color: #25D366;">Messenger</div>
        </div>
        
        <div class="card" onclick="launchGame('https://murder-unblocked.github.io/', false)">
            <img src="Murder.png">
            <div class="game-title" style="color: #ff4444;">Murder</div>
        </div>
    </div>

    <script>
        const PASSWORT = "6767";

        function openProxy() {
            const val = document.getElementById('proxy-input').value;
            if(!val) return;
            const pw = prompt("Passwort:");
            if (pw === PASSWORT) {
                const proxyBase = "https://algebra.best/"; 
                document.getElementById('jumpscare-video').style.display = 'none';
                document.getElementById('game-frame').style.display = 'block';
                document.getElementById('game-frame').src = proxyBase; 
                document.getElementById('game-view').style.display = 'block';
            }
        }

        function launchGame(url, newTab) {
            const pw = prompt("Passwort:");
            if (pw === PASSWORT) {
                if (newTab) { window.open(url, '_blank'); } 
                else {
                    document.getElementById('jumpscare-video').style.display = 'none';
                    document.getElementById('game-frame').style.display = 'block';
                    document.getElementById('game-frame').src = url;
                    document.getElementById('game-view').style.display = 'block';
                }
            }
        }

        function startJumpscare() {
            const pw = prompt("Passwort:");
            if (pw === PASSWORT) {
                const video = document.getElementById('jumpscare-video');
                document.getElementById('game-frame').style.display = 'none';
                video.style.display = 'block';
                document.getElementById('close-bar').style.display = 'none';
                document.getElementById('game-view').style.display = 'block';
                video.currentTime = 0; video.muted = false; video.play();
                video.onended = function() { document.getElementById('close-bar').style.display = 'flex'; };
            }
        }

        function closeGame() {
            document.getElementById('game-view').style.display = 'none';
            document.getElementById('game-frame').src = "";
        }
    </script>
</body>
</html>
