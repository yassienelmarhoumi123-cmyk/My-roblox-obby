<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Game Environment</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Three.js und der GLTFLoader über CDN einbinden -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 1. Szene, Kamera und Renderer einrichten
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x202020); // Hintergrundfarbe

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.setFocalLength(20);
        camera.position.set(0, 10, 20); // Startposition der Kamera

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 2. Kamera-Steuerung (damit du dich mit der Maus umsehen/herumzoomen kannst)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 3. Licht hinzufügen (damit das Modell nicht komplett schwarz ist)
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2); // Weiches Grundlicht
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        // 4. Hier wird dein 3D-Modell geladen!
        const loader = new THREE.GLTFLoader();
        
        // >>> enviroment_clash_royal 3.glb <<<
        const modelFileName = 'enviroment_clash_royal 3.glb'; 

        loader.load(
            modelFileName,
            function (gltf) {
                const model = gltf.scene;
                
                // Optional: Position, Skalierung oder Drehung anpassen
                model.position.set(0, 0, 0);
                model.scale.set(1, 1, 1); 

                scene.add(model);
                console.log('Modell erfolgreich geladen!');
            },
            function (xhr) {
                // Ladebalken-Fortschritt in der Konsole anzeigen
                console.log((xhr.loaded / xhr.total * 100) + '% geladen');
            },
            function (error) {
                console.error('Fehler beim Laden des Modells:', error);
            }
        );

        // 5. Fenster-Größenanpassung
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 6. Animations-Schleife (Render-Loop)
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
