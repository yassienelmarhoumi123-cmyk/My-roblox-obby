<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mein Browser Minecraft - iPad Keyboard Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #78a7ff; font-family: sans-serif; touch-action: none; }
        canvas { display: block; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 10px; height: 10px;
            background: white; transform: translate(-50%, -50%);
            mix-blend-mode: difference; pointer-events: none;
        }
        #info {
            position: absolute; top: 10px; left: 10px;
            color: white; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="info"><b>iPad Steuerung:</b><br>Laufen: WASD oder Pfeiltasten<br>Springen: LEERTASTE<br>Umsehen: Mit dem Finger wischen!</div>

    <script>
        // --- 1. SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x78a7ff);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Licht
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 15);
        scene.add(directionalLight);

        // --- 2. BLÖCKE ---
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const grassColor = new THREE.MeshLambertMaterial({color: 0x557a2b});
        const dirtColor = new THREE.MeshLambertMaterial({color: 0x866043});
        const materials = [dirtColor, dirtColor, grassColor, dirtColor, dirtColor, dirtColor];

        const block = new THREE.Mesh(geometry, materials);
        scene.add(block);

        const floorGeometry = new THREE.BoxGeometry(20, 0.2, 20);
        const floorMaterial = new THREE.MeshLambertMaterial({color: 0x446622});
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.position.set(0, -0.6, 0);
        scene.add(floor);

        camera.position.set(0, 1.6, 5);

        // --- 3. TASTATUR-STEUERUNG (Laufen & Springen) ---
        const keys = { forward: false, backward: false, left: false, right: false, jump: false };
        let velocityY = 0;
        const gravity = -0.01;
        const jumpStrength = 0.18;
        const speed = 0.08;
        let canJump = false;

        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.forward = true;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.backward = true;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = true;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = true;
            if (e.code === 'Space') keys.jump = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.forward = false;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.backward = false;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = false;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = false;
            if (e.code === 'Space') keys.jump = false;
        });

        // --- 4. TOUCH-STEUERUNG (Umsehen per Wischen) ---
        let pitch = 0; // Hoch/Runter
        let yaw = 0;   // Links/Rechts
        const lookSensitivity = 0.007;
        let prevTouchX = 0;
        let prevTouchY = 0;

        window.addEventListener('touchstart', (e) => {
            prevTouchX = e.touches[0].clientX;
            prevTouchY = e.touches[0].clientY;
        });

        window.addEventListener('touchmove', (e) => {
            e.preventDefault(); // Verhindert Scrollen der Website
            
            const touchX = e.touches[0].clientX;
            const touchY = e.touches[0].clientY;
            
            const movementX = touchX - prevTouchX;
            const movementY = touchY - prevTouchY;
            
            yaw -= movementX * lookSensitivity;
            pitch -= movementY * lookSensitivity;
            
            // Begrenzung für oben/unten gucken
            pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
            
            prevTouchX = touchX;
            prevTouchY = touchY;
        });

        // --- 5. GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // 1. Kamera-Rotation anwenden
            const quatYaw = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            const quatPitch = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), pitch);
            camera.quaternion.multiplyQuaternions(quatYaw, quatPitch);

            // 2. Tastatur-Bewegung berechnen
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(quatYaw);
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(quatYaw);
            const moveDirection = new THREE.Vector3();

            if (keys.forward) moveDirection.add(forward);
            if (keys.backward) moveDirection.add(forward.clone().negate());
            if (keys.right) moveDirection.add(right);
            if (keys.left) moveDirection.add(right.clone().negate());

            moveDirection.y = 0; // Verhindert Fliegen beim Vorwärtslaufen
            if (moveDirection.lengthSq() > 0) {
                moveDirection.normalize();
                camera.position.add(moveDirection.multiplyScalar(speed));
            }

            // 3. Schwerkraft & Springen
            velocityY += gravity;
            camera.position.y += velocityY;

            if (camera.position.y < 1.6) {
                camera.position.y = 1.6;
                velocityY = 0;
                canJump = true;
            }

            if (keys.jump && canJump) {
                velocityY = jumpStrength;
                canJump = false;
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
