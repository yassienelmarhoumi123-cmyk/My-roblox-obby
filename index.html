<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>State.io Multiplayer</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: #0f172a; color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden; user-select: none;
        }
        #lobby {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95); padding: 30px; border-radius: 15px;
            border: 2px solid #a855f7; z-index: 20; width: 80%; max-width: 320px;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3); text-align: center;
        }
        input, button { font-size: 18px; padding: 12px; width: 100%; border-radius: 8px; margin-top: 10px; box-sizing: border-box; }
        input { border: 1px solid #334155; background: #1e293b; color: white; text-align: center; }
        button { background: #a855f7; border: none; font-weight: bold; color: white; cursor: pointer; }
        #gameCanvas { background: #111827; display: none; }
        #scoreBoard {
            position: absolute; top: 15px; right: 15px;
            background: rgba(15, 23, 42, 0.8); padding: 10px 15px;
            border-radius: 8px; font-size: 14px; display: none; pointer-events: none; z-index: 10;
        }
    </style>
</head>
<body>

    <div id="lobby">
        <h2 style="color: #a855f7; margin-top: 0;">🗺️ STATE.IO ONLINE</h2>
        <p style="font-size: 14px; color: #94a3b8;">Wähle einen Raum und erobere die gesamte Karte!</p>
        <input type="number" id="roomInput" placeholder="Raum-Nummer (4-stellig)">
        <button onclick="joinRoom()">Krieg beginnen! ⚔️</button>
    </div>

    <div id="scoreBoard">
        <b style="color: #a855f7;">STATISTIK:</b>
        <div id="leaderboard"></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDVCk8f0nhfJLLwycEZJN0-zJ05KURuGSQ",
            authDomain: "halal-bomben-spiel.firebaseapp.com",
            databaseURL: "https://halal-bomben-spiel-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "halal-bomben-spiel",
            storageBucket: "halal-bomben-spiel.firebasestorage.app",
            messagingSenderId: "709287849072",
            appId: "1:709287849072:web:0a477d52580b2cd3d598b5"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let roomId = "", playerId = "";
        let myColor = 'hsl(' + Math.random() * 360 + ', 85%, 55%)';
        
        let bases = [];
        let troops = []; // Fliegende Armee-Einheiten
        
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let selectedBase = null;

        function joinRoom() {
            const input = document.getElementById("roomInput").value;
            if(input.length < 4) { alert("Bitte 4 Zahlen eingeben!"); return; }
            roomId = "state_" + input;
            playerId = "Player_" + Math.floor(Math.random() * 900 + 100);

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            document.getElementById("lobby").style.display = "none";
            canvas.style.display = "block";
            document.getElementById("scoreBoard").style.display = "block";

            // 1. Basen-Layout auf der Map einmalig erstellen, wenn der Raum neu ist
            database.ref(roomId + "/bases").once("value", snapshot => {
                if(!snapshot.val()) {
                    let initialBases = [];
                    // Wir generieren 8 feste Basen auf dem Bildschirm verteilt
                    for(let i = 0; i < 9; i++) {
                        let row = Math.floor(i / 3);
                        let col = i % 3;
                        initialBases.push({
                            id: i,
                            x: (col * (canvas.width * 0.3)) + (canvas.width * 0.2),
                            y: (row * (canvas.height * 0.25)) + (canvas.height * 0.2),
                            size: Math.random() * 10 + 25, // Zufällige Größe der Basis
                            count: 15, // Start-Truppenstärke
                            owner: "neutral",
                            color: "#64748b"
                        });
                    }
                    // Die allererste Basis gehört direkt dem Ersteller
                    initialBases[0].owner = playerId;
                    initialBases[0].color = myColor;
                    initialBases[0].count = 30;

                    database.ref(roomId + "/bases").set(initialBases);
                } else {
                    // Wenn wir einem bestehenden Raum beitreten, suchen wir uns eine neutrale Basis aus
                    database.ref(roomId + "/bases").once("value", snap => {
                        let currentBases = snap.val();
                        let foundNeutral = currentBases.find(b => b.owner === "neutral");
                        if(foundNeutral) {
                            currentBases[foundNeutral.id].owner = playerId;
                            currentBases[foundNeutral.id].color = myColor;
                            currentBases[foundNeutral.id].count = 30;
                            database.ref(roomId + "/bases").set(currentBases);
                        }
                    });
                }
            });

            // Synchronisation der Basen
            database.ref(roomId + "/bases").on("value", snapshot => {
                bases = snapshot.val() || [];
            });

            // Empfang der fliegenden Armeen
            database.ref(roomId + "/attacks").on("child_added", snapshot => {
                let attack = snapshot.val();
                if(attack && attack.sender !== playerId) {
                    // Truppen für die Animation lokal hinzufügen
                    spawnVisualTroops(attack.fromId, attack.toId, attack.amount, attack.color, attack.sender);
                }
                snapshot.ref.remove(); // Sofort als Event-Trigger löschen
            });

            // Wenn man die Seite schließt, werden eigene Basen wieder neutralisiert
            window.onbeforeunload = function() {
                bases.forEach(b => {
                    if(b.owner === playerId) {
                        database.ref(roomId + "/bases/" + b.id).update({ owner: "neutral", color: "#64748b" });
                    }
                });
            };

            // Game Loops
            setInterval(productionLoop, 1000); // Jede Sekunde neue Truppen generieren
            setInterval(updatePhysics, 1000 / 40); // Flüssige Truppenbewegung
        }

        // Klick/Touch Erkennung auf dem iPad
        window.addEventListener("pointerdown", e => {
            let clickedBase = getBaseAt(e.clientX, e.clientY);
            
            if(clickedBase) {
                if(clickedBase.owner === playerId) {
                    // Eigene Basis ausgewählt
                    selectedBase = clickedBase;
                } else if(selectedBase) {
                    // Befehl: Eigene Basis greift ausgewählte gegnerische/neutrale Basis an!
                    sendTroops(selectedBase.id, clickedBase.id);
                    selectedBase = null;
                }
            } else {
                selectedBase = null; // Ins Leere geklickt
            }
        });

        function getBaseAt(x, y) {
            return bases.find(b => Math.hypot(b.x - x, b.y - y) < b.size + 15);
        }

        // Angriffs-Befehl ausführen
        function sendTroops(fromId, toId) {
            let fromBase = bases[fromId];
            if(fromBase.count < 2) return;

            let sendAmount = Math.floor(fromBase.count / 2);
            // Lokale Basis abziehen
            database.ref(roomId + "/bases/" + fromId).update({ count: fromBase.count - sendAmount });

            // An Firebase senden, damit andere Spieler die Einheiten fliegen sehen
            database.ref(roomId + "/attacks").push({
                sender: playerId, fromId: fromId, toId: toId, amount: sendAmount, color: myColor
            });

            // Eigene Animation starten
            spawnVisualTroops(fromId, toId, sendAmount, myColor, playerId);
        }

        function spawnVisualTroops(fromId, toId, amount, color, senderId) {
            let from = bases[fromId];
            let to = bases[toId];
            if(!from || !to) return;

            // Spawne die Punkte zeitlich leicht versetzt für einen coolen Ameisen-Spur-Effekt
            for(let i = 0; i < amount; i++) {
                setTimeout(() => {
                    // Leichtes Rauschen bei der Startposition für organischen Look
                    let angle = Math.random() * Math.PI * 2;
                    let startX = from.x + Math.cos(angle) * 10;
                    let startY = from.y + Math.sin(angle) * 10;

                    troops.push({
                        x: startX, y: startY,
                        targetId: toId,
                        targetX: to.x, targetY: to.y,
                        color: color,
                        sender: senderId,
                        speed: 3 + Math.random() * 1.5
                    });
                }, i * 80);
            }
        }

        // Truppen-Produktion (Basen laden sich automatisch auf)
        function productionLoop() {
            bases.forEach(b => {
                if(b.owner !== "neutral" && b.count < 50) { // Limit von maximal 50 Truppen pro Basis
                    database.ref(roomId + "/bases/" + b.id).update({ count: b.count + 1 });
                }
            });
        }

        function updatePhysics() {
            // Fliegende Truppen bewegen
            for (let i = troops.length - 1; i >= 0; i--) {
                let t = troops[i];
                let target = bases[t.targetId];

                if (!target) { troops.splice(i, 1); continue; }

                let dx = target.x - t.x;
                let dy = target.y - t.y;
                let dist = Math.hypot(dx, dy);

                if (dist < target.size) {
                    // Truppe hat die Zielbasis erreicht!
                    handleBaseImpact(t);
                    troops.splice(i, 1);
                } else {
                    // Vorwärts fliegen
                    t.x += (dx / dist) * t.speed;
                    t.y += (dy / dist) * t.speed;
                }
            }
            draw();
        }

        // Berechnung beim Einschlag einer Truppe in eine Basis
        function handleBaseImpact(troop) {
            // Nur das iPad des Angreifers ODER des Verteidigers berechnet den Einschlag, um Doppelberechnungen zu verhindern
            if (troop.sender !== playerId) return; 

            let target = bases[troop.targetId];
            if (!target) return;

            if (target.owner === troop.sender) {
                // Eigene Basis verstärken
                database.ref(roomId + "/bases/" + target.id).update({ count: target.count + 1 });
            } else {
                // Gegnerische Basis angreifen
                let newCount = target.count - 1;
                if (newCount < 0) {
                    // Basis EROBERT!
                    database.ref(roomId + "/bases/" + target.id).set({
                        id: target.id, x: target.x, y: target.y, size: target.size,
                        count: 1, owner: troop.sender, color: troop.color
                    });
                } else {
                    // Nur Truppenstärke verringern
                    database.ref(roomId + "/bases/" + target.id).update({ count: newCount });
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Verbindungs-Linien zeichnen, wenn eine Basis ausgewählt ist
            if (selectedBase) {
                ctx.strokeStyle = myColor; ctx.lineWidth = 3; ctx.setLineDash([6, 6]);
                bases.forEach(b => {
                    if (b.id !== selectedBase.id) {
                        ctx.beginPath(); ctx.moveTo(selectedBase.x, selectedBase.y); ctx.lineTo(b.x, b.y); ctx.stroke();
                    }
                });
                ctx.setLineDash([]);
            }

            // Alle Basen (Staaten) zeichnen
            let stats = {};
            bases.forEach(b => {
                stats[b.owner] = (stats[b.owner] || 0) + 1;

                // Äußerer Leuchtkreis bei Selektion
                if (selectedBase && b.id === selectedBase.id) {
                    ctx.beginPath(); ctx.arc(b.x, b.y, b.size + 10, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.fill();
                }

                // Haupt-Kreis der Basis
                ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                ctx.fillStyle = b.color; ctx.fill();
                ctx.strokeStyle = "#1e293b"; ctx.lineWidth = 4; ctx.stroke();

                // Truppen-Zahl in der Mitte
                ctx.fillStyle = "white"; ctx.font = "bold 16px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(b.count, b.x, b.y);
            });

            // Alle fliegenden Truppen-Punkte zeichnen
            troops.forEach(t => {
                ctx.beginPath(); ctx.arc(t.x, t.y, 5, 0, Math.PI * 2);
                ctx.fillStyle = t.color; ctx.fill();
            });

            // UI Bestenliste updaten
            let lbHtml = "";
            Object.keys(stats).forEach(owner => {
                if(owner !== "neutral") {
                    lbHtml += `<div>${owner === playerId ? "<b>DU</b>" : owner}: ${stats[owner]} Länder</div>`;
                }
            });
            document.getElementById("leaderboard").innerHTML = lbHtml;
        }

        window.addEventListener("resize", () => {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
