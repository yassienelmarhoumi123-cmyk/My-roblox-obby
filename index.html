<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Classroom Resources</title>
    <style>
        body { 
            background-color: #8a2be2; 
            color: white; 
            font-family: sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
            overflow: auto;
        }
        h1 { margin-bottom: 30px; font-size: 2.5em; }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); 
            gap: 25px; 
            max-width: 900px;
            margin: 0 auto;
        }

        .card { 
            background: rgba(0, 0, 0, 0.4); 
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px; 
            padding: 15px; 
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .card:hover { transform: translateY(-5px); background: rgba(0, 0, 0, 0.6); }
        .card img { width: 100%; border-radius: 15px; aspect-ratio: 1/1; object-fit: cover; }
        
        /* Das Spielfenster im Fullscreen-Modus */
        #game-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 9999;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 0, 0, 0.8);
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 1em;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            z-index: 10000;
        }
    </style>
</head>
<body>

    <div id="game-overlay">
        <button class="close-btn" onclick="closeGame()">X ZU</button>
        <iframe id="game-frame" src="" allowfullscreen></iframe>
    </div>

    <h1>Classroom Resources</h1>

    <div class="grid">
        <!-- Basket Random -->
        <div class="card" onclick="openGame('https://basketballrandom.gitlab.io/')">
            <img src="https://play-lh.googleusercontent.com/I6P9S9X1vD2zQ7z_Xp6hY9Y9Q-W6zCj6X_O3o7G3_5R6T-mU6n-9f_8R3n-v_8" alt="Basket Random">
            <div class="game-title">Basket Random</div>
        </div>

        <!-- Granny 2 -->
        <div class="card" onclick="openGame('https://horrorgamesfree.com/granny2')">
            <img src="https://play-lh.googleusercontent.com/6X9k7aHhK8V6zCj6X_O3o7G3_5R6T-mU6n-9f_8R3n-v_8" alt="Granny 2">
            <div class="game-title">Granny 2</div>
        </div>
    </div>

    <script>
        function openGame(url) {
            var frame = document.getElementById('game-frame');
            var overlay = document.getElementById('game-overlay');
            frame.src = url;
            overlay.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeGame() {
            var frame = document.getElementById('game-frame');
            var overlay = document.getElementById('game-overlay');
            overlay.style.display = 'none';
            frame.src = '';
            document.body.style.overflow = 'auto';
        }
    </script>

</body>
</html>
