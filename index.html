<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Bugatti Chiron Simulator</title>
    <style>
        body { margin: 0; overflow: hidden; background: #9ca3af; font-family: 'Segoe UI', sans-serif; user-select: none; }
        
        /* Infobox oben links */
        #info {
            position: absolute; top: 15px; left: 15px;
            color: white; background: rgba(15, 23, 42, 0.9);
            padding: 15px 22px; border-radius: 12px; font-size: 16px;
            pointer-events: none; border: 2px solid #38bdf8; z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            line-height: 1.6;
        }
        #status { color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>

    <div id="info">
        🏎️ <b>BUGATTI SIMULATOR</b><br>
        Laufen / Fahren: <span style="color:#facc15">W, A, S, D</span><br>
        Einsteigen: <span style="color:#10b981">E</span> (Beim Auto stehen)<br>
        Aussteigen: <span style="color:#ef4444">F</span><br>
        Kamera wechseln: <span style="color:#a855f7">C</span> (Im Auto)<br><br>
        Status: <span id="status">Zu Fuß</span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        // 1. 3D-Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x9ca3af);
        scene.fog = new THREE.Fog(0x9ca3af, 40, 180);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Lichtquellen optimieren
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(30, 50, 30);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Bodenebene
        const floorGeo = new THREE.PlaneGeometry(1000, 1000);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.5 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const grid = new THREE.GridHelper(1000, 120, 0x0f172a, 0x4b5563);
        grid.position.y = 0.01;
        scene.add(grid);

        // Logik-Variablen
        let carModel = null;
        let inCar = false;

        let playerPos = { x: 0, z: 15 };
        let carPos = { x: 0, z: 0 };
        let carSpeed = 0;
        let carAngle = 0;

        // Kamera-Modus Variable (0 = Hinten, 1 = Oben, 2 = Von Innen / Cockpit)
        let cameraMode = 0;

        // Tuning-Werte fürs Fahren
        const maxSpeed = 0.8;
        const acceleration = 0.02;
        const friction = 0.008;
        const turnSpeed = 0.04;

        const keys = { w: false, a: false, s: false, d: false };

        // 2. Tastatur-Abfragen
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = true;

            // E - Einsteigen
            if (key === 'e' && !inCar) {
                if (!carModel) return;
                let distance = Math.hypot(playerPos.x - carPos.x, playerPos.z - carPos.z);
                
                if (distance < 20) {
                    inCar = true;
                    document.getElementById("status").innerText = "Im Bugatti";
                    document.getElementById("status").style.color = "#10b981";
                }
            }

            // F - Aussteigen
            if (key === 'f' && inCar) {
                inCar = false;
                playerPos.x = carPos.x - Math.cos(carAngle) * 8;
                playerPos.z = carPos.z + Math.sin(carAngle) * 8;
                document.getElementById("status").innerText = "Zu Fuß";
                document.getElementById("status").style.color = "#38bdf8";
            }

            // C - Kamera wechseln
            if (key === 'c' && inCar) {
                cameraMode = (cameraMode + 1) % 3; // Schaltet durch 0, 1, 2
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = false;
        });

        // 3. BUGATTI MODELL MIT SKALIERUNG LADEN
        const loader = new THREE.GLTFLoader();
        
        loader.load('2016_bugatti_chiron.glb', function (gltf) {
            carModel = gltf.scene;
            carModel.position.set(carPos.x, 0, carPos.z);
            carModel.scale.set(250, 250, 250);

            carModel.traverse(function (child) {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    if(child.material) {
                        child.material.roughness = 0.1;
                        child.material.metalness = 0.8;
                    }
                }
            });

            scene.add(carModel);
            console.log("Bugatti Chiron einsatzbereit!");
        }, undefined, function (error) {
            console.error("Fehler beim Laden:", error);
        });

        // 4. Game-Loop Animation
        function animate() {
            requestAnimationFrame(animate);

            if (inCar) {
                // --- AUTO MODUS (WASD) ---
                if (keys.w) {
                    carSpeed = Math.min(carSpeed + acceleration, maxSpeed);
                } else if (keys.s) {
                    carSpeed = Math.max(carSpeed - acceleration, -maxSpeed / 2);
                } else {
                    if (carSpeed > 0) carSpeed = Math.max(0, carSpeed - friction);
                    if (carSpeed < 0) carSpeed = Math.min(0, carSpeed + friction);
                }

                if (Math.abs(carSpeed) > 0.01) {
                    if (keys.a) carAngle += carSpeed > 0 ? turnSpeed : -turnSpeed;
                    if (keys.d) carAngle -= carSpeed > 0 ? turnSpeed : -turnSpeed;
                }

                carPos.x += Math.sin(carAngle) * carSpeed;
                carPos.z += Math.cos(carAngle) * carSpeed;

                if (carModel) {
                    carModel.position.set(carPos.x, 0, carPos.z);
                    carModel.rotation.y = carAngle;
                }

                // --- KAMERA LOGIK (Wechseln mit C) ---
                if (cameraMode === 0) {
                    // Modus 1: Klassisch von hinten oben folgend
                    camera.position.set(
                        carPos.x - Math.sin(carAngle) * 28,
                        12,
                        carPos.z - Math.cos(carAngle) * 28
                    );
                    camera.lookAt(carPos.x, 3, carPos.z);
                } 
                else if (cameraMode === 1) {
                    // Modus 2: Vogelperspektive (Direkt von oben)
                    camera.position.set(carPos.x, 45, carPos.z);
                    camera.lookAt(carPos.x, 0, carPos.z);
                } 
                else if (cameraMode === 2) {
                    // 🔥 Modus 3: INNENANSICHT (Cockpit / Ego-Perspektive)
                    // Setzt die Kamera genau ins Innere des skalierten Autos
                    camera.position.set(
                        carPos.x + Math.sin(carAngle) * 0.5, 
                        2.8, // Höhe des Fahrersitzes
                        carPos.z + Math.cos(carAngle) * 0.5
                    );
                    // Die Kamera blickt geradeaus nach vorne durch die Windschutzscheibe
                    camera.lookAt(
                        carPos.x + Math.sin(carAngle) * 50,
                        2.5,
                        carPos.z + Math.cos(carAngle) * 50
                    );
                }

            } else {
                // --- ZU FUSS MODUS (WASD) ---
                const moveSpeed = 0.2;
                if (keys.w) playerPos.z -= moveSpeed;
                if (keys.s) playerPos.z += moveSpeed;
                if (keys.a) playerPos.x -= moveSpeed;
                if (keys.d) playerPos.x += moveSpeed;

                camera.position.set(playerPos.x, 15, playerPos.z + 25);
                camera.lookAt(playerPos.x, 0, playerPos.z);
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
