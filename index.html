<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Ultimate Freddy Fazbear Obby Engine</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #050505; font-family: 'Arial Black', sans-serif; }
        #debug-console { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); color: #00ff00; padding: 15px; border-radius: 5px; font-family: monospace; z-index: 1000; pointer-events: none; border: 1px solid #333; }
        #ui-overlay { position: absolute; top: 20px; right: 20px; text-align: right; color: white; z-index: 999; }
    </style>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
</head>
<body>
    <div id="debug-console">Initialisiere Freddy Obby Engine...</div>
    <div id="ui-overlay">
        <h1>FREDDY OBBY V2</h1>
        <p id="status">Warte auf Assets...</p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        /**
         * CLASS: GameEngine
         * Verwaltet die komplette 3D-Welt, Licht, Kamera und den Game-Loop.
         */
        class GameEngine {
            constructor() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x101010);
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.shadowMap.enabled = true;
                document.body.appendChild(this.renderer.domElement);

                this.lights();
                this.setupEnvironment();
                this.freddy = new FreddyController(this.scene);
                
                this.clock = new THREE.Clock();
                this.render();
            }

            lights() {
                const amb = new THREE.AmbientLight(0xffffff, 0.5);
                this.scene.add(amb);
                const sun = new THREE.DirectionalLight(0xffffff, 2.0);
                sun.position.set(50, 100, 50);
                sun.castShadow = true;
                this.scene.add(sun);
            }

            setupEnvironment() {
                const floor = new THREE.Mesh(
                    new THREE.PlaneGeometry(1000, 1000),
                    new THREE.MeshStandardMaterial({ color: 0x222222 })
                );
                floor.rotation.x = -Math.PI / 2;
                this.scene.add(floor);
            }

            render() {
                requestAnimationFrame(() => this.render());
                const dt = this.clock.getDelta();
                this.freddy.update(dt);
                
                // Kamera folgt Freddy
                this.camera.position.lerp(new THREE.Vector3(this.freddy.group.position.x, this.freddy.group.position.y + 5, this.freddy.group.position.z + 10), 0.1);
                this.camera.lookAt(this.freddy.group.position);
                
                this.renderer.render(this.scene, this.camera);
            }
        }

        /**
         * CLASS: FreddyController
         * Verwaltet das Modell, die Sichtbarkeit und Animationen.
         */
        class FreddyController {
            constructor(scene) {
                this.group = new THREE.Group();
                scene.add(this.group);
                this.loadModel();
            }

            loadModel() {
                const loader = new GLTFLoader();
                const log = document.getElementById('debug-console');
                log.innerText = "Lade Freddy-Modell...";

                loader.load('./freddy-fazbear.glb', (gltf) => {
                    this.model = gltf.scene;
                    
                    // AUTO-FIX: Modell normalisieren
                    const box = new THREE.Box3().setFromObject(this.model);
                    const size = new THREE.Vector3();
                    box.getSize(size);
                    const center = new THREE.Vector3();
                    box.getCenter(center);
                    
                    // Skalierung: Wenn Modell zu klein/groß ist
                    const scale = 2.0 / Math.max(size.x, size.y, size.z);
                    this.model.scale.set(scale, scale, scale);
                    this.model.position.sub(center.multiplyScalar(scale));

                    // Sicherstellen, dass das Material sichtbar ist
                    this.model.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            // Erzwinge Material, falls Shader fehlschlagen
                            if(child.material) {
                                child.material.side = THREE.DoubleSide;
                                child.material.needsUpdate = true;
                            }
                        }
                    });

                    this.group.add(this.model);
                    log.innerText = "Freddy erfolgreich geladen & zentriert!";
                    document.getElementById('status').innerText = "Status: Bereit";

                }, (xhr) => {
                    const percent = (xhr.loaded / xhr.total * 100).toFixed(0);
                    log.innerText = `Ladevorgang: ${percent}%`;
                }, (error) => {
                    log.innerText = "FEHLER: Konnte Modell nicht laden! Prüfe Konsole.";
                    console.error("Modell Fehler:", error);
                    // FALLBACK: Ein Würfel anzeigen, damit man sieht, dass das Spiel läuft
                    const cube = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshNormalMaterial());
                    this.group.add(cube);
                });
            }

            update(dt) {
                // Hier könntest du eine Lauf-Logik einbauen
                this.group.rotation.y += 0.005; 
            }
        }

        // Startpunkt
        new GameEngine();
    </script>
</body>
</html>
