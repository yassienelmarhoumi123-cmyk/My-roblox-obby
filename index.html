<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Resources</title>
    <style>
        /* Grunddesign der Seite */
        body { 
            background-color: #8a2be2; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }

        h1 { 
            margin-bottom: 30px; 
            font-size: 2.5em; 
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5); 
        }

        /* Layout für die Spiele-Karten */
        .grid { 
            display: flex; 
            justify-content: center; 
            gap: 25px; 
            flex-wrap: wrap; 
            max-width: 1000px; 
            margin: 0 auto; 
        }

        /* Design der einzelnen Karte */
        .card { 
            background: rgba(0, 0, 0, 0.4); 
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px; 
            padding: 15px; 
            width: 220px; 
            cursor: pointer; 
            transition: transform 0.3s ease, background 0.3s ease; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .card:hover { 
            transform: translateY(-10px); 
            background: rgba(255, 255, 255, 0.1); 
            border-color: white;
        }

        .card img { 
            width: 100%; 
            aspect-ratio: 1/1; 
            object-fit: cover; 
            border-radius: 15px; 
            display: block; 
        }

        .game-title { 
            padding-top: 15px; 
            font-size: 1.1em; 
            font-weight: bold; 
            text-transform: uppercase;
        }

        /* Overlay für das Spiel */
        #game-overlay { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: black; 
            z-index: 1000; 
        }

        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }

        /* Schließen-Button im Spiel */
        .close-btn { 
            position: absolute; 
            top: 15px; 
            right: 15px; 
            background: #ff0000; 
            color: white; 
            border: 2px solid white; 
            padding: 10px 20px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            z-index: 1001;
        }
    </style>
</head>
<body>

    <!-- Overlay Container -->
    <div id="game-overlay">
        <button class="close-btn" onclick="closeGame()">X SCHLIESSEN</button>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <h1>Classroom Resources</h1>

    <div class="grid">
        <!-- Basket Random -->
        <div class="card" onclick="openGame('https://basketballrandom.gitlab.io/')">
            <img src="basket.png" alt="Halal Basket Random">
            <div class="game-title">Halal Basket Random</div>
        </div>

        <!-- Wordle Deutsch -->
        <div class="card" onclick="openGame('https://wordledeutsch.org/')">
            <img src="wordle.png" alt="Halal Wordle">
            <div class="game-title">Halal Wordle</div>
        </div>

        <!-- Halal Granny 2 -->
        <div class="card" onclick="openGame('https://horrorgamesfree.com/granny2')">
            <img src="halalgranny.png" alt="Halal Granny 2">
            <div class="game-title" style="color: #ff4444;">Halal Granny 2</div>
        </div>
    </div>

    <script>
        function openGame(url) {
            document.getElementById('game-frame').src = url;
            document.getElementById('game-overlay').style.display = 'block';
            document.body.style.overflow = 'hidden'; // Verhindert Scrollen der Hauptseite
        }

        function closeGame() {
            document.getElementById('game-overlay').style.display = 'none';
            document.getElementById('game-frame').src = '';
            document.body.style.overflow = 'auto';
        }
    </script>

</body>
</html>
