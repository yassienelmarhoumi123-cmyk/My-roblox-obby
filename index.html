<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>State.io Pro Multiplayer - Fixed</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: #1e1e24; color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden; user-select: none;
            touch-action: none;
        }
        #lobby {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(30, 30, 36, 0.95); padding: 30px; border-radius: 15px;
            border: 3px solid #3b82f6; z-index: 20; width: 85%; max-width: 340px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center;
        }
        input, button { font-size: 18px; padding: 12px; width: 100%; border-radius: 8px; margin-top: 12px; box-sizing: border-box; }
        input { border: 2px solid #4b5563; background: #2d2d35; color: white; text-align: center; }
        button { background: #3b82f6; border: none; font-weight: bold; color: white; cursor: pointer; }
        #gameCanvas { background: #25252b; display: none; }
        #scoreBoard {
            position: absolute; top: 15px; right: 15px;
            background: rgba(30, 30, 36, 0.85); padding: 12px 18px;
            border-radius: 10px; font-size: 14px; display: none; pointer-events: none; z-index: 10;
            border: 1px solid #4b5563;
        }
    </style>
</head>
<body>

    <div id="lobby">
        <h2 style="color: #3b82f6; margin-top: 0; font-size: 26px;">🗺️ STATE.IO MULTIPLAYER</h2>
        <p style="font-size: 14px; color: #9ca3af;">Verbinde deine Basen und erobere die ganze Map!</p>
        <input type="number" id="roomInput" placeholder="Raum-Nummer (4-stellig)">
        <button onclick="joinRoom()">Server beitreten ⚔️</button>
    </div>

    <div id="scoreBoard">
        <b style="color: #3b82f6; font-size: 16px;">TERRITORIEN:</b>
        <div id="leaderboard" style="margin-top: 5px;"></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDVCk8f0nhfJLLwycEZJN0-zJ05KURuGSQ",
            authDomain: "halal-bomben-spiel.firebaseapp.com",
            databaseURL: "https://halal-bomben-spiel-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "halal-bomben-spiel",
            storageBucket: "halal-bomben-spiel.firebasestorage.app",
            messagingSenderId: "709287849072",
            appId: "1:709287849072:web:0a477d52580b2cd3d598b5"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let roomId = "", playerId = "";
        let myColor = 'hsl(' + Math.random() * 360 + ', 85%, 55%)';
        
        let bases = [];
        let troops = []; 
        
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let activeBase = null; 
        let currentMouseX = 0, currentMouseY = 0;
        let isDragging = false;

        function joinRoom() {
            const input = document.getElementById("roomInput").value;
            if(input.length < 4) { alert("Bitte 4 Zahlen eingeben!"); return; }
            roomId = "statepro_" + input;
            playerId = "General_" + Math.floor(Math.random() * 900 + 100);

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            document.getElementById("lobby").style.display = "none";
            canvas.style.display = "block";
            document.getElementById("scoreBoard").style.display = "block";

            database.ref(roomId + "/bases").once("value", snapshot => {
                if(!snapshot.val()) {
                    let initialBases = [];
                    // Präzise, vordefinierte Positionen wie im Video
                    let positions = [
                        {x: 0.25, y: 0.2}, {x: 0.5, y: 0.2}, {x: 0.75, y: 0.2},
                        {x: 0.2, y: 0.5},  {x: 0.5, y: 0.5}, {x: 0.8, y: 0.5},
                        {x: 0.25, y: 0.8}, {x: 0.5, y: 0.8}, {x: 0.75, y: 0.8}
                    ];

                    positions.forEach((pos, idx) => {
                        initialBases.push({
                            id: idx,
                            x: canvas.width * pos.x,
                            y: canvas.height * pos.y,
                            size: 28, 
                            count: 10, 
                            owner: "neutral",
                            color: "#9ca3af"
                        });
                    });

                    // Startbasis grün/blau/zufällig für dich
                    initialBases[1].owner = playerId;
                    initialBases[1].color = myColor;
                    initialBases[1].count = 25;

                    database.ref(roomId + "/bases").set(initialBases);
                } else {
                    database.ref(roomId + "/bases").once("value", snap => {
                        let currentBases = snap.val();
                        let freeBase = currentBases.find(b => b.owner === "neutral");
                        if(freeBase) {
                            currentBases[freeBase.id].owner = playerId;
                            currentBases[freeBase.id].color = myColor;
                            currentBases[freeBase.id].count = 25;
                            database.ref(roomId + "/bases").set(currentBases);
                        }
                    });
                }
            });

            database.ref(roomId + "/bases").on("value", snapshot => { bases = snapshot.val() || []; });

            database.ref(roomId + "/attacks").on("child_added", snapshot => {
                let atk = snapshot.val();
                if(atk && atk.sender !== playerId) {
                    spawnVisualTroops(atk.fromId, atk.toId, atk.amount, atk.color, atk.sender);
                }
                snapshot.ref.remove();
            });

            window.onbeforeunload = function() {
                bases.forEach(b => {
                    if(b.owner === playerId) database.ref(roomId + "/bases/" + b.id).update({ owner: "neutral", color: "#9ca3af" });
                });
            };

            canvas.addEventListener("pointerdown", onPointerDown);
            canvas.addEventListener("pointermove", onPointerMove);
            canvas.addEventListener("pointerup", onPointerUp);

            setInterval(productionLoop, 1000); 
            setInterval(updatePhysics, 1000 / 50); 
        }

        function onPointerDown(e) {
            let base = getBaseAt(e.clientX, e.clientY, 30); // Kleiner Radius beim Anklicken für Genauigkeit
            if(base && base.owner === playerId) {
                activeBase = base;
                isDragging = true;
                currentMouseX = e.clientX;
                currentMouseY = e.clientY;
            }
        }

        function onPointerMove(e) {
            if(!isDragging) return;
            currentMouseX = e.clientX;
            currentMouseY = e.clientY;
        }

        function onPointerUp(e) {
            if(!isDragging) return;
            isDragging = false;

            // 🔥 MAGNET-EFFEKT: Großer Toleranz-Radius (65 Pixel) beim Loslassen auf dem iPad
            let targetBase = getBaseAt(e.clientX, e.clientY, 65); 
            
            if(targetBase && targetBase.id !== activeBase.id) {
                sendTroops(activeBase.id, targetBase.id);
            }
            activeBase = null;
        }

        // Radius-Erkennung flexibel anpassbar gemacht
        function getBaseAt(x, y, tolerance) {
            return bases.find(b => Math.hypot(b.x - x, b.y - y) < b.size + tolerance);
        }

        function sendTroops(fromId, toId) {
            let fromBase = bases[fromId];
            if(fromBase.count < 2) return;

            // Schicke fast alle Einheiten los, aber lass genau 1 zur Verteidigung drin
            let sendAmount = fromBase.count - 1; 
            database.ref(roomId + "/bases/" + fromId).update({ count: 1 });

            database.ref(roomId + "/attacks").push({
                sender: playerId, fromId: fromId, toId: toId, amount: sendAmount, color: myColor
            });

            spawnVisualTroops(fromId, toId, sendAmount, myColor, playerId);
        }

        function spawnVisualTroops(fromId, toId, amount, color, senderId) {
            let from = bases[fromId];
            let to = bases[toId];
            if(!from || !to) return;

            // Truppen marschieren flüssig nacheinander aus dem Zentrum der Basis
            for(let i = 0; i < amount; i++) {
                setTimeout(() => {
                    if (!bases[fromId]) return;
                    troops.push({
                        x: from.x, 
                        y: from.y,
                        targetId: toId,
                        color: color,
                        sender: senderId,
                        speed: 4.2 // Leicht erhöhte Geschwindigkeit für flüssigeres Gameplay
                    });
                }, i * 100); 
            }
        }

        function productionLoop() {
            bases.forEach(b => {
                // Nur aktive Spieler-Basen produzieren Truppen bis maximal 60
                if(b.owner !== "neutral" && b.count < 60) {
                    database.ref(roomId + "/bases/" + b.id).update({ count: b.count + 1 });
                }
            });
        }

        function updatePhysics() {
            for (let i = troops.length - 1; i >= 0; i--) {
                let t = troops[i];
                let target = bases[t.targetId];

                if (!target) { troops.splice(i, 1); continue; }

                let dx = target.x - t.x;
                let dy = target.y - t.y;
                let dist = Math.hypot(dx, dy);

                // Wenn der Punkt nah genug am Kreisrand ist, zieht er ab/erbert
                if (dist < target.size) {
                    handleBaseImpact(t);
                    troops.splice(i, 1);
                } else {
                    t.x += (dx / dist) * t.speed;
                    t.y += (dy / dist) * t.speed;
                }
            }
            draw();
        }

        function handleBaseImpact(troop) {
            if (troop.sender !== playerId) return; 

            let target = bases[troop.targetId];
            if (!target) return;

            if (target.owner === troop.sender) {
                // Gleiches Team -> Aufstocken
                database.ref(roomId + "/bases/" + target.id).update({ count: target.count + 1 });
            } else {
                // Gegner/Neutral -> Abziehen
                let newCount = target.count - 1;
                if (newCount < 0) {
                    // EROBERUNG ERFOLGREICH!
                    database.ref(roomId + "/bases/" + target.id).set({
                        id: target.id, x: target.x, y: target.y, size: target.size,
                        count: 1, owner: troop.sender, color: troop.color
                    });
                } else {
                    database.ref(roomId + "/bases/" + target.id).update({ count: newCount });
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Pfeil-Verbindungslinie beim Ziehen (Wird jetzt IMMER exakt angezeigt)
            if (isDragging && activeBase) {
                ctx.strokeStyle = myColor; ctx.lineWidth = 4;
                ctx.setLineDash([6, 4]);
                ctx.beginPath();
                ctx.moveTo(activeBase.x, activeBase.y);
                ctx.lineTo(currentMouseX, currentMouseY);
                ctx.stroke();
                ctx.setLineDash([]);

                // Ziel-Indikator Punkt
                ctx.beginPath(); ctx.arc(currentMouseX, currentMouseY, 8, 0, Math.PI * 2);
                ctx.fillStyle = myColor; ctx.fill();
            }

            // Basen zeichnen
            let stats = {};
            bases.forEach(b => {
                stats[b.owner] = (stats[b.owner] || 0) + 1;

                if (isDragging && activeBase && b.id === activeBase.id) {
                    ctx.beginPath(); ctx.arc(b.x, b.y, b.size + 10, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.fill();
                }

                // Basis Ring
                ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                ctx.fillStyle = b.color; ctx.fill();
                ctx.strokeStyle = "#ffffff"; ctx.lineWidth = b.owner === playerId ? 3 : 1; ctx.stroke();

                // Zahl
                ctx.fillStyle = "white"; ctx.font = "bold 16px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(b.count, b.x, b.y);
            });

            // Truppen zeichnen
            troops.forEach(t => {
                ctx.beginPath(); ctx.arc(t.x, t.y, 5, 0, Math.PI * 2);
                ctx.fillStyle = t.color; ctx.fill();
                ctx.strokeStyle = "rgba(0,0,0,0.3)"; ctx.lineWidth = 1; ctx.stroke();
            });

            // Rangliste
            let lbHtml = "";
            Object.keys(stats).forEach(owner => {
                if(owner !== "neutral") {
                    lbHtml += `<div>${owner === playerId ? "<b>DU</b>" : owner}: <span style="font-weight:bold;">${stats[owner]}</span></div>`;
                }
            });
            document.getElementById("leaderboard").innerHTML = lbHtml;
        }

        window.addEventListener("resize", () => {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
