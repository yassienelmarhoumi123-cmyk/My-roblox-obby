<!DOCTYPE html>
<html>
<head>
<style>
    body { background-color: #8a2be2; font-family: sans-serif; color: white; text-align: center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; padding: 20px; }
    .card { background: #333; border-radius: 10px; padding: 10px; cursor: pointer; }
    .card img { width: 100%; border-radius: 5px; }
    /* Das Spiel-Fenster, das sich öffnet */
    #game-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 100; }
    iframe { width: 100%; height: 100%; border: none; }
    .close-btn { position: absolute; top: 10px; right: 10px; background: red; color: white; padding: 10px; cursor: pointer; border-radius: 5px; }
</style>
</head>
<body>

<div id="game-container">
    <div class="close-btn" onclick="closeGame()">X Schließen</div>
    <iframe id="game-frame" src=""></iframe>
</div>

<h2>Meine Lern-Spiele</h2>
<div class="grid">
    <div class="card" onclick="openGame('https://fayadgamer13.github.io')">
        <img src="https://magascia.com/wp-content/uploads/2023/11/minecraft-classic.jpg">
        <p>Minecraft</p>
    </div>
    <div class="card" onclick="openGame('https://granny-unblocked.github.io')">
        <img src="https://play-lh.googleusercontent.com/6X9k7aHhK8V6zCj6X_O3o7G3_5R6T-mU6n-9f_8R3n-v_8">
        <p>Granny</p>
    </div>
</div>

<script>
    function openGame(url) {
        document.getElementById('game-frame').src = url;
        document.getElementById('game-container').style.display = 'block';
    }
    function closeGame() {
        document.getElementById('game-container').style.display = 'none';
        document.getElementById('game-frame').src = '';
    }
</script>

</body>
</html>
