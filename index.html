<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slither.io Klassen-Edition</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: #0b0f19; color: white;
            font-family: 'Segoe UI', sans-serif;
            text-align: center; overflow: hidden; user-select: none;
        }
        #lobby {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(11, 15, 25, 0.95);
            padding: 30px; border-radius: 20px;
            border: 2px solid #00f588; z-index: 20; width: 80%; max-width: 350px;
            box-shadow: 0 0 30px rgba(0, 245, 136, 0.2);
        }
        button {
            background: #00f588; border: none; padding: 12px 25px;
            font-size: 18px; font-weight: bold; color: #0b0f19;
            border-radius: 10px; cursor: pointer; margin-top: 15px;
            width: 100%;
        }
        #gameCanvas {
            background: #111827; display: none;
            border: 2px solid #1f2937; margin: 0 auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #scoreBoard {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.6); padding: 10px 15px;
            border-radius: 8px; text-align: right; font-size: 14px;
            display: none; pointer-events: none; max-width: 200px;
        }
    </style>
</head>
<body>

    <!-- LOBBY -->
    <div id="lobby">
        <h2>🐍 Slither.io Live 🐍</h2>
        <p>Gib den 4-stelligen Raum-Code ein:</p>
        <input type="number" id="roomInput" placeholder="2026" style="font-size: 24px; width: 100%; text-align: center; padding: 8px; border-radius: 8px; border: 1px solid #374151; background: #1f2937; color: white;"><br>
        <button onclick="joinRoom()">In die Arena beitreten 🚀</button>
    </div>

    <!-- LEADERBOARD -->
    <div id="scoreBoard" id="scoreBoard">
        <b style="color: #00f588;">TOP SCHLANGEN:</b>
        <div id="leaderboardList"></div>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <!-- Firebase laden -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // DEIN BELGIEN-SERVER IST AN ERSTER STELLE EINGEBAUT:
        const firebaseConfig = {
            apiKey: "AIzaSyDVCk8f0nhfJLLwycEZJN0-zJ05KURuGSQ",
            authDomain: "halal-bomben-spiel.firebaseapp.com",
            databaseURL: "https://halal-bomben-spiel-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "halal-bomben-spiel",
            storageBucket: "halal-bomben-spiel.firebasestorage.app",
            messagingSenderId: "709287849072",
            appId: "1:709287849072:web:0a477d52580b2cd3d598b5"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let roomId = "", playerId = "";
        let snakes = {}, foods = {};
        let myLength = 5;
        let myTail = [];
        let alive = true;

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        let myX = Math.random() * 700 + 50;
        let myY = Math.random() * 500 + 50;
        let angle = Math.random() * Math.PI * 2;
        let speed = 4;

        function joinRoom() {
            const input = document.getElementById("roomInput").value;
            if(input.length < 4) { alert("Bitte 4 Zahlen eingeben!"); return; }
            roomId = "snake_" + input;
            playerId = "snake_" + Math.floor(Math.random() * 100000);

            document.getElementById("lobby").style.display = "none";
            canvas.style.display = "block";
            document.getElementById("scoreBoard").style.display = "block";

            // Futter generieren (falls noch keins da ist)
            database.ref(roomId + "/food").once("value", snapshot => {
                if(!snapshot.val()) {
                    let initialFood = {};
                    for(let i=0; i<40; i++) {
                        let fId = "f_" + i;
                        initialFood[fId] = { x: Math.random() * 780 + 10, y: Math.random() * 580 + 10, color: 'hsl(' + Math.random() * 360 + ', 100%, 60%)' };
                    }
                    database.ref(roomId + "/food").set(initialFood);
                }
            });

            // Live-Updates
            database.ref(roomId + "/snakes").on("value", snapshot => { snakes = snapshot.val() || {}; });
            database.ref(roomId + "/food").on("value", snapshot => { foods = snapshot.val() || {}; });

            // Spiel-Loop starten
            setInterval(gameLoop, 1000 / 45);
        }

        // Steuerung für das iPad (Wischen steuert die Richtung)
        canvas.addEventListener("touchmove", (e) => {
            e.preventDefault();
            if(!alive) return;
            const rect = canvas.getBoundingClientRect();
            let touchX = e.touches[0].clientX - rect.left;
            let touchY = e.touches[0].clientY - rect.top;
            
            // Winkel berechnen, in den die Schlange guckt
            angle = Math.atan2(touchY - myY, touchX - myX);
        }, {passive: false});

        function gameLoop() {
            if (alive) {
                // Kopf bewegen
                myX += Math.cos(angle) * speed;
                myY += Math.sin(angle) * speed;

                // Spielfeldrand-Kollision (Teleport zur anderen Seite wie bei Pacman)
                if(myX < 0) myX = canvas.width; if(myX > canvas.width) myX = 0;
                if(myY < 0) myY = canvas.height; if(myY > canvas.height) myY = 0;

                // Schweif updaten (Wir merken uns die alten Positionen des Kopfes)
                myTail.unshift({x: myX, y: myY});
                if(myTail.length > myLength * 3) {
                    myTail.pop();
                }

                // Daten hochladen
                database.ref(roomId + "/snakes/" + playerId).set({
                    id: playerId,
                    x: myX, y: myY,
                    tail: myTail,
                    length: myLength,
                    color: 'hsl(' + (parseInt(playerId.replace("snake_", "")) % 360) + ', 100%, 50%)',
                    alive: true
                });

                // Futter fressen prüfen
                Object.keys(foods).forEach(fId => {
                    let f = foods[fId];
                    let dist = Math.sqrt((myX - f.x)**2 + (myY - f.y)**2);
                    if(dist < 15) { // Gefressen!
                        myLength += 1;
                        // Neues Futter an zufälliger Stelle spawnen
                        database.ref(roomId + "/food/" + fId).set({
                            x: Math.random() * 780 + 10,
                            y: Math.random() * 580 + 10,
                            color: 'hsl(' + Math.random() * 360 + ', 100%, 60%)'
                        });
                    }
                });

                // Crash in andere Schlangen prüfen
                Object.keys(snakes).forEach(sId => {
                    if(sId !== playerId && snakes[sId].alive) {
                        let other = snakes[sId];
                        let otherTail = other.tail || [];
                        
                        // Wir prüfen ab dem 5. Schweif-Glied, um Fehl-Crashes zu vermeiden
                        for(let i = 5; i < otherTail.length; i += 2) {
                            let segment = otherTail[i];
                            let distToBody = Math.sqrt((myX - segment.x)**2 + (myY - segment.y)**2);
                            if(distToBody < 12) {
                                // BUMM! Du bist gecrasht und tot.
                                alive = false;
                                database.ref(roomId + "/snakes/" + playerId).update({ alive: false });
                                alert("💥 GECRASHT! Deine Schlange ist explodiert! Lade die Seite neu für eine neue Runde.");
                            }
                        }
                    }
                });
            }

            drawArena();
        }

        function drawArena() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Raster-Hintergrund zeichnen für besseren Speed-Effekt
            ctx.strokeStyle = "#1f2937"; ctx.lineWidth = 1;
            for(let x=0; x<canvas.width; x+=40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
            for(let y=0; y<canvas.height; y+=40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

            // Futter zeichnen
            Object.keys(foods).forEach(fId => {
                let f = foods[fId];
                ctx.beginPath();
                ctx.arc(f.x, f.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = f.color;
                ctx.shadowBlur = 10; ctx.shadowColor = f.color; // Leuchteffekt
                ctx.fill();
                ctx.closePath();
            });
            ctx.shadowBlur = 0; // Leuchten für Schlangen ausmachen (spart Performance)

            // Alle Schlangen zeichnen
            let list = [];
            Object.keys(snakes).forEach(sId => {
                let s = snakes[sId];
                if(!s.alive) return;

                list.push({id: s.id, score: s.length});
                let t = s.tail || [];
                
                // Schweif von hinten nach vorne zeichnen
                for(let i = t.length - 1; i >= 0; i -= 2) {
                    ctx.beginPath();
                    ctx.arc(t[i].x, t[i].y, 8 + (i/t.length)*2, 0, Math.PI * 2);
                    ctx.fillStyle = s.color;
                    ctx.fill();
                    ctx.closePath();
                }

                // Kopf zeichnen
                ctx.beginPath();
                ctx.arc(s.x, s.y, 11, 0, Math.PI * 2);
                ctx.fillStyle = "white";
                ctx.fill();
                ctx.closePath();
            });

            // Leaderboard updaten
            list.sort((a,b) => b.score - a.score);
            let html = "";
            list.slice(0, 5).forEach((player, index) => {
                html += `<div>${index+1}. ${player.id === playerId ? "<b>DU</b>" : "Gegner"} (${player.score})</div>`;
            });
            document.getElementById("leaderboardList").innerHTML = html;
        }

        window.onbeforeunload = function() {
            if(roomId && playerId) database.ref(roomId + "/snakes/" + playerId).remove();
        };
    </script>
</body>
</html>
