/* ------------------------------------------------------------------
   PROCEDURAL CITY BLOCK
   Buildings and road layout are built locally with Three.js.
   No additional city assets or downloads are required.
------------------------------------------------------------------- */
function buildCity() {
  const city = new THREE.Group();
  city.name = "City Buildings";
  scene.add(city);

  const roadMat = new THREE.MeshStandardMaterial({ color: 0x343a40, roughness: 0.96 });
  const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0x969b9e, roughness: 0.94 });
  const curbMat = new THREE.MeshStandardMaterial({ color: 0xb5b8b9, roughness: 0.9 });
  const lineMat = new THREE.MeshStandardMaterial({ color: 0xd9d2ad, roughness: 0.85 });
  const frameMat = new THREE.MeshStandardMaterial({ color: 0x555d64, roughness: 0.78, metalness: 0.12 });
  const glassMat = new THREE.MeshStandardMaterial({
    color: 0x66879a, roughness: 0.25, metalness: 0.18,
    envMapIntensity: 0.65
  });

  // A deterministic variation keeps the city stable between reloads.
  let seed = 18473;
  const rand = () => {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  };

  const streetPositions = [-60, -36, -12, 12, 36, 60];
  const roadLength = 190;

  // Asphalt grid with raised sidewalks, leaving clear paths between plots.
  for (const x of streetPositions) {
    const road = new THREE.Mesh(new THREE.BoxGeometry(8.6, 0.08, roadLength), roadMat);
    road.position.set(x, 0.015, 0);
    road.receiveShadow = true;
    city.add(road);

    for (const side of [-1, 1]) {
      const walk = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.13, roadLength), sidewalkMat);
      walk.position.set(x + side * 5.0, 0.055, 0);
      walk.receiveShadow = true;
      city.add(walk);
      const curb = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.2, roadLength), curbMat);
      curb.position.set(x + side * 4.35, 0.12, 0);
      curb.receiveShadow = true;
      city.add(curb);
    }
  }

  for (const z of streetPositions) {
    const road = new THREE.Mesh(new THREE.BoxGeometry(roadLength, 0.08, 8.6), roadMat);
    road.position.set(0, 0.016, z);
    road.receiveShadow = true;
    city.add(road);

    for (const side of [-1, 1]) {
      const walk = new THREE.Mesh(new THREE.BoxGeometry(roadLength, 0.13, 1.25), sidewalkMat);
      walk.position.set(0, 0.055, z + side * 5.0);
      walk.receiveShadow = true;
      city.add(walk);
      const curb = new THREE.Mesh(new THREE.BoxGeometry(roadLength, 0.2, 0.16), curbMat);
      curb.position.set(0, 0.12, z + side * 4.35);
      curb.receiveShadow = true;
      city.add(curb);
    }
  }

  // Dashed lane markings, instanced so the road detail stays lightweight.
  const dashGeometry = new THREE.BoxGeometry(0.16, 0.018, 2.5);
  const dashCount = streetPositions.length * 2 * 22;
  const dashes = new THREE.InstancedMesh(dashGeometry, lineMat, dashCount);
  const dummy = new THREE.Object3D();
  let dashIndex = 0;
  for (const x of streetPositions) {
    for (let z = -84; z <= 84; z += 8) {
      dummy.position.set(x, 0.064, z);
      dummy.rotation.set(0, 0, 0);
      dummy.updateMatrix();
      dashes.setMatrixAt(dashIndex++, dummy.matrix);
    }
  }
  for (const z of streetPositions) {
    for (let x = -84; x <= 84; x += 8) {
      dummy.position.set(x, 0.065, z);
      dummy.rotation.set(0, Math.PI / 2, 0);
      dummy.updateMatrix();
      dashes.setMatrixAt(dashIndex++, dummy.matrix);
    }
  }
  dashes.count = dashIndex;
  dashes.instanceMatrix.needsUpdate = true;
  city.add(dashes);

  // Instanced window frames and blue-grey glass across all building facades.
  const frameGeometry = new THREE.BoxGeometry(1.08, 1.58, 0.14);
  const glassGeometry = new THREE.BoxGeometry(0.88, 1.34, 0.08);
  const maxWindows = 9000;
  const frames = new THREE.InstancedMesh(frameGeometry, frameMat, maxWindows);
  const panes = new THREE.InstancedMesh(glassGeometry, glassMat, maxWindows);
  frames.castShadow = false;
  frames.receiveShadow = false;
  panes.castShadow = false;
  panes.receiveShadow = false;
  const windowDummy = new THREE.Object3D();
  let windowIndex = 0;

  const buildingPalette = [
    0xaeb4b8, 0xc0bdb5, 0x8d9aa1, 0x9da5a8,
    0xb6b2aa, 0x7e898f, 0xc5c3bd, 0x8f9699
  ].map(color => new THREE.MeshStandardMaterial({ color, roughness: 0.9 }));

  const plotPositions = [-72, -48, -24, 24, 48, 72];

  for (const x of plotPositions) {
    for (const z of plotPositions) {
      // Keep the four innermost plots open for a broad central intersection.
      if (Math.abs(x) === 24 && Math.abs(z) === 24) continue;

      const floors = 5 + Math.floor(rand() * 10);
      const floorHeight = 2.75;
      const height = floors * floorHeight;
      const width = 10.8 + rand() * 1.45;
      const depth = 10.8 + rand() * 1.45;
      const bodyMat = buildingPalette[Math.floor(rand() * buildingPalette.length)];

      const building = new THREE.Group();
      building.position.set(x + (rand() - 0.5) * 1.2, 0, z + (rand() - 0.5) * 1.2);
      building.name = "City Building";
      city.add(building);

      const body = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), bodyMat);
      body.position.y = height / 2;
      body.castShadow = true;
      body.receiveShadow = true;
      building.add(body);

      const base = new THREE.Mesh(
        new THREE.BoxGeometry(width + 0.25, 0.45, depth + 0.25),
        new THREE.MeshStandardMaterial({ color: 0x687177, roughness: 0.95 })
      );
      base.position.y = 0.225;
      base.castShadow = true;
      base.receiveShadow = true;
      building.add(base);

      // Narrow roof edge and a few rooftop service structures.
      const parapetMat = new THREE.MeshStandardMaterial({ color: 0x747d82, roughness: 0.9 });
      const parapetHeight = 0.34;
      const parapets = [
        [width + 0.12, parapetHeight, 0.18, 0, height + parapetHeight / 2, depth / 2],
        [width + 0.12, parapetHeight, 0.18, 0, height + parapetHeight / 2, -depth / 2],
        [0.18, parapetHeight, depth, width / 2, height + parapetHeight / 2, 0],
        [0.18, parapetHeight, depth, -width / 2, height + parapetHeight / 2, 0]
      ];
      for (const [sx, sy, sz, px, py, pz] of parapets) {
        const rail = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), parapetMat);
        rail.position.set(px, py, pz);
        building.add(rail);
      }

      if (rand() > 0.35) {
        const rooftop = new THREE.Mesh(
          new THREE.BoxGeometry(width * (0.28 + rand() * 0.12), 1.15, depth * 0.3),
          parapetMat
        );
        rooftop.position.set((rand() - 0.5) * 1.2, height + 0.72, (rand() - 0.5) * 1.0);
        rooftop.castShadow = true;
        rooftop.receiveShadow = true;
        building.add(rooftop);
      }

      // Four-sided window grid. Frames and glass are stored in shared instances.
      const addWindow = (px, py, pz, rotationY) => {
        if (windowIndex >= maxWindows) return;
        windowDummy.position.set(building.position.x + px, py, building.position.z + pz);
        windowDummy.rotation.set(0, rotationY, 0);
        windowDummy.scale.set(1, 1, 1);
        windowDummy.updateMatrix();
        frames.setMatrixAt(windowIndex, windowDummy.matrix);
        panes.setMatrixAt(windowIndex, windowDummy.matrix);
        windowIndex++;
      };

      const makeFacade = (faceWidth, faceDepth, side) => {
        const columns = Math.max(2, Math.floor(faceWidth / 2.4));
        for (let row = 0; row < floors; row++) {
          const py = 1.48 + row * floorHeight;
          for (let col = 0; col < columns; col++) {
            const spread = (col - (columns - 1) / 2) * (faceWidth / (columns + 0.2));
            if (side === "front") addWindow(spread, py, depth / 2 + 0.08, 0);
            if (side === "back") addWindow(spread, py, -depth / 2 - 0.08, Math.PI);
            if (side === "right") addWindow(width / 2 + 0.08, py, spread, Math.PI / 2);
            if (side === "left") addWindow(-width / 2 - 0.08, py, spread, -Math.PI / 2);
          }
        }
      };
      makeFacade(width, depth, "front");
      makeFacade(width, depth, "back");
      makeFacade(depth, width, "right");
      makeFacade(depth, width, "left");

      // A few slim vertical facade piers create a more finished city silhouette.
      const pierMat = new THREE.MeshStandardMaterial({ color: 0x727e83, roughness: 0.88 });
      for (const side of [-1, 1]) {
        const pier = new THREE.Mesh(new THREE.BoxGeometry(0.12, height, 0.16), pierMat);
        pier.position.set(side * (width / 2 - 0.12), height / 2, depth / 2 + 0.02);
        building.add(pier);
      }
    }
  }

  frames.count = windowIndex;
  panes.count = windowIndex;
  frames.instanceMatrix.needsUpdate = true;
  panes.instanceMatrix.needsUpdate = true;
  city.add(frames);
  city.add(panes);

  // Simple paved plaza where the player spawns, clear of tall buildings.
  const plaza = new THREE.Mesh(
    new THREE.BoxGeometry(20, 0.045, 20),
    new THREE.MeshStandardMaterial({ color: 0x8c9295, roughness: 0.92 })
  );
  plaza.position.set(0, 0.012, 0);
  plaza.receiveShadow = true;
  city.add(plaza);

  console.info("City generated:", plotPositions.length * plotPositions.length - 4, "building plots");
}


buildCity();

const player = new THREE.Group();
scene.add(player);

const groundShadow = new THREE.Mesh(
  new THREE.CircleGeometry(0.52,48),
  new THREE.MeshBasicMaterial({color:0x20252b, transparent:true, opacity:0.15, depthWrite:false})
);
groundShadow.rotation.x = -Math.PI/2;
groundShadow.position.y = 0.004;
player.add(groundShadow);

const clock = new THREE.Clock();
const keys = Object.create(null);
const velocity = new THREE.Vector3();
const moveDir = new THREE.Vector3();
const forward = new THREE.Vector3();
const right = new THREE.Vector3();
const desiredVelocity = new THREE.Vector3();

let character = null;
let mixer = null;
let walkAction = null;
let runAction = null;
let activeAction = null;
let cameraYaw = 0;
let cameraPitch = 0.16;
let cameraDistance = 5.6;
let dragging = false;
let lastPointerX = 0;
let lastPointerY = 0;
let characterReady = false;

function showLoadError(message) {
  spinner.style.display = "none";
  loadTitle.textContent = "MODELL KONNTE NICHT GELADEN WERDEN";
  loadCopy.textContent = "Die lokale 3D-Datei ist noch nicht verfügbar.";
  errorEl.style.display = "block";
  errorEl.textContent = message + " Prüfe in GitHub unter Actions, ob der Grab3D-Download erfolgreich war.";
  statusEl.textContent = "MODELL NICHT GELADEN";
}

function styleModelMaterial(material, meshName) {
  const mat = material.clone();
  const label = ((mat.name || "") + " " + (meshName || "")).toLowerCase();

  if (/hair|brow/.test(label)) {
    mat.color.set("#2b1b13");
    if ("roughness" in mat) mat.roughness = 0.84;
    return mat;
  }

  if (/skin|face|head|hand|finger|ear|neck/.test(label)) {
    // Keep the model's high-resolution skin maps; use a fair, warm multiplier.
    mat.color.set("#fff0e7");
    if ("roughness" in mat) mat.roughness = 0.78;
    if ("metalness" in mat) mat.metalness = 0;
    return mat;
  }

  if (/shirt|tee|top|short|cloth|fabric|hood|sweat|pant|trouser|jean|shoe|sneaker/.test(label)) {
    mat.color.set("#17181b");
    if ("roughness" in mat) mat.roughness = 0.92;
    if ("metalness" in mat) mat.metalness = 0;
  }
  return mat;
}

function switchAction(nextAction) {
  if (!nextAction || activeAction === nextAction) return;
  if (activeAction) activeAction.fadeOut(0.18);
  nextAction.reset().fadeIn(0.18).play();
  activeAction = nextAction;
}

function prepareCharacter(gltf) {
  character = gltf.scene;
  character.traverse((obj) => {
    if (!obj.isMesh) return;
    obj.castShadow = true;
    obj.receiveShadow = true;
    if (Array.isArray(obj.material)) {
      obj.material = obj.material.map((mat) => styleModelMaterial(mat, obj.name));
    } else if (obj.material) {
      obj.material = styleModelMaterial(obj.material, obj.name);
    }
  });

  const bounds = new THREE.Box3().setFromObject(character);
  const height = bounds.max.y - bounds.min.y;
  if (!Number.isFinite(height) || height < 0.5) {
    throw new Error("Das geladene Modell hat keine gültige Körperhöhe.");
  }

  character.scale.setScalar(1.8 / height);
  const scaledBounds = new THREE.Box3().setFromObject(character);
  character.position.y -= scaledBounds.min.y;
  character.updateMatrixWorld(true);
  player.add(character);

  mixer = new THREE.AnimationMixer(character);
  const clips = gltf.animations || [];
  const walkClip = clips.find((clip) => /walk/i.test(clip.name));
  const runClip = clips.find((clip) => /run/i.test(clip.name));
  if (walkClip) walkAction = mixer.clipAction(walkClip);
  if (runClip) runAction = mixer.clipAction(runClip);

  characterReady = true;
  statusEl.textContent = "BEREIT · 1,80 M";
  statusEl.classList.add("ready");
  loadTitle.textContent = "BEREIT";
  loadCopy.textContent = "Echtes Grab3D-Modell geladen · WASD zum Laufen.";
  setTimeout(() => loadingEl.classList.add("hidden"), 450);
}

function loadCharacter() {
  const loader = new GLTFLoader();
  loader.setKTX2Loader(ktx2Loader);
  loader.setMeshoptDecoder(MeshoptDecoder);
  const modelUrl = "./assets/man-base-character-rigged.glb";

  loadCopy.textContent = "Lokales Grab3D-Modell wird geladen …";
  loader.load(
    modelUrl,
    (gltf) => {
      try {
        prepareCharacter(gltf);
      } catch (error) {
        console.error("Character setup failed:", error);
        showLoadError(error.message || "Das Modell konnte nicht vorbereitet werden.");
      }
    },
    (event) => {
      if (event.total > 0) {
        const percent = Math.round(event.loaded / event.total * 100);
        loadCopy.textContent = "Grab3D-Modell wird geladen · " + percent + "%";
      }
    },
    (error) => {
      console.error("Local Grab3D GLB load failed:", error);
      const detail = error && error.message ? " (" + error.message + ")" : "";
      showLoadError("Lokale Grab3D-Datei konnte nicht gelesen werden" + detail + ".");
    }
  );
}

function updateMovement(delta) {
  if (!characterReady) return;

  const forwardInput = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  const sideInput = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);

  forward.set(Math.sin(cameraYaw), 0, Math.cos(cameraYaw));
  right.set(Math.cos(cameraYaw), 0, -Math.sin(cameraYaw));
  desiredVelocity.set(0,0,0);
  desiredVelocity.addScaledVector(forward, forwardInput);
  desiredVelocity.addScaledVector(right, sideInput);

  const isMoving = desiredVelocity.lengthSq() > 0.001;
  if (isMoving) {
    desiredVelocity.normalize();
    desiredVelocity.multiplyScalar(2.7);
    moveDir.copy(desiredVelocity).normalize();

    const targetRotation = Math.atan2(moveDir.x, moveDir.z);
    let rotationDifference = targetRotation - player.rotation.y;
    rotationDifference = Math.atan2(Math.sin(rotationDifference), Math.cos(rotationDifference));
    player.rotation.y += rotationDifference * (1 - Math.exp(-13 * delta));
  }

  const blend = 1 - Math.exp(-10 * delta);
  velocity.lerp(desiredVelocity, blend);
  player.position.x += velocity.x * delta;
  player.position.z += velocity.z * delta;

  if (isMoving) {
    if (walkAction) switchAction(walkAction);
    else if (runAction) switchAction(runAction);
  } else if (activeAction) {
    activeAction.fadeOut(0.18);
    activeAction = null;
  }
}

function updateCamera(delta) {
  const target = new THREE.Vector3(player.position.x, player.position.y + 1.16, player.position.z);
  const horizontalDistance = cameraDistance * Math.cos(cameraPitch);
  const offset = new THREE.Vector3(
    -Math.sin(cameraYaw) * horizontalDistance,
    cameraDistance * Math.sin(cameraPitch) + 0.18,
    -Math.cos(cameraYaw) * horizontalDistance
  );
  const wantedPosition = target.clone().add(offset);
  camera.position.lerp(wantedPosition, 1 - Math.exp(-7.5 * delta));
  camera.lookAt(target);
}

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.04);
  updateMovement(delta);
  if (mixer) mixer.update(delta);
  updateCamera(delta);
  renderer.render(scene,camera);
}
animate();
loadCharacter();

window.addEventListener("keydown", (event) => {
  if (["KeyW","KeyA","KeyS","KeyD","ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(event.code)) event.preventDefault();
  keys[event.code] = true;
});
window.addEventListener("keyup", (event) => { keys[event.code] = false; });
window.addEventListener("blur", () => { Object.keys(keys).forEach((key) => keys[key] = false); });

renderer.domElement.addEventListener("pointerdown", (event) => {
  if (event.button !== 0) return;
  dragging = true;
  lastPointerX = event.clientX;
  lastPointerY = event.clientY;
  renderer.domElement.setPointerCapture(event.pointerId);
});
renderer.domElement.addEventListener("pointermove", (event) => {
  if (!dragging) return;
  const dx = event.clientX - lastPointerX;
  const dy = event.clientY - lastPointerY;
  lastPointerX = event.clientX;
  lastPointerY = event.clientY;
  cameraYaw -= dx * 0.005;
  cameraPitch = THREE.MathUtils.clamp(cameraPitch + dy * 0.003, -0.08, 0.62);
});
renderer.domElement.addEventListener("pointerup", () => { dragging = false; });
renderer.domElement.addEventListener("pointercancel", () => { dragging = false; });
renderer.domElement.addEventListener("wheel", (event) => {
  cameraDistance = THREE.MathUtils.clamp(cameraDistance + event.deltaY * 0.004, 3.2, 9);
}, {passive:true});

document.getElementById("camera-reset").addEventListener("click", () => {
  cameraYaw = 0;
  cameraPitch = 0.16;
  cameraDistance = 5.6;
});

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.8));
});
</script>
</body>
