<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash Royale 3D - iPad & WASD</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: Arial, sans-serif;
            /* Verhindert das Markieren von Text oder Scrollen beim Wischen auf dem iPad */
            touch-action: none; 
            user-select: none;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="info">
        <b>W, A, S, D</b> zum Laufen<br>
        <b>Display wischen</b> zum Umsehen
    </div>

    <!-- Three.js Basis -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        // 1. Szene & Renderer einrichten
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 20, 150);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // 2. Kamera (Spieler) einrichten
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 10); // Start-Position in der Arena
        camera.rotation.order = 'YXZ'; // Wichtig für korrekte Drehung
        scene.add(camera);

        // 3. Licht
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
        directionalLight.position.set(20, 30, 20);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const loader = new THREE.GLTFLoader();

        // 4. ARENA LADEN
        loader.load('enviroment_clash_royal 3.glb', function (gltf) {
            const arena = gltf.scene;
            arena.position.set(0, 0, 0);
            arena.scale.set(4, 4, 4); 
            scene.add(arena);
        });

        // 5. HOG RIDER LADEN (Ich-Perspektive)
        let hogRider = null;
        loader.load('hog_rider_adventure.glb', function (gltf) {
            hogRider = gltf.scene;
            hogRider.scale.set(0.2, 0.2, 0.2); 
            
            // Kamera anheften (Waffe/Kopf vor der Linse)
            hogRider.position.set(0, -1.2, -1.0); 
            hogRider.rotation.y = Math.PI;

            camera.add(hogRider);
        });

        // 6. EIGENE KAMERA-STEUERUNG FÜR IPAD (Wischen)
        let isDragging = false;
        let previousTouch = { x: 0, y: 0 };
        let yaw = 0;   // Links/Rechts drehen
        let pitch = 0; // Oben/Unten gucken

        document.addEventListener('pointerdown', (e) => {
            isDragging = true;
            previousTouch.x = e.clientX;
            previousTouch.y = e.clientY;
        });

        document.addEventListener('pointermove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - previousTouch.x;
                const deltaY = e.clientY - previousTouch.y;

                // Empfindlichkeit beim Wischen
                yaw -= deltaX * 0.005;
                pitch -= deltaY * 0.005;

                // Kamera darf sich nicht überschlagen (Begrenzung oben/unten)
                pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));

                camera.rotation.y = yaw;
                camera.rotation.x = pitch;

                previousTouch.x = e.clientX;
                previousTouch.y = e.clientY;
            }
        });

        document.addEventListener('pointerup', () => {
            isDragging = false;
        });

        // 7. BEWEGUNG (WASD Tastatur)
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        const moveSpeed = 0.25;

        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W') moveForward = true;
            if (e.key === 'a' || e.key === 'A') moveLeft = true;
            if (e.key === 's' || e.key === 'S') moveBackward = true;
            if (e.key === 'd' || e.key === 'D') moveRight = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W') moveForward = false;
            if (e.key === 'a' || e.key === 'A') moveLeft = false;
            if (e.key === 's' || e.key === 'S') moveBackward = false;
            if (e.key === 'd' || e.key === 'D') moveRight = false;
        });

        // 8. Fenstergröße anpassen
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 9. GAME LOOP
        function animate() {
            requestAnimationFrame(animate);

            // Bewegung relativ zur Blickrichtung berechnen
            if (moveForward || moveBackward || moveLeft || moveRight) {
                const moveX = (moveRight ? 1 : 0) - (moveLeft ? 1 : 0);
                const moveZ = (moveBackward ? 1 : 0) - (moveForward ? 1 : 0);

                // Hilfsvektor erstellen, um in Blickrichtung zu laufen
                const direction = new THREE.Vector3(moveX, 0, moveZ);
                const rotation = new THREE.Euler(0, camera.rotation.y, 0, 'YXZ');
                
                direction.applyEuler(rotation);
                
                // Normalisieren, damit diagonal gehen nicht schneller ist
                if (direction.length() > 0) {
                    direction.normalize().multiplyScalar(moveSpeed);
                    camera.position.add(direction);
                }
            }

            // Stelle sicher, dass die Spieler-Höhe konstant bleibt (kein Fliegen)
            camera.position.y = 2;

            renderer.render(scene, camera);
        }
        
        animate();
    </script>
</body>
</html>
