<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tesla Roadster Runner</title>
    <!-- Tailwind CSS for UI controls and layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            font-family: 'Press Start 2P', monospace, sans-serif;
            background-color: #f7f7f7;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .pixel-font {
            font-family: 'Press Start 2P', monospace;
        }

        /* Canvas Smooth Pixel Scaling */
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen bg-neutral-100 text-neutral-700 p-4">

    <!-- Container for Game Frame -->
    <div class="relative w-full max-w-3xl flex flex-col items-center">
        <!-- Title & Subtitle -->
        <div class="w-full flex justify-between items-center mb-2 px-2 text-xs sm:text-sm text-neutral-500">
            <span class="font-bold tracking-widest text-neutral-800">TESLA ROADSTER RUNNER</span>
            <span id="sound-toggle" class="cursor-pointer hover:text-neutral-900 flex items-center gap-1">
                🔊 SOUND: ON
            </span>
        </div>

        <!-- Main Canvas Area -->
        <div class="relative w-full bg-white rounded-lg border-2 border-neutral-300 shadow-sm overflow-hidden">
            <canvas id="gameCanvas" width="800" height="300" class="w-full h-auto block"></canvas>
            
            <!-- Mobile Controls Overlay -->
            <div id="mobile-controls" class="absolute inset-0 flex sm:hidden opacity-0 active:opacity-10 pointer-events-auto">
                <div id="touch-jump" class="w-2/3 h-full bg-blue-500"></div>
                <div id="touch-duck" class="w-1/3 h-full bg-red-500"></div>
            </div>
        </div>

        <!-- Touch Controls Instructions / On-screen Buttons for Mobile -->
        <div class="w-full mt-4 flex justify-between items-center text-xs text-neutral-500 px-2 sm:hidden">
            <button id="btn-jump" class="bg-neutral-200 active:bg-neutral-300 text-neutral-800 py-3 px-6 rounded-lg font-bold border border-neutral-400">
                JUMP ⬆️
            </button>
            <button id="btn-duck" class="bg-neutral-200 active:bg-neutral-300 text-neutral-800 py-3 px-6 rounded-lg font-bold border border-neutral-400">
                DUCK ⬇️
            </button>
        </div>

        <!-- Desktop Controls Help -->
        <div class="hidden sm:flex justify-between w-full mt-3 text-[10px] text-neutral-400 px-2">
            <span>[LEERTASTE / PFEIL OBEN] Springen</span>
            <span>[PFEIL UNTEN] Ducken / Schneller fallen</span>
        </div>
    </div>

    <!-- Game Logic JavaScript -->
    <script>
        // --- Web Audio Synthesizer sound engine ---
        class SoundController {
            constructor() {
                this.enabled = true;
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playJump() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            playScore() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.08); // E5

                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.25);
            }

            playCrash() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.25);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.25);
            }
        }

        const sound = new SoundController();

        // --- Canvas & Constants ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 300;
        const GROUND_Y = 240;

        // --- Sound Toggle Setup ---
        const soundToggleBtn = document.getElementById('sound-toggle');
        soundToggleBtn.addEventListener('click', () => {
            sound.enabled = !sound.enabled;
            soundToggleBtn.textContent = sound.enabled ? '🔊 SOUND: ON' : '🔇 SOUND: OFF';
        });

        // --- Game State Variables ---
        let gameSpeed = 6;
        const INITIAL_SPEED = 6;
        const MAX_SPEED = 14;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('tesla_runner_highscore') || '0', 10);
        let gameOver = false;
        let gameStarted = false;
        let frameCount = 0;
        let nextObstacleTimer = 0;

        // --- Keys State ---
        const keys = {
            jump: false,
            duck: false
        };

        // --- Particle System for Dust & Ground Specks ---
        let groundSpecks = [];
        for (let i = 0; i < 30; i++) {
            groundSpecks.push({
                x: Math.random() * CANVAS_WIDTH,
                y: GROUND_Y + Math.random() * (CANVAS_HEIGHT - GROUND_Y - 5),
                size: Math.random() * 3 + 1
            });
        }

        let dustParticles = [];
        function addDust(x, y) {
            dustParticles.push({
                x: x,
                y: y,
                vx: -gameSpeed * 0.4 + (Math.random() - 0.5),
                vy: (Math.random() - 0.8) * 1.5,
                size: Math.random() * 3 + 1,
                life: 1.0
            });
        }

        // --- Roadster Player Object ---
        const roadster = {
            x: 80,
            y: GROUND_Y - 26,
            width: 58,
            height: 26,
            normalHeight: 26,
            duckHeight: 16,
            vy: 0,
            gravity: 0.75,
            jumpStrength: -12.5,
            isGrounded: true,
            isDucking: false,
            wheelAngle: 0,

            reset() {
                this.y = GROUND_Y - this.normalHeight;
                this.height = this.normalHeight;
                this.vy = 0;
                this.isGrounded = true;
                this.isDucking = false;
                this.wheelAngle = 0;
            },

            jump() {
                if (this.isGrounded) {
                    this.vy = this.jumpStrength;
                    this.isGrounded = false;
                    sound.playJump();
                    // Spawn jump dust
                    for (let i = 0; i < 5; i++) {
                        addDust(this.x + 10, GROUND_Y);
                        addDust(this.x + 45, GROUND_Y);
                    }
                }
            },

            update() {
                // Duck logic
                if (keys.duck && this.isGrounded) {
                    if (!this.isDucking) {
                        this.isDucking = true;
                        this.height = this.duckHeight;
                        this.y = GROUND_Y - this.duckHeight;
                    }
                } else if (this.isDucking) {
                    this.isDucking = false;
                    this.height = this.normalHeight;
                    this.y = GROUND_Y - this.normalHeight;
                }

                // Fast drop when pressing duck in air
                if (!this.isGrounded && keys.duck) {
                    this.vy += 1.2;
                }

                // Apply gravity
                this.vy += this.gravity;
                this.y += this.vy;

                // Ground Collision
                const currentTargetY = GROUND_Y - this.height;
                if (this.y >= currentTargetY) {
                    this.y = currentTargetY;
                    this.vy = 0;
                    this.isGrounded = true;
                }

                // Rotate Wheels when driving
                if (this.isGrounded && !gameOver) {
                    this.wheelAngle += gameSpeed * 0.15;
                    // Wheels trail dust
                    if (frameCount % 4 === 0) {
                        addDust(this.x + 5, GROUND_Y - 2);
                    }
                }
            },

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                const color = '#535353';

                if (this.isDucking) {
                    // Sleek Ducking Roadster (Lower Profile Convertible Silhouette)
                    ctx.fillStyle = color;
                    // Body
                    ctx.fillRect(0, 6, 58, 10);
                    // Low Windshield
                    ctx.fillRect(15, 2, 20, 4);
                    // Wheels
                    this.drawWheel(12, 16, 5);
                    this.drawWheel(46, 16, 5);
                    // Headlight
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(54, 7, 4, 3);
                } else {
                    // Classic Tesla Roadster Vector / Pixel Silhouette
                    ctx.fillStyle = color;

                    // Main Body
                    ctx.beginPath();
                    // Nose
                    ctx.moveTo(58, 20);
                    ctx.lineTo(50, 12);
                    // Hood
                    ctx.lineTo(38, 10);
                    // Windshield
                    ctx.lineTo(26, 2);
                    // Roof / Cabin line
                    ctx.lineTo(16, 2);
                    // Rear Deck
                    ctx.lineTo(8, 10);
                    ctx.lineTo(0, 12);
                    // Back bumper
                    ctx.lineTo(0, 22);
                    ctx.lineTo(58, 22);
                    ctx.closePath();
                    ctx.fill();

                    // Side window cutout (Sleek Roadster Look)
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.moveTo(25, 4);
                    ctx.lineTo(35, 11);
                    ctx.lineTo(17, 11);
                    ctx.lineTo(17, 4);
                    ctx.closePath();
                    ctx.fill();

                    // Headlights (White pixel glow)
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(53, 14, 5, 3);

                    // Wheels
                    this.drawWheel(14, 22, 6);
                    this.drawWheel(45, 22, 6);
                }

                ctx.restore();
            },

            drawWheel(cx, cy, radius) {
                ctx.save();
                ctx.translate(cx, cy);

                // Outer Tire
                ctx.fillStyle = '#333333';
                ctx.beginPath();
                ctx.arc(0, 0, radius, 0, Math.PI * 2);
                ctx.fill();

                // Inner Rim / Spokes
                ctx.rotate(this.wheelAngle);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(-radius + 2, 0);
                ctx.lineTo(radius - 2, 0);
                ctx.moveTo(0, -radius + 2);
                ctx.lineTo(0, radius - 2);
                ctx.stroke();

                ctx.restore();
            }
        };

        // --- Obstacles Class & Definitions ---
        class Obstacle {
            constructor() {
                this.type = Math.random() < 0.25 && score > 200 ? 'drone' : 'ground';
                this.x = CANVAS_WIDTH + 20;
                
                if (this.type === 'ground') {
                    // Random subtype: Charging Station, Gas Pump, Road Hazard
                    const subType = Math.floor(Math.random() * 3);
                    if (subType === 0) {
                        // Supercharger Pylon
                        this.width = 20;
                        this.height = 42;
                        this.subType = 'supercharger';
                    } else if (subType === 1) {
                        // Petrol / Gas Pump (Retro Dino Cactus equivalent)
                        this.width = 24;
                        this.height = 36;
                        this.subType = 'gaspump';
                    } else {
                        // Traffic Cones / Barrier
                        this.width = 32;
                        this.height = 24;
                        this.subType = 'barrier';
                    }
                    this.y = GROUND_Y - this.height;
                } else {
                    // Flying Drone / Bird obstacle
                    this.width = 30;
                    this.height = 18;
                    this.subType = 'drone';
                    // Hover heights (requires ducking or precise jump)
                    const heights = [GROUND_Y - 55, GROUND_Y - 35, GROUND_Y - 70];
                    this.y = heights[Math.floor(Math.random() * heights.length)];
                    this.wingAnim = 0;
                }
            }

            update() {
                this.x -= gameSpeed;
                if (this.type === 'drone') {
                    this.wingAnim += 0.2;
                }
            }

            draw() {
                ctx.fillStyle = '#535353';
                ctx.strokeStyle = '#535353';
                ctx.lineWidth = 2;

                if (this.subType === 'supercharger') {
                    // Tesla Supercharger Silhouette
                    // Main frame
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                    // Inner cutout
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(this.x + 5, this.y + 8, this.width - 10, this.height - 18);
                    // Red/Grey Top Accent
                    ctx.fillStyle = '#535353';
                    ctx.fillRect(this.x + 6, this.y + 12, 8, 3);
                } else if (this.subType === 'gaspump') {
                    // Classic Gas Pump
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                    // Hose nozzle on side
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y + 10);
                    ctx.lineTo(this.x - 4, this.y + 16);
                    ctx.lineTo(this.x - 4, this.y + 24);
                    ctx.stroke();
                    // Screen cutout
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(this.x + 4, this.y + 6, 16, 10);
                } else if (this.subType === 'barrier') {
                    // Construction Road Barrier
                    ctx.fillRect(this.x + 2, this.y, 5, this.height);
                    ctx.fillRect(this.x + this.width - 7, this.y, 5, this.height);
                    // Horizontal Slats
                    ctx.fillRect(this.x, this.y + 4, this.width, 6);
                    ctx.fillRect(this.x, this.y + 14, this.width, 6);
                } else if (this.subType === 'drone') {
                    // Flying Drone / Quadcopter
                    ctx.fillRect(this.x + 8, this.y + 6, 14, 6); // Core
                    // Rotors
                    const wingOffsetY = Math.sin(this.wingAnim) * 2;
                    ctx.fillRect(this.x, this.y + 2 + wingOffsetY, 10, 2);
                    ctx.fillRect(this.x + 20, this.y + 2 - wingOffsetY, 10, 2);
                    // Legs
                    ctx.fillRect(this.x + 6, this.y + 12, 2, 4);
                    ctx.fillRect(this.x + 22, this.y + 12, 2, 4);
                }
            }

            isColliding(player) {
                // Tuned bounding box padding for fair hitboxes
                const padding = 4;
                return (
                    player.x + padding < this.x + this.width &&
                    player.x + player.width - padding > this.x &&
                    player.y + padding < this.y + this.height &&
                    player.y + player.height - padding > this.y
                );
            }
        }

        let obstacles = [];

        // --- Controls Event Listeners ---
        function handleKeyDown(e) {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                if (!gameStarted || gameOver) {
                    restartGame();
                } else {
                    keys.jump = true;
                    roadster.jump();
                }
            }
            if (e.code === 'ArrowDown') {
                e.preventDefault();
                keys.duck = true;
            }
        }

        function handleKeyUp(e) {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                keys.jump = false;
            }
            if (e.code === 'ArrowDown') {
                keys.duck = false;
            }
        }

        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);

        // Touch & On-Screen Button Controls
        const btnJump = document.getElementById('btn-jump');
        const btnDuck = document.getElementById('btn-duck');

        const triggerJump = (e) => {
            if (e) e.preventDefault();
            if (!gameStarted || gameOver) {
                restartGame();
            } else {
                keys.jump = true;
                roadster.jump();
            }
        };

        const releaseJump = (e) => {
            if (e) e.preventDefault();
            keys.jump = false;
        };

        const triggerDuck = (e) => {
            if (e) e.preventDefault();
            keys.duck = true;
        };

        const releaseDuck = (e) => {
            if (e) e.preventDefault();
            keys.duck = false;
        };

        btnJump.addEventListener('touchstart', triggerJump);
        btnJump.addEventListener('touchend', releaseJump);
        btnJump.addEventListener('mousedown', triggerJump);
        btnJump.addEventListener('mouseup', releaseJump);

        btnDuck.addEventListener('touchstart', triggerDuck);
        btnDuck.addEventListener('touchend', releaseDuck);
        btnDuck.addEventListener('mousedown', triggerDuck);
        btnDuck.addEventListener('mouseup', releaseDuck);

        // Global Tap to Jump / Start
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            triggerJump();
        });

        canvas.addEventListener('mousedown', (e) => {
            if (gameOver || !gameStarted) {
                restartGame();
            }
        });

        // --- Restart & Reset Game ---
        function restartGame() {
            gameSpeed = INITIAL_SPEED;
            score = 0;
            gameOver = false;
            gameStarted = true;
            obstacles = [];
            dustParticles = [];
            nextObstacleTimer = 0;
            roadster.reset();
        }

        // --- Draw UI Utilities ---
        function drawScore() {
            ctx.fillStyle = '#535353';
            ctx.font = '14px "Press Start 2P", monospace';
            ctx.textAlign = 'right';

            const scoreStr = String(Math.floor(score)).padStart(5, '0');
            const highStr = String(highScore).padStart(5, '0');

            ctx.fillText(`HI ${highStr}  ${scoreStr}`, CANVAS_WIDTH - 20, 35);
        }

        function drawGameOver() {
            ctx.fillStyle = '#535353';
            ctx.textAlign = 'center';
            
            ctx.font = '20px "Press Start 2P", monospace';
            ctx.fillText('G A M E   O V E R', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 20);

            // Replay Icon & Subtext
            ctx.font = '10px "Press Start 2P", monospace';
            ctx.fillText('DRÜCKE LEERTASTE ODER TIPPEN ZUM STARTEN', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 20);

            // Draw simple replay circle arrow icon
            const rx = CANVAS_WIDTH / 2;
            const ry = CANVAS_HEIGHT / 2 + 50;
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#535353';
            ctx.beginPath();
            ctx.arc(rx, ry, 12, 0.2 * Math.PI, 1.7 * Math.PI);
            ctx.stroke();

            // Arrow head
            ctx.beginPath();
            ctx.moveTo(rx + 8, ry - 12);
            ctx.lineTo(rx + 14, ry - 7);
            ctx.lineTo(rx + 6, ry - 4);
            ctx.closePath();
            ctx.fillStyle = '#535353';
            ctx.fill();
        }

        function drawStartScreen() {
            ctx.fillStyle = '#535353';
            ctx.textAlign = 'center';
            ctx.font = '14px "Press Start 2P", monospace';
            ctx.fillText('DRÜCKE LEERTASTE ZUM STARTEN', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);
        }

        // --- Main Game Loop ---
        function gameLoop() {
            frameCount++;

            // Clear Canvas
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 1. Draw Ground Line
            ctx.strokeStyle = '#535353';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(CANVAS_WIDTH, GROUND_Y);
            ctx.stroke();

            // 2. Update & Draw Ground Specks
            ctx.fillStyle = '#777777';
            groundSpecks.forEach(speck => {
                if (gameStarted && !gameOver) {
                    speck.x -= gameSpeed;
                    if (speck.x < 0) {
                        speck.x = CANVAS_WIDTH + Math.random() * 20;
                        speck.y = GROUND_Y + Math.random() * (CANVAS_HEIGHT - GROUND_Y - 5);
                    }
                }
                ctx.fillRect(speck.x, speck.y, speck.size, 1);
            });

            // 3. Update & Draw Dust Particles
            for (let i = dustParticles.length - 1; i >= 0; i--) {
                const p = dustParticles[i];
                if (gameStarted && !gameOver) {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.04;
                }
                if (p.life <= 0) {
                    dustParticles.splice(i, 1);
                    continue;
                }
                ctx.fillStyle = `rgba(150, 150, 150, ${p.life})`;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            }

            if (gameStarted && !gameOver) {
                // Increase speed gradually
                if (gameSpeed < MAX_SPEED) {
                    gameSpeed += 0.0015;
                }

                // Increment score
                const oldScore = Math.floor(score);
                score += 0.15 * (gameSpeed / INITIAL_SPEED);
                const newScore = Math.floor(score);

                // Play milestone sound every 100 points
                if (newScore > 0 && newScore % 100 === 0 && Math.floor(oldScore) !== newScore) {
                    sound.playScore();
                }

                if (score > highScore) {
                    highScore = Math.floor(score);
                    localStorage.setItem('tesla_runner_highscore', highScore);
                }

                // Spawn Obstacles
                nextObstacleTimer--;
                if (nextObstacleTimer <= 0) {
                    obstacles.push(new Obstacle());
                    // Dynamic random gap based on current speed
                    const minGap = 50 + gameSpeed * 8;
                    const maxGap = 120 + gameSpeed * 12;
                    nextObstacleTimer = Math.floor(Math.random() * (maxGap - minGap) + minGap);
                }

                // Update Roadster
                roadster.update();

                // Update & Check Obstacles
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    obs.update();

                    if (obs.isColliding(roadster)) {
                        gameOver = true;
                        sound.playCrash();
                    }

                    if (obs.x + obs.width < 0) {
                        obstacles.splice(i, 1);
                    }
                }
            }

            // Draw Obstacles
            obstacles.forEach(obs => obs.draw());

            // Draw Roadster Player
            roadster.draw();

            // Draw Scoreboard
            drawScore();

            // Render State Overlays
            if (!gameStarted) {
                drawStartScreen();
            } else if (gameOver) {
                drawGameOver();
            }

            requestAnimationFrame(gameLoop);
        }

        // --- Start Loop on Window Load ---
        window.onload = function() {
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
