<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Halal Games Portal</title>
    <style>
        body { 
            background: radial-gradient(circle, #0f001a, #000000); 
            color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 20px;
        }

        h1 { font-size: 2.2em; text-shadow: 0 0 15px #8a2be2; margin-bottom: 30px; }

        .grid { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }

        .card { 
            background: rgba(255,255,255,0.05); border-radius: 20px; padding: 12px; 
            width: 140px; border: 1px solid rgba(138, 43, 226, 0.2); cursor: pointer;
            transition: 0.3s;
        }

        .card:active { transform: scale(0.9); border-color: #00ff88; }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 15px; }
        .game-title { font-size: 0.85em; font-weight: bold; margin-top: 8px; }

        #game-view { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 9999; 
        }
        
        #game-frame { width: 100%; height: calc(100% - 60px); border: none; margin-top: 60px; }

        #close-bar {
            height: 60px; display: flex; justify-content: center; 
            align-items: center; background: #111; position: absolute; top: 0; left: 0; width: 100%;
        }

        .btn-close { background: #ff0000; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; }

        #jumpscare-video {
            width: 100%; height: 100%; object-fit: fill; 
            position: absolute; top: 0; left: 0; display: none;
        }
    </style>
</head>
<body>

    <div id="game-view">
        <div id="close-bar">
            <button class="btn-close" onclick="closeGame()">✖ ZURÜCK ZUM PORTAL</button>
        </div>
        <iframe id="game-frame" allow="autoplay; fullscreen; pointer-lock"></iframe>
        <video id="jumpscare-video" playsinline>
            <source src="ScreenRecording_05-11-2026 18-17-01_1.mov" type="video/quicktime">
        </video>
    </div>

    <h1>HALAL PORTAL</h1>

    <div class="grid">
        <div class="card" onclick="openGame('https://sosa.centromariapolis.cl/main/https://x.bluestacks.com')">
            <img src="https://cdn-icons-png.flaticon.com/512/889/889102.png">
            <div class="game-title" style="color: #00d4ff;">Roblox (BlueStacks)</div>
        </div>

        <div class="card" onclick="openGame('https://geometryspot.com/roblox/')">
            <img src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Roblox_player_icon_black.svg">
            <div class="game-title" style="color: #ff4444;">Roblox (Clean)</div>
        </div>

        <div class="card" onclick="triggerJumpscare()">
            <img src="https://cdn-icons-png.flaticon.com/512/564/564619.png">
            <div class="game-title">Secret Level</div>
        </div>
    </div>

    <script>
        const PIN = "6767";

        function openGame(url) {
            const pw = prompt("PIN:");
            if (pw === PIN) {
                const view = document.getElementById('game-view');
                const frame = document.getElementById('game-frame');
                document.getElementById('jumpscare-video').style.display = 'none';
                frame.style.display = 'block';
                frame.src = url;
                view.style.display = 'block';
            }
        }

        function triggerJumpscare() {
            const pw = prompt("PIN:");
            if (pw === PIN) {
                const view = document.getElementById('game-view');
                const video = document.getElementById('jumpscare-video');
                document.getElementById('game-frame').style.display = 'none';
                video.style.display = 'block';
                view.style.display = 'block';
                video.muted = false;
                video.play().catch(() => { alert("Tippe auf den Screen!"); video.play(); });
                video.onended = () => { closeGame(); };
            }
        }

        function closeGame() {
            document.getElementById('game-view').style.display = 'none';
            document.getElementById('game-frame').src = "";
            document.getElementById('jumpscare-video').pause();
        }
    </script>
</body>
</html>
