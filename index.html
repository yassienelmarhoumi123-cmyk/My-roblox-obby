<!DOCTYPE html
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine KI Website</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 400px; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #chat-box { height: 300px; overflow-y: auto; border: 1px solid #333; padding: 10px; margin-bottom: 10px; border-radius: 5px; background: #181818; display: flex; flex-direction: column; gap: 8px;}
        .message { padding: 8px 12px; border-radius: 8px; max-width: 80%; word-break: break-word; }
        .user { background: #007bff; align-self: flex-end; }
        .ai { background: #333; align-self: flex-start; }
        .input-area { display: flex; gap: 5px; }
        input { flex: 1; padding: 10px; border: 1px solid #444; background: #222; color: #fff; border-radius: 5px; }
        button { padding: 10px 15px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #218838; }
    </style>
</head>
<body>

    <div class="chat-container">
        <h2>Meine Gratis-KI</h2>
        <div id="chat-box"></div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Frag mich was..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Senden</button>
        </div>
    </div>

    <script>
        // HIER DEINEN OPENROUTER API-KEY EINTRAGEN:
        const API_KEY = "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";

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const userText = inputField.value.trim();

            if (!userText) return;

            // Nutzer-Nachricht anzeigen
            chatBox.innerHTML += `<div class="message user">${userText}</div>`;
            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // Platzhalter für KI-Antwort
            const aiMessageDiv = document.createElement("div");
            aiMessageDiv.className = "message ai";
            aiMessageDiv.innerText = "Denkt nach...";
            chatBox.appendChild(aiMessageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY}`,
                        "Content-Type": "application/json",
                        "HTTP-Referer": window.location.href, // Pflicht für OpenRouter
                        "X-Title": "Meine GitHub KI" // Optionaler Name deiner Seite
                    },
                    body: JSON.stringify({
                        "model": "openrouter/free", // Nutzt automatisch ein freies Modell
                        "messages": [
                            {"role": "user", "content": userText}
                        ]
                    })
                });

                const data = await response.json();
                
                if (data.choices && data.choices.length > 0) {
                    aiMessageDiv.innerText = data.choices[0].message.content;
                } else {
                    aiMessageDiv.innerText = "Fehler: Keine Antwort erhalten.";
                }
            } catch (error) {
                aiMessageDiv.innerText = "Netzwerkfehler aufgetreten.";
                console.error(error);
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
