<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Resources</title>
    <style>
        body { 
            background-color: #8a2be2; 
            color: white; 
            font-family: sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }
        h1 { 
            margin-bottom: 30px; 
            font-size: 2.5em;
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); 
            gap: 20px; 
            max-width: 900px;
            margin: 0 auto;
        }
        .card { 
            background: rgba(0, 0, 0, 0.3); 
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 15px; 
            padding: 15px; 
            text-decoration: none; 
            color: white; 
            display: block; 
            transition: transform 0.2s, background 0.2s;
        }
        .card:hover { 
            transform: scale(1.05); 
            background: rgba(0, 0, 0, 0.5);
        }
        .card img { 
            width: 100%; 
            border-radius: 10px; 
            aspect-ratio: 1/1; 
            object-fit: cover; 
        }
        .game-title { 
            margin-top: 10px; 
            font-weight: bold; 
            font-size: 1.1em; 
        }
    </style>
</head>
<body>

    <h1>Classroom Resources</h1>

    <div class="grid">
        
        <!-- Basket Random mit deinem GitLab Link -->
        <a href="https://basketballrandom.gitlab.io/" class="card">
            <img src="https://play-lh.googleusercontent.com/I6P9S9X1vD2zQ7z_Xp6hY9Y9Q-W6zCj6X_O3o7G3_5R6T-mU6n-9f_8R3n-v_8" alt="Basket Random">
            <div class="game-title">Basket Random</div>
        </a>

        <!-- Granny (Platzhalter - schick mir gerne noch einen Link dafür!) -->
        <a href="https://webglmath.github.io/granny/" class="card">
            <img src="https://play-lh.googleusercontent.com/6X9k7aHhK8V6zCj6X_O3o7G3_5R6T-mU6n-9f_8R3n-v_8" alt="Granny">
            <div class="game-title">Granny</div>
        </a>

    </div>

</body>
</html>
