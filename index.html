<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halal Games & Chat Portal</title>
    <style>
        body { 
            background: radial-gradient(circle, #1a0033, #000000); 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 40px 20px; 
            overflow-x: hidden;
        }

        /* DER SPERRBILDSCHIRM (Wartungsmodus) */
        #maintenance-overlay {
            display: none; /* Wird per JS auf 'flex' gesetzt */
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 99999; /* Über allem anderen */
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .m-box {
            padding: 40px;
            border: 2px solid #ff0000;
            border-radius: 30px;
            background: rgba(20, 0, 0, 0.9);
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.2);
        }

        /* ADMIN PANEL UNTEN */
        #admin-bar {
            position: fixed;
            bottom: 0; left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.9);
            padding: 10px 20px;
            border-radius: 15px 15px 0 0;
            border: 1px solid #8a2be2;
            z-index: 100000; /* Muss sogar über dem Sperrbildschirm liegen! */
            display: flex;
            gap: 10px;
            align-items: center;
            opacity: 0.1; /* Fast unsichtbar */
            transition: opacity 0.3s;
        }
        #admin-bar:hover { opacity: 1; }

        #admin-input {
            background: #111;
            border: 1px solid #8a2be2;
            color: #00ff00;
            padding: 8px;
            border-radius: 8px;
            outline: none;
            width: 100px;
        }

        /* RESTLICHES DESIGN */
        h1 { font-size: 3em; text-shadow: 0 0 20px #8a2be2; margin-bottom: 40px; }
        .grid { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 15px; width: 180px; cursor: pointer; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: #8a2be2; }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 15px; }
        
        .btn-admin { background: #8a2be2; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        /* Overlay für Spiele */
        #game-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; }
        .close-bar { height: 50px; background: #111; display: flex; justify-content: center; align-items: center; }
        iframe { width: 100%; height: calc(100% - 50px); border: none; }
    </style>
</head>
<body onload="initCheck()">

    <!-- WARTUNGS-MODUS SCREEN -->
    <div id="maintenance-overlay">
        <div class="m-box">
            <h1 style="color: #ff0000; margin: 0;">OFFLINE</h1>
            <p style="font-size: 1.2em;">Wartungsarbeiten aktiv. Zugriff verweigert.</p>
        </div>
    </div>

    <!-- ADMIN PANEL (Immer oben auf, damit du entsperren kannst) -->
    <div id="admin-bar">
        <span style="font-size: 12px; color: #888;">Admin:</span>
        <input type="password" id="admin-input" placeholder="Code...">
        <button class="btn-admin" onclick="toggleStatus()">OK</button>
    </div>

    <!-- SPIEL-ANZEIGE -->
    <div id="game-view">
        <div class="close-bar">
            <button class="btn-admin" style="background: #ff0000;" onclick="closeGame()">✖ SCHLIESSEN</button>
        </div>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <!-- HAUPTINHALT -->
    <div id="main-content">
        <h1>HALAL PORTAL</h1>
        <div class="grid">
            <!-- Murder Spiel -->
            <div class="card" onclick="openGame('https://murder-unblocked.github.io/')">
                <img src="Murder.png" alt="Murder">
                <p style="color: #ff4444; font-weight: bold;">MURDER</p>
            </div>
            
            <!-- Halal Chat -->
            <div class="card" onclick="openGame('https://ommogle.com/')">
                <img src="halal-chat.png" alt="Chat">
                <p style="color: #00d4ff; font-weight: bold;">HALAL CHAT</p>
            </div>
            
            <!-- Weitere Karten hier einfügen... -->
        </div>
    </div>

    <script>
        const ADMIN_CODE = "9999"; // Dein Code zum Umschalten
        const USER_CODE = "6767";  // Dein Code für die Spiele

        // Prüfen beim Laden
        function initCheck() {
            const isLocked = localStorage.getItem("site_locked") === "true";
            if (isLocked) {
                document.getElementById('maintenance-overlay').style.display = 'flex';
                document.getElementById('main-content').style.opacity = '0';
            }
        }

        // Wartungsmodus an/aus
        function toggleStatus() {
            const val = document.getElementById('admin-input').value;
            if (val === ADMIN_CODE) {
                const currentState = localStorage.getItem("site_locked") === "true";
                localStorage.setItem("site_locked", !currentState);
                alert(!currentState ? "MODUS: Wartung AKTIVIERT" : "MODUS: Wartung DEAKTIVIERT");
                location.reload();
            } else {
                alert("Falscher Admin-Code!");
            }
            document.getElementById('admin-input').value = "";
        }

        // Spiel öffnen
        function openGame(url) {
            // Wenn Wartung aktiv, passiert gar nichts
            if (localStorage.getItem("site_locked") === "true") return;

            const code = prompt("Bitte Geheimcode eingeben:");
            if (code === USER_CODE) {
                document.getElementById('game-frame').src = url;
                document.getElementById('game-view').style.display = 'block';
                document.body.style.overflow = 'hidden';
            } else {
                alert("Zugriff verweigert!");
            }
        }

        function closeGame() {
            document.getElementById('game-view').style.display = 'none';
            document.getElementById('game-frame').src = "";
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
