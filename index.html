<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitLife - Life Simulator</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Navigationsleiste oben */
        #topNavBar {
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 999;
            background: rgba(20, 20, 20, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        #topNavBar .title {
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .nav-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-panic {
            background-color: #e63946;
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-panic:hover {
            background-color: #d62839;
            transform: scale(1.03);
        }

        .btn-close {
            background: transparent;
            color: #a0a0a0;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: color 0.2s;
        }

        .btn-close:hover {
            color: #ffffff;
        }

        /* Canvas / Spiel Container */
        .webgl-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        #gameContainer {
            width: 100%;
            height: 100%;
        }

        /* Panic / Tarn-Modus Container */
        #panicOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            color: #000000;
            z-index: 999999;
            overflow-y: auto;
            padding: 40px 20px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        #panicOverlay h1 {
            margin-bottom: 20px;
            font-size: 28px;
        }

        #panicOverlay h2 {
            margin-top: 20px;
            margin-bottom: 8px;
            font-size: 20px;
        }

        #panicOverlay ul {
            margin-left: 20px;
            margin-bottom: 12px;
        }

        #panicOverlay img {
            border-radius: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            display: block;
        }

        .btn-restore {
            position: fixed;
            top: 15px;
            right: 20px;
            background: #efefef;
            color: #333;
            border: 1px solid #ccc;
            padding: 6px 12px;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .btn-restore:hover {
            opacity: 1;
        }
    </style>

    <link rel="canonical" href="/">
    <script src="https://cdn.jsdelivr.net/gh/a456pur/seraph@ae2fcc6d6a9cd051654fcc0519080db1f79cf2a7/games/bitlife/TemplateData/UnityProgress.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/a456pur/seraph@ae2fcc6d6a9cd051654fcc0519080db1f79cf2a7/games/bitlife/Build/UnityLoader.js"></script>
    <script>
      var unityInstance = UnityLoader.instantiate("gameContainer", "https://cdn.jsdelivr.net/gh/a456pur/seraph@ae2fcc6d6a9cd051654fcc0519080db1f79cf2a7/games/bitlife/Build/BitLife.json", {onProgress: UnityProgress});
    </script>
</head>
<body>

    <!-- Navigationsleiste -->
    <div id="topNavBar">
        <a href="#" class="title">BitLife Simulator</a>
        <div class="nav-actions">
            <button class="btn-panic" onclick="togglePanic()">🚨 Panic (ESC)</button>
            <button class="btn-close" onclick="closeBacklinks()">✕</button>
        </div>
    </div>

    <!-- Spiel Container -->
    <div class="webgl-content">
        <div id="gameContainer"></div>
    </div>

    <!-- Tarn-Seite / Panic Overlay -->
    <div id="panicOverlay">
        <button class="btn-restore" onclick="togglePanic()">Zurück zum Spiel</button>

        <h1>Yassiens Steckbrief</h1>

        <h2>Mein Hobby:</h2>
        <ul> 
            <li>Fußball</li> 
        </ul>
        <img src="bilder/Ronaldo.jpg" width="200" alt="Ronaldo">
        
        <h2>Lieblingsessen:</h2>  
        <ul> 
            <li>Döner</li> 
        </ul>  
        <img src="bilder/Döner.jpg" width="200" alt="Döner">  
        
        <h2>Lieblingsspiele:</h2>  
        <ul>  
            <li>Car Parking Multiplayer</li>  
            <li>FC27</li>  
        </ul>
        <img src="bilder/OIP.webp" width="200" alt="Spiel 1">  
        <img src="bilder/Fc27.webp" width="200" alt="Spiel 2">
        
        <h2>Lieblingsserien:</h2>  
        <ul>  
            <li>Henry Danger</li>  
            <li>Spongebob</li>  
        </ul>

        <p><a href="Döner.html">Döner Rezept</a></p>
    </div>

    <script>
        function closeBacklinks() {
            document.querySelector('#topNavBar').style.display = "none";
        }

        function togglePanic() {
            const panicOverlay = document.getElementById('panicOverlay');
            if (panicOverlay.style.display === "block") {
                panicOverlay.style.display = "none";
                document.title = "BitLife - Life Simulator";
            } else {
                panicOverlay.style.display = "block";
                document.title = "Yassiens Steckbrief";
            }
        }

        // Schnelles Umschalten per ESC-Taste
        window.addEventListener('keydown', function(e) {
            if (e.key === "Escape") {
                togglePanic();
            }
        });
    </script>
</body>
</html>
