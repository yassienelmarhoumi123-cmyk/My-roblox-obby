<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minecraft Web Voxel Engine</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #55b4ff; font-family: 'Courier New', Courier, monospace; touch-action: none; user-select: none; }
        canvas { display: block; }
        
        /* Fadenkreuz */
        #crosshair { position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.8); mix-blend-mode: difference; }
        #crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
        #crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }
        
        /* Hotbar */
        #hotbar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); padding: 4px; border-radius: 4px; display: flex; gap: 4px; border: 3px solid #222; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 10; pointer-events: auto; }
        .slot { width: 40px; height: 40px; border: 2px solid #555; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 2px; color: white; font-weight: bold; font-size: 10px; background: rgba(50,50,50,0.8); box-shadow: inset 0 0 10px rgba(0,0,0,0.8); }
        .slot.active { border-color: #fff; transform: scale(1.1); background: rgba(100,100,100,0.8); z-index: 2; box-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .block-preview { width: 20px; height: 20px; position: absolute; top: 6px; border: 1px solid rgba(0,0,0,0.5); }
        
        /* Mobile Controls */
        #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 130px; height: 130px; background: rgba(0,0,0,0.2); border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; z-index: 9; touch-action: none; }
        #joystick-knob { position: absolute; top: 40px; left: 40px; width: 50px; height: 50px; background: rgba(255,255,255,0.6); border-radius: 50%; pointer-events: none; }
        #jump-btn { position: absolute; bottom: 40px; right: 40px; width: 80px; height: 80px; background: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; z-index: 9; display: flex; align-items: center; justify-content: center; color: white; font-size: 30px; }
        
        /* Start-Screen für PC PointerLock */
        #blocker { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; z-index: 20; font-size: 20px; }
        #loading { font-size: 14px; color: #aaa; margin-top: 10px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="blocker">
        <b>Klicke / Tippe um zu starten</b>
        <div id="loading">Welt wird generiert...</div>
    </div>

    <div id="crosshair"></div>
    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="jump-btn">↑</div>
    
    <div id="hotbar">
        <div id="slot-1" class="slot active"><div class="block-preview" style="background: #557a2b;"></div>Gras</div>
        <div id="slot-2" class="slot"><div class="block-preview" style="background: #866043;"></div>Erde</div>
        <div id="slot-3" class="slot"><div class="block-preview" style="background: #777777;"></div>Stein</div>
        <div id="slot-4" class="slot"><div class="block-preview" style="background: #6e5032;"></div>Holz</div>
        <div id="slot-5" class="slot"><div class="block-preview" style="background: #3b5e2b;"></div>Laub</div>
        <div id="slot-6" class="slot"><div class="block-preview" style="background: #e2d2a4;"></div>Sand</div>
        <div id="slot-7" class="slot"><div class="block-preview" style="background: #ffffff;"></div>Schnee</div>
        <div id="slot-8" class="slot"><div class="block-preview" style="background: rgba(100,200,255,0.7);"></div>Glas</div>
    </div>

    <script>
        // --- 1. ENGINE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x55b4ff);
        scene.fog = new THREE.Fog(0x55b4ff, 20, 60);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false }); // Antialias off für Minecraft-Look & Performance
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); 
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffe0, 0.8); 
        sunLight.position.set(50, 100, 50); 
        sunLight.castShadow = true;
        sunLight.shadow.camera.left = -40; sunLight.shadow.camera.right = 40;
        sunLight.shadow.camera.top = 40; sunLight.shadow.camera.bottom = -40;
        scene.add(sunLight);

        // --- 2. MATERIALIEN (Blöcke) ---
        const blockGeo = new THREE.BoxGeometry(1, 1, 1);
        
        function makeMat(color, transparent = false, opacity = 1) {
            return new THREE.MeshLambertMaterial({ color, transparent, opacity });
        }
        function makeMult(top, side, bottom) {
            return [makeMat(side), makeMat(side), makeMat(top), makeMat(bottom), makeMat(side), makeMat(side)];
        }

        const mats = {
            1: makeMult(0x557a2b, 0x866043, 0x866043), // Gras
            2: makeMult(0x866043, 0x866043, 0x866043), // Erde
            3: makeMult(0x777777, 0x777777, 0x777777), // Stein
            4: makeMult(0x8a6844, 0x6e5032, 0x8a6844), // Holz
            5: makeMult(0x3b5e2b, 0x3b5e2b, 0x3b5e2b), // Laub
            6: makeMult(0xe2d2a4, 0xe2d2a4, 0xe2d2a4), // Sand
            7: makeMult(0xffffff, 0xffffff, 0xffffff), // Schnee
            8: [makeMat(0xffffff, true, 0.3), makeMat(0xffffff, true, 0.3), makeMat(0xffffff, true, 0.3), makeMat(0xffffff, true, 0.3), makeMat(0xffffff, true, 0.3), makeMat(0xffffff, true, 0.3)], // Glas
            9: makeMult(0x3a8fb7, 0x3a8fb7, 0x3a8fb7)  // Wasser (wird leicht transparent gerendert)
        };
        mats[9].forEach(m => { m.transparent = true; m.opacity = 0.7; });

        let currentBlock = 1;

        // --- 3. VOXEL DATENBANK (Der Performance-Trick) ---
        const worldMap = new Map(); // Speichert Positionen "x,y,z" als Schlüssel
        const raycastBlocks = [];   // Nur für den Sicht-Laser (Abbauen)

        function addBlock(x, y, z, type, isSurface = false) {
            const key = `${x},${y},${z}`;
            if (worldMap.has(key)) return; // Verhindert doppelte Blöcke

            const mesh = new THREE.Mesh(blockGeo, mats[type]);
            mesh.position.set(x, y, z);
            
            // Schatten nur für sichtbare Oberflächenblöcke, um Performance zu retten
            if (isSurface && type !== 9 && type !== 8) {
                mesh.castShadow = true;
                mesh.receiveShadow = true;
            }

            scene.add(mesh);
            worldMap.set(key, { mesh, type });
            if (type !== 9) raycastBlocks.push(mesh); // Wasser kann nicht abgebaut werden
        }

        function removeBlock(mesh) {
            const x = Math.round(mesh.position.x);
            const y = Math.round(mesh.position.y);
            const z = Math.round(mesh.position.z);
            const key = `${x},${y},${z}`;
            
            if (worldMap.has(key)) {
                scene.remove(mesh);
                worldMap.delete(key);
                const idx = raycastBlocks.indexOf(mesh);
                if(idx > -1) raycastBlocks.splice(idx, 1);
            }
        }

        // --- 4. WELT GENERIERUNG ---
        function getNoise(x, z) {
            // Kombinierte Sinus-Wellen für realistische Berge und Täler
            let h = Math.sin(x * 0.05) * Math.cos(z * 0.05) * 8;
            h += Math.sin(x * 0.1) * Math.sin(z * 0.1) * 4;
            h += Math.sin(x * 0.2) * Math.cos(z * 0.2) * 2;
            return Math.floor(h);
        }

        const WORLD_SIZE = 60; // 60x60 ist riesig für Browser
        const WATER_LEVEL = -2;

        for (let x = -WORLD_SIZE/2; x < WORLD_SIZE/2; x++) {
            for (let z = -WORLD_SIZE/2; z < WORLD_SIZE/2; z++) {
                let h = getNoise(x, z);
                
                // Untergrund bis Oberfläche bauen
                for (let y = h - 3; y <= h; y++) {
                    let type = 3; // Stein
                    let isSurface = (y === h);

                    if (y === h) {
                        if (h <= WATER_LEVEL + 1) type = 6; // Sand am Wasser
                        else if (h > 6) type = 7; // Schnee auf Bergen
                        else type = 1; // Gras normal
                    } else if (y > h - 3) {
                        type = (h <= WATER_LEVEL + 1) ? 6 : 2; // Erde oder Sand drunter
                    }

                    addBlock(x, y, z, type, isSurface);
                }

                // Wasser auffüllen
                if (h < WATER_LEVEL) {
                    for (let y = h + 1; y <= WATER_LEVEL; y++) {
                        addBlock(x, y, z, 9, y === WATER_LEVEL);
                    }
                }

                // Bäume pflanzen (nur auf Gras)
                if (h > WATER_LEVEL + 1 && h < 6 && Math.random() < 0.02) {
                    // Stamm
                    for(let ty = 1; ty <= 4; ty++) addBlock(x, h + ty, z, 4, true);
                    // Blätter
                    for(let lx = -2; lx <= 2; lx++) {
                        for(let lz = -2; lz <= 2; lz++) {
                            for(let ly = 3; ly <= 5; ly++) {
                                if (lx*lx + lz*lz + (ly-4)*(ly-4) <= 5) {
                                    if (lx===0 && lz===0 && ly<5) continue;
                                    addBlock(x + lx, h + ly, z + lz, 5, true);
                                }
                            }
                        }
                    }
                }
            }
        }

        // Ladebildschirm ausblenden
        document.getElementById('loading').innerText = "Bereit!";

        // --- 5. SPIELER & PHYSIK ENGINE ---
        const player = {
            pos: new THREE.Vector3(0, 15, 0), // Spawnt oben, fällt runter
            vel: new THREE.Vector3(0, 0, 0),
            height: 1.6,
            radius: 0.3,
            onGround: false
        };
        camera.position.copy(player.pos);

        // Kollisions-Prüfung über die schnelle Voxel-Map
        function isSolidBlock(x, y, z) {
            const key = `${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`;
            if (!worldMap.has(key)) return false;
            const b = worldMap.get(key);
            return b.type !== 9; // Wasser ist nicht solide
        }

        function checkCollision(pos) {
            const minX = pos.x - player.radius, maxX = pos.x + player.radius;
            const minY = pos.y - player.height, maxY = pos.y + 0.2; // Füße bis Kopf
            const minZ = pos.z - player.radius, maxZ = pos.z + player.radius;

            for (let x = Math.floor(minX); x <= Math.floor(maxX); x++) {
                for (let y = Math.floor(minY); y <= Math.floor(maxY); y++) {
                    for (let z = Math.floor(minZ); z <= Math.floor(maxZ); z++) {
                        if (isSolidBlock(x, y, z)) return true;
                    }
                }
            }
            return false;
        }

        // --- 6. STEUERUNG (PC & MOBILE) ---
        let yaw = 0, pitch = 0;
        const lookSens = 0.005;
        let keys = { w:0, s:0, a:0, d:0 };
        let moveInput = { x: 0, y: 0 };
        let jumpTrigger = false;

        // PC Maus-Lock
        const blocker = document.getElementById('blocker');
        blocker.addEventListener('click', () => {
            if(!/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                document.body.requestPointerLock();
            }
            blocker.style.display = 'none';
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                yaw -= e.movementX * lookSens;
                pitch -= e.movementY * lookSens;
                pitch = Math.max(-Math.PI/2.1, Math.min(Math.PI/2.1, pitch));
            }
        });

        // PC Tastatur
        document.addEventListener('keydown', (e) => {
            let k = e.key.toLowerCase();
            if(k === 'w') keys.w = 1; if(k === 's') keys.s = 1;
            if(k === 'a') keys.a = 1; if(k === 'd') keys.d = 1;
            if(e.code === 'Space') jumpTrigger = true;
            if(['1','2','3','4','5','6','7','8'].includes(k)) selectSlot(parseInt(k));
        });
        document.addEventListener('keyup', (e) => {
            let k = e.key.toLowerCase();
            if(k === 'w') keys.w = 0; if(k === 's') keys.s = 0;
            if(k === 'a') keys.a = 0; if(k === 'd') keys.d = 0;
            if(e.code === 'Space') jumpTrigger = false;
        });

        // PC Bauen / Abbauen
        document.addEventListener('mousedown', (e) => {
            if (document.pointerLockElement !== document.body) return;
            handleAction(e.button === 2); // Rechtsklick = Bauen, Linksklick = Abbauen
        });

        // MOBILE Joystick & Touch
        const joyZone = document.getElementById('joystick-zone');
        const joyKnob = document.getElementById('joystick-knob');
        let joyId = null, lookId = null;
        let joyStart = {x:0, y:0}, prevLook = {x:0, y:0};
        let touchStart = 0, isSwipe = false;

        window.addEventListener('touchstart', (e) => {
            if(blocker.style.display !== 'none') blocker.style.display = 'none';
            
            for(let t of e.changedTouches) {
                if (t.clientX < window.innerWidth/2 && !joyId) {
                    joyId = t.identifier; joyStart = {x: t.clientX, y: t.clientY};
                    joyZone.style.left = (t.clientX - 65) + 'px';
                    joyZone.style.bottom = (window.innerHeight - t.clientY - 65) + 'px';
                } else if (t.clientX >= window.innerWidth/2 && !lookId && t.target.id !== 'jump-btn') {
                    lookId = t.identifier; prevLook = {x: t.clientX, y: t.clientY};
                    touchStart = Date.now(); isSwipe = false;
                }
            }
        });

        window.addEventListener('touchmove', (e) => {
            for(let t of e.touches) {
                if(t.identifier === joyId) {
                    let dx = t.clientX - joyStart.x, dy = t.clientY - joyStart.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if(dist > 40) { dx = (dx/dist)*40; dy = (dy/dist)*40; }
                    joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
                    moveInput.x = dx / 40; moveInput.y = -dy / 40;
                }
                if(t.identifier === lookId) {
                    let dx = t.clientX - prevLook.x, dy = t.clientY - prevLook.y;
                    if(Math.abs(dx)>2 || Math.abs(dy)>2) isSwipe = true;
                    yaw -= dx * lookSens; pitch -= dy * lookSens;
                    pitch = Math.max(-Math.PI/2.1, Math.min(Math.PI/2.1, pitch));
                    prevLook = {x: t.clientX, y: t.clientY};
                }
            }
        });

        window.addEventListener('touchend', (e) => {
            for(let t of e.changedTouches) {
                if(t.identifier === joyId) {
                    joyId = null; moveInput = {x:0, y:0};
                    joyKnob.style.transform = `translate(0px, 0px)`;
                    joyZone.style.left = '30px'; joyZone.style.bottom = '30px';
                }
                if(t.identifier === lookId) {
                    lookId = null;
                    let duration = Date.now() - touchStart;
                    if(!isSwipe) handleAction(duration < 300); // Kurz=Bauen, Lang=Abbauen
                }
            }
        });

        // Mobile Jump
        const jumpBtn = document.getElementById('jump-btn');
        jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); jumpTrigger = true; });
        jumpBtn.addEventListener('touchend', (e) => { e.preventDefault(); jumpTrigger = false; });

        // Hotbar Logik
        function selectSlot(id) {
            document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
            currentBlock = id;
            document.getElementById(`slot-${id}`).classList.add('active');
        }
        document.querySelectorAll('.slot').forEach((slot, idx) => {
            slot.addEventListener('touchstart', (e) => { e.stopPropagation(); selectSlot(idx+1); });
            slot.addEventListener('mousedown', (e) => { e.stopPropagation(); selectSlot(idx+1); });
        });

        // Bau/Abbau Funktion
        const raycaster = new THREE.Raycaster();
        const centerV = new THREE.Vector2(0,0);
        
        // Outline Rahmen
        const outlineMat = new THREE.MeshBasicMaterial({color: 0x000000, wireframe: true});
        const outlineBox = new THREE.Mesh(new THREE.BoxGeometry(1.01, 1.01, 1.01), outlineMat);
        scene.add(outlineBox);

        function handleAction(isPlacing) {
            raycaster.setFromCamera(centerV, camera);
            const hits = raycaster.intersectObjects(raycastBlocks);
            if(hits.length > 0 && hits[0].distance < 6) {
                if(!isPlacing) {
                    removeBlock(hits[0].object);
                } else {
                    let p = hits[0].point.clone().add(hits[0].face.normal.clone().multiplyScalar(0.5));
                    let bx = Math.round(p.x), by = Math.round(p.y), bz = Math.round(p.z);
                    
                    // Kollision mit Spieler beim Bauen verhindern
                    let pMinX = Math.floor(player.pos.x - player.radius), pMaxX = Math.floor(player.pos.x + player.radius);
                    let pMinY = Math.floor(player.pos.y - player.height), pMaxY = Math.floor(player.pos.y + 0.2);
                    let pMinZ = Math.floor(player.pos.z - player.radius), pMaxZ = Math.floor(player.pos.z + player.radius);
                    
                    if(bx >= pMinX && bx <= pMaxX && by >= pMinY && by <= pMaxY && bz >= pMinZ && bz <= pMaxZ) return;
                    
                    addBlock(bx, by, bz, currentBlock, true);
                }
            }
        }

        // --- 7. GAME LOOP & PHYSIK ---
        const clock = new THREE.Clock();
        const GRAVITY = -25;
        const SPEED = 5.0;
        const JUMP_FORCE = 8.5;

        function animate() {
            requestAnimationFrame(animate);
            let dt = Math.min(clock.getDelta(), 0.1);

            // Kamera Rotation
            const qYaw = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), yaw);
            const qPitch = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), pitch);
            camera.quaternion.copy(qYaw).multiply(qPitch);

            // Bewegung berechnen
            let fwd = new THREE.Vector3(0,0,-1).applyQuaternion(qYaw); fwd.y = 0; fwd.normalize();
            let rgt = new THREE.Vector3(1,0,0).applyQuaternion(qYaw); rgt.y = 0; rgt.normalize();

            let mx = (keys.d - keys.a) + moveInput.x;
            let mz = (keys.w - keys.s) + moveInput.y;

            let velX = (fwd.x * mz + rgt.x * mx) * SPEED * dt;
            let velZ = (fwd.z * mz + rgt.z * mx) * SPEED * dt;

            // X-Kollision (Wandgleiten!)
            player.pos.x += velX;
            if (checkCollision(player.pos)) { player.pos.x -= velX; }

            // Z-Kollision
            player.pos.z += velZ;
            if (checkCollision(player.pos)) { player.pos.z -= velZ; }

            // Y-Kollision (Schwerkraft & Springen)
            player.vel.y += GRAVITY * dt;
            player.pos.y += player.vel.y * dt;

            if (checkCollision(player.pos)) {
                if (player.vel.y < 0) {
                    player.onGround = true;
                    // Snappe auf den Boden
                    player.pos.y = Math.floor(player.pos.y - player.height) + 1 + player.height;
                } else {
                    // Kopf stößt an Decke
                    player.pos.y = Math.ceil(player.pos.y + 0.2) - 1 - 0.2 - 0.01;
                }
                player.vel.y = 0;
            } else {
                player.onGround = false;
            }

            if (jumpTrigger && player.onGround) {
                player.vel.y = JUMP_FORCE;
                player.onGround = false;
            }

            // Fall aus der Welt -> Respawn
            if (player.pos.y < -20) {
                player.pos.set(0, 20, 0);
                player.vel.set(0,0,0);
            }

            camera.position.copy(player.pos);

            // Block Outline Update
            raycaster.setFromCamera(centerV, camera);
            const hits = raycaster.intersectObjects(raycastBlocks);
            if (hits.length > 0 && hits[0].distance < 6) {
                outlineBox.position.copy(hits[0].object.position);
                outlineBox.visible = true;
            } else {
                outlineBox.visible = false;
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
