<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Bugatti Autobahn-Simulator</title>
    <style>
        body { margin: 0; overflow: hidden; background: #9ca3af; font-family: 'Segoe UI', sans-serif; user-select: none; }
        #info {
            position: absolute; top: 15px; left: 15px;
            color: white; background: rgba(15, 23, 42, 0.9);
            padding: 15px 22px; border-radius: 12px; font-size: 16px;
            pointer-events: none; border: 2px solid #38bdf8; z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            line-height: 1.6;
        }
        #status { color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>

    <div id="info">
        🏎️ <b>BUGATTI AUTOBAHN-SIMULATOR</b><br>
        Laufen / Fahren: <span style="color:#facc15">W, A, S, D</span><br>
        Einsteigen: <span style="color:#10b981">E</span> | Aussteigen: <span style="color:#ef4444">F</span><br>
        Kamera wechseln: <span style="color:#a855f7">C</span><br><br>
        Status: <span id="status">Zu Fuß</span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x9ca3af);
        scene.fog = new THREE.Fog(0x9ca3af, 80, 400);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(40, 100, 40);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 3 SPUREN BREITE AUTOBAHN
        const roadWidth = 40; 
        const roadLength = 5000;
        const roadGeo = new THREE.PlaneGeometry(roadWidth, roadLength);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x262626, roughness: 0.7 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.receiveShadow = true;
        scene.add(road);

        // Fahrbahnmarkierungen (3 Spuren)
        function createLine(width, length, color, xPos, isDashed = false) {
            const lineGeo = new THREE.PlaneGeometry(width, isDashed ? 8 : length);
            const lineMat = new THREE.MeshBasicMaterial({ color: color });
            for (let i = -roadLength/2; i < roadLength/2; i += (isDashed ? 20 : 0)) {
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.set(xPos, 0.02, isDashed ? i : 0);
                scene.add(line);
            }
        }
        // Außenlinien
        createLine(0.5, roadLength, 0xffffff, -roadWidth/2 + 1);
        createLine(0.5, roadLength, 0xffffff, roadWidth/2 - 1);
        // Mittlere gestrichelte Linien für 3 Spuren
        createLine(0.3, roadLength, 0xffffff, -roadWidth/6, true);
        createLine(0.3, roadLength, 0xffffff, roadWidth/6, true);

        // ... (Der Rest des Codes bleibt gleich für die Logik) ...
        
        // Variablen & Steuerung
        let carModel = null;
        let inCar = false;
        let playerPos = { x: 5, z: 20 };
        let carPos = { x: 0, z: 0 };
        let carSpeed = 0;
        let carAngle = 0;
        let cameraMode = 0;
        const keys = { w: false, a: false, s: false, d: false };

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = true;
            if (key === 'e' && !inCar && Math.hypot(playerPos.x - carPos.x, playerPos.z - carPos.z) < 40) {
                inCar = true;
                document.getElementById("status").innerText = "Im Bugatti";
            }
            if (key === 'f' && inCar) {
                inCar = false;
                playerPos.x = carPos.x - Math.cos(carAngle) * 20;
                playerPos.z = carPos.z + Math.sin(carAngle) * 20;
                document.getElementById("status").innerText = "Zu Fuß";
            }
            if (key === 'c' && inCar) cameraMode = (cameraMode + 1) % 3;
        });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        const loader = new THREE.GLTFLoader();
        loader.load('2016_bugatti_chiron.glb', (gltf) => {
            carModel = gltf.scene;
            carModel.scale.set(450, 450, 450);
            scene.add(carModel);
        });

        function animate() {
            requestAnimationFrame(animate);
            if (inCar) {
                if (keys.w) carSpeed = Math.min(carSpeed + 0.03, 2.5);
                else if (keys.s) carSpeed = Math.max(carSpeed - 0.03, -1.2);
                else carSpeed *= 0.98;
                if (Math.abs(carSpeed) > 0.01) {
                    if (keys.a) carAngle += 0.03;
                    if (keys.d) carAngle -= 0.03;
                }
                carPos.x += Math.sin(carAngle) * carSpeed;
                carPos.z += Math.cos(carAngle) * carSpeed;
                carModel.position.set(carPos.x, 0, carPos.z);
                carModel.rotation.y = carAngle;

                // Kamera-Modi
                if (cameraMode === 0) camera.position.set(carPos.x - Math.sin(carAngle) * 60, 25, carPos.z - Math.cos(carAngle) * 60);
                else if (cameraMode === 1) camera.position.set(carPos.x - Math.sin(carAngle) * 100, 50, carPos.z - Math.cos(carAngle) * 100);
                else camera.position.set(carPos.x - Math.sin(carAngle) * 40, 10, carPos.z - Math.cos(carAngle) * 40);
                camera.lookAt(carPos.x, 5, carPos.z);
            } else {
                if (keys.w) playerPos.z -= 0.5;
                if (keys.s) playerPos.z += 0.5;
                if (keys.a) playerPos.x -= 0.5;
                if (keys.d) playerPos.x += 0.5;
                camera.position.set(playerPos.x, 30, playerPos.z + 50);
                camera.lookAt(playerPos.x, 0, playerPos.z);
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
