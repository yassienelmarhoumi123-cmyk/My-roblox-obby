<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Classroom Resources</title>
    <style>
        body { background-color: #8a2be2; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 20px; }
        h1 { margin-bottom: 30px; font-size: 2.8em; text-shadow: 2px 2px 5px rgba(0,0,0,0.4); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 25px; max-width: 950px; margin: 0 auto; }
        
        /* Fröhlicherer Kachel-Style */
        .card { 
            background: rgba(255, 255, 255, 0.1); /* Helles, transparentes Weiß */
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 25px; 
            padding: 15px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); 
        }
        .card:hover { transform: translateY(-10px); border-color: rgba(255,255,255,1); background: rgba(255, 255, 255, 0.2); }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 18px; display: block; }
        
        .game-title { 
            padding-top: 15px; 
            font-size: 1.2em; 
            font-weight: 700; 
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        #game-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black; z-index: 9999; }
        iframe { width: 100%; height: 100%; border: none; }
        .close-btn { position: absolute; top: 15px; right: 15px; background: #ff0000; color: white; border: 2px solid white; padding: 12px 25px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div id="game-overlay"><button class="close-btn" onclick="closeGame()">X SCHLIESSEN</button><iframe id="game-frame" src=""></iframe></div>
    <h1>Classroom Resources</h1>
    <div class="grid">
        <!-- Basket Random -->
        <div class="card" onclick="openGame('https://basketballrandom.gitlab.io/')">
            <img src="basket.png" alt="Halal Basket Random">
            <div class="game-title">Halal Basket Random</div>
        </div>
        <!-- Halal Granny 2 -->
        <div class="card" onclick="openGame('https://horrorgamesfree.com/granny2')">
            <img src="halalgranny.png" alt="Halal Granny 2">
            <div class="game-title" style="color: #bc0000; font-weight: 900;">HALAL GRANNY 2</div>
        </div>
    </div>
    <script>
        function openGame(url) { document.getElementById('game-frame').src = url; document.getElementById('game-overlay').style.display = 'block'; document.body.style.overflow = 'hidden'; }
        function closeGame() { document.getElementById('game-overlay').style.display = 'none'; document.getElementById('game-frame').src = ''; document.body.style.overflow = 'auto'; }
    </script>
</body>
</html>
