<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash Royale 3D - Perfekte Kamera</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: Arial, sans-serif;
            touch-action: none; 
            user-select: none;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 15px;
            border-radius: 5px;
            pointer-events: none;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div id="info">
        <b>W, A, S, D</b> zum Laufen<br>
        <b>Display wischen / Maus ziehen</b> zum Umsehen<br>
        <b>Taste C</b> für Perspektiven-Wechsel (Ego / Third-Person)
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 20, 150);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // ==========================================
        // NEUES SPIELER-SETUP (Körper und Kopf getrennt)
        // ==========================================
        
        // 1. Der Spieler (enthält das Modell und bewegt sich über die Map)
        const player = new THREE.Group();
        player.position.set(0, 0, 0); 
        scene.add(player);

        // 2. Die Kamerahalterung (der "Kopf" - ist auf Augenhöhe und nickt hoch/runter)
        const cameraHolder = new THREE.Group();
        cameraHolder.position.set(0, 1.5, 0); // 1.5 Einheiten über dem Boden
        player.add(cameraHolder);

        // 3. Die eigentliche Kamera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 0); // Startet genau im Kopf (Ego-Sicht)
        cameraHolder.add(camera);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
        directionalLight.position.set(20, 30, 20);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const loader = new THREE.GLTFLoader();

        // Arena laden
        loader.load('enviroment_clash_royal 3.glb', function (gltf) {
            const arena = gltf.scene;
            arena.position.set(0, 0, 0);
            arena.scale.set(4, 4, 4); 
            scene.add(arena);
        });

        // Hog Rider laden
        let hogRider = null;
        let isFirstPerson = true;

        loader.load('hog_rider_adventure.glb', function (gltf) {
            hogRider = gltf.scene;
            hogRider.scale.set(0.08, 0.08, 0.08); 
            
            // Steht fest auf dem Boden (Y=0), relativ zum Spieler
            hogRider.position.set(0, 0, 0); 
            hogRider.rotation.y = Math.PI; // Guckt nach vorne

            // WICHTIG: In der Ego-Perspektive machen wir das Modell unsichtbar!
            hogRider.visible = false; 

            player.add(hogRider);
        });

        // ==========================================
        // STEUERUNG & UMSEHEN
        // ==========================================
        
        let isDragging = false;
        let previousTouch = { x: 0, y: 0 };
        let yaw = 0;   // Links/Rechts
        let pitch = 0; // Oben/Unten

        document.addEventListener('pointerdown', (e) => {
            isDragging = true;
            previousTouch.x = e.clientX;
            previousTouch.y = e.clientY;
        });

        document.addEventListener('pointermove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - previousTouch.x;
                const deltaY = e.clientY - previousTouch.y;

                yaw -= deltaX * 0.005;
                pitch -= deltaY * 0.005;

                // Kamera darf sich nicht überschlagen
                pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));

                // Der GESAMTE Spieler dreht sich nach links/rechts
                player.rotation.y = yaw;
                // NUR der Kopf (Kamera) dreht sich nach oben/unten (Modell bleibt auf dem Boden)
                cameraHolder.rotation.x = pitch;

                previousTouch.x = e.clientX;
                previousTouch.y = e.clientY;
            }
        });

        document.addEventListener('pointerup', () => {
            isDragging = false;
        });

        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        
        const moveSpeed = 0.08; 

        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W') moveForward = true;
            if (e.key === 'a' || e.key === 'A') moveLeft = true;
            if (e.key === 's' || e.key === 'S') moveBackward = true;
            if (e.key === 'd' || e.key === 'D') moveRight = true;
            
            // Perspektiven-Wechsel
            if (e.key === 'c' || e.key === 'C') {
                isFirstPerson = !isFirstPerson;
                if (isFirstPerson) {
                    // Ego-Perspektive: Kamera in den Kopf, Modell ausblenden
                    camera.position.set(0, 0, 0); 
                    if (hogRider) hogRider.visible = false;
                } else {
                    // Third-Person: Kamera zurück und leicht nach oben, Modell einblenden
                    camera.position.set(0, 1, 4); 
                    if (hogRider) hogRider.visible = true;
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W') moveForward = false;
            if (e.key === 'a' || e.key === 'A') moveLeft = false;
            if (e.key === 's' || e.key === 'S') moveBackward = false;
            if (e.key === 'd' || e.key === 'D') moveRight = false;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const BOUNDARY_X = 22; 
        const BOUNDARY_Z = 35; 

        function animate() {
            requestAnimationFrame(animate);

            if (moveForward || moveBackward || moveLeft || moveRight) {
                const moveX = (moveRight ? 1 : 0) - (moveLeft ? 1 : 0);
                const moveZ = (moveBackward ? 1 : 0) - (moveForward ? 1 : 0);

                const direction = new THREE.Vector3(moveX, 0, moveZ);
                
                if (direction.length() > 0) {
                    direction.normalize().multiplyScalar(moveSpeed);
                    // Bewegung anhand der Blickrichtung (Yaw) anpassen
                    direction.applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);
                    
                    // Wir bewegen jetzt den Spieler (player), nicht mehr nur die Kamera
                    player.position.add(direction);
                }
            }

            // Kollisionsabfrage
            if (player.position.x > BOUNDARY_X) player.position.x = BOUNDARY_X;
            if (player.position.x < -BOUNDARY_X) player.position.x = -BOUNDARY_X;
            if (player.position.z > BOUNDARY_Z) player.position.z = BOUNDARY_Z;
            if (player.position.z < -BOUNDARY_Z) player.position.z = -BOUNDARY_Z;

            // Feste Höhe einhalten (Spieler bleibt auf dem Boden)
            player.position.y = 0;

            renderer.render(scene, camera);
        }
        
        animate();
    </script>
</body>
</html>
