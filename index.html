<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halal Games Portal</title>
    <style>
        body { 
            background: radial-gradient(circle, #1a0033, #000000); 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 40px 20px; 
        }

        h1 { 
            font-size: 3em; 
            margin-bottom: 50px; 
            text-shadow: 0 0 20px rgba(138, 43, 226, 0.8);
            letter-spacing: 2px;
        }

        .grid { 
            display: flex; 
            justify-content: center; 
            gap: 30px; 
            flex-wrap: wrap; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        .card { 
            background: rgba(255, 255, 255, 0.05); 
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px; 
            padding: 15px; 
            width: 220px; 
            cursor: pointer; 
            transition: all 0.4s ease; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        .card:hover { 
            transform: translateY(-10px); 
            background: rgba(255, 255, 255, 0.12); 
            border-color: #8a2be2;
        }

        .card img { 
            width: 100%; 
            aspect-ratio: 1/1; 
            object-fit: cover; 
            border-radius: 20px; 
            margin-bottom: 15px;
        }

        .game-title { 
            font-size: 1.1em; 
            font-weight: bold; 
            text-transform: uppercase;
        }

        #game-overlay { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: black; 
            z-index: 9999; 
        }

        iframe { width: 100%; height: 100%; border: none; }

        .close-btn { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            background: #ff0000; 
            color: white; 
            border: 2px solid white; 
            padding: 12px 25px; 
            border-radius: 15px; 
            font-weight: 900; 
            cursor: pointer; 
            z-index: 10000;
        }
    </style>
</head>
<body>

    <div id="game-overlay">
        <button class="close-btn" onclick="closeGame()">✖ SCHLIESSEN</button>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <h1>HALAL GAMES PORTAL</h1>

    <div class="grid">
        <!-- Basket Random -->
        <div class="card" onclick="openGame('https://basketballrandom.gitlab.io/')">
            <img src="basket.png" alt="Basket Random">
            <div class="game-title">Basket Random</div>
        </div>

        <!-- Wordle Deutsch -->
        <div class="card" onclick="openGame('https://wordledeutsch.org/')">
            <img src="wordle.png" alt="Halal Wordle">
            <div class="game-title" style="color: #4CAF50;">Halal Wordle</div>
        </div>

        <!-- DTA 6 (Update mit neuem Bild) -->
        <div class="card" onclick="openGame('https://gamulo.com/game/dta-6-unblocked/')">
            <img src="dta6.png" alt="Halal DTA 6">
            <div class="game-title" style="color: #ffaa00;">Halal DTA 6</div>
        </div>

        <!-- Granny 2 -->
        <div class="card" onclick="openGame('https://horrorgamesfree.com/granny2')">
            <img src="halalgranny.png" alt="Halal Granny 2">
            <div class="game-title" style="color: #ff4444;">Halal Granny 2</div>
        </div>
    </div>

    <script>
        function openGame(url) {
            document.getElementById('game-frame').src = url;
            document.getElementById('game-overlay').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeGame() {
            document.getElementById('game-overlay').style.display = 'none';
            document.getElementById('game-frame').src = '';
            document.body.style.overflow = 'auto';
        }
    </script>

</body>
</html>
