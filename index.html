<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slither.io Ultra-Smooth & Drops</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: #05070f; color: white;
            font-family: 'Segoe UI', sans-serif;
            text-align: center; overflow: hidden; user-select: none;
        }
        #lobby {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(5, 7, 15, 0.95);
            padding: 25px; border-radius: 15px;
            border: 2px solid #00f588; z-index: 20; width: 80%; max-width: 320px;
        }
        button {
            background: #00f588; border: none; padding: 12px;
            font-size: 18px; font-weight: bold; color: #05070f;
            border-radius: 8px; cursor: pointer; margin-top: 15px; width: 100%;
        }
        #gameCanvas { background: #0b0f19; display: none; }
        #scoreBoard {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.6); padding: 8px 12px;
            border-radius: 6px; text-align: right; font-size: 13px;
            display: none; pointer-events: none; z-index: 10;
        }
        #chatBox {
            position: absolute; bottom: 10px; left: 10px;
            width: 250px; height: 140px; background: rgba(11, 15, 25, 0.8);
            border-radius: 8px; border: 1px solid #1f2937;
            display: none; flex-direction: column; text-align: left; z-index: 10;
        }
        #chatMessages { flex: 1; padding: 6px; overflow-y: auto; font-size: 11px; }
        #chatInput { border: none; padding: 6px; background: #111827; color: white; font-size: 12px; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; }
    </style>
</head>
<body>

    <div id="lobby">
        <h3>🐍 Slither.io NO-LAG <h3>
        <input type="number" id="roomInput" placeholder="Raum-Nummer (4-stellig)" style="font-size: 20px; width: 100%; text-align: center; padding: 6px; border-radius: 6px; border: 1px solid #1f2937; background: #111827; color: white;"><br>
        <button onclick="joinRoom()">Flüssig zocken! 🚀</button>
    </div>

    <div id="scoreBoard"><b style="color: #00f588;">BESTENLISTE:</b><div id="leaderboardList"></div></div>

    <div id="chatBox">
        <div id="chatMessages"></div>
        <input type="text" id="chatInput" placeholder="Schreib der Klasse..." onkeydown="sendChatMessage(event)">
    </div>

    <canvas id="gameCanvas"></canvas>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // BELGIEN-SERVER AKTIV
        const firebaseConfig = {
            apiKey: "AIzaSyDVCk8f0nhfJLLwycEZJN0-zJ05KURuGSQ",
            authDomain: "halal-bomben-spiel.firebaseapp.com",
            databaseURL: "https://halal-bomben-spiel-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "halal-bomben-spiel",
            storageBucket: "halal-bomben-spiel.firebasestorage.app",
            messagingSenderId: "709287849072",
            appId: "1:709287849072:web:0a477d52580b2cd3d598b5"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let roomId = "", playerId = "";
        let snakes = {}, foods = {};
        const MAP_WIDTH = 1800;
        const MAP_HEIGHT = 1400;

        let myLength = 8;
        let myTail = [];
        let alive = true;
        let myColor = "";

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        let myX = Math.random() * (MAP_WIDTH - 200) + 100;
        let myY = Math.random() * (MAP_HEIGHT - 200) + 100;
        let angle = Math.random() * Math.PI * 2;
        let currentSpeed = 4;
        let isBoosting = false;

        function joinRoom() {
            const input = document.getElementById("roomInput").value;
            if(input.length < 4) { alert("Bitte 4 Zahlen eingeben!"); return; }
            roomId = "smooth_" + input;
            playerId = "Spieler_" + Math.floor(Math.random() * 900 + 100);
            myColor = 'hsl(' + Math.random() * 360 + ', 100%, 50%)';

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            document.getElementById("lobby").style.display = "none";
            canvas.style.display = "block";
            document.getElementById("scoreBoard").style.display = "block";
            document.getElementById("chatBox").style.display = "flex";

            // Futter initialisieren
            database.ref(roomId + "/food").once("value", snapshot => {
                if(!snapshot.val()) {
                    let initialFood = {};
                    for(let i=0; i<60; i++) {
                        initialFood["f_"+i] = { x: Math.random()*(MAP_WIDTH-20)+10, y: Math.random()*(MAP_HEIGHT-20)+10, color: 'hsl('+Math.random()*360+', 100%, 60%)' };
                    }
                    database.ref(roomId + "/food").set(initialFood);
                }
            });

            database.ref(roomId + "/snakes").on("value", snapshot => { snakes = snapshot.val() || {}; });
            database.ref(roomId + "/food").on("value", snapshot => { foods = snapshot.val() || {}; });
            
            database.ref(roomId + "/chat").limitToLast(8).on("value", snapshot => {
                let chatDiv = document.getElementById("chatMessages"); chatDiv.innerHTML = "";
                snapshot.forEach(child => { let msg = child.val(); chatDiv.innerHTML += `<div><span style="color:${msg.color}">${msg.user}:</span> ${msg.text}</div>`; });
                chatDiv.scrollTop = chatDiv.scrollHeight;
            });

            setInterval(physicsLoop, 1000 / 45);
            setInterval(uploadDataLoop, 70);
            setInterval(() => { if(alive && isBoosting && myLength > 5) myLength--; }, 500);
        }

        canvas.addEventListener("touchmove", (e) => {
            e.preventDefault(); if(!alive) return;
            let touchX = e.touches[0].clientX;
            let touchY = e.touches[0].clientY;
            angle = Math.atan2(touchY - canvas.height/2, touchX - canvas.width/2);
            isBoosting = (e.touches.length > 1);
        }, {passive: false});
        canvas.addEventListener("touchend", () => { isBoosting = false; });

        window.addEventListener("keydown", (e) => {
            if(!alive || document.activeElement === document.getElementById("chatInput")) return;
            if (e.key === "ArrowUp" || e.key.toLowerCase() === "w") angle = -Math.PI / 2;
            if (e.key === "ArrowDown" || e.key.toLowerCase() === "s") angle = Math.PI / 2;
            if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") angle = Math.PI;
            if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") angle = 0;
            if (e.key === " ") isBoosting = true;
        });
        window.addEventListener("keyup", (e) => { if (e.key === " ") isBoosting = false; });

        function sendChatMessage(e) {
            if(e.key === "Enter") {
                let input = document.getElementById("chatInput"); if(input.value.trim() === "") return;
                database.ref(roomId + "/chat").push({ user: playerId, text: input.value, color: myColor });
                input.value = ""; input.blur();
            }
        }

        // DIESE FUNKTION DROPPED DIE PUNKTE BEIM TOD
        function dropPointsAsFood() {
            // Wir nehmen jeden dritten Punkt aus unserem Schweif und spawnen dort Futter
            for (let i = 0; i < myTail.length; i += 3) {
                let dropId = "drop_" + playerId + "_" + i + "_" + Math.floor(Math.random() * 1000);
                database.ref(roomId + "/food/" + dropId).set({
                    x: myTail[i].x + (Math.random() * 10 - 5), // Leicht versetzt für schöneren Haufen Look
                    y: myTail[i].y + (Math.random() * 10 - 5),
                    color: myColor // Das Futter leuchtet in der Farbe der gestorbenen Schlange!
                });
            }
        }

        function respawn() {
            myX = Math.random() * (MAP_WIDTH - 200) + 100; myY = Math.random() * (MAP_HEIGHT - 200) + 100;
            myLength = 8; myTail = []; alive = true;
        }

        function physicsLoop() {
            if (!alive) return;
            currentSpeed = (isBoosting && myLength > 5) ? 6.5 : 3.8;
            myX += Math.cos(angle) * currentSpeed;
            myY += Math.sin(angle) * currentSpeed;

            if(myX < 0) myX = MAP_WIDTH; if(myX > MAP_WIDTH) myX = 0;
            if(myY < 0) myY = MAP_HEIGHT; if(myY > MAP_HEIGHT) myY = 0;

            myTail.unshift({x: myX, y: myY});
            if(myTail.length > myLength * 2.5) myTail.pop();

            // Essen einsammeln
            Object.keys(foods).forEach(fId => {
                let f = foods[fId];
                if(Math.abs(myX - f.x) < 15 && Math.abs(myY - f.y) < 15) {
                    myLength += 1;
                    
                    if(fId.startsWith("drop_")) {
                        // Wenn es gedropptes Futter von einer toten Schlange war, löschen wir es komplett
                        database.ref(roomId + "/food/" + fId).remove();
                    } else {
                        // Normales Futter respawnt an zufälliger Stelle
                        database.ref(roomId + "/food/" + fId).set({ x: Math.random()*(MAP_WIDTH-20)+10, y: Math.random()*(MAP_HEIGHT-20)+10, color: f.color });
                    }
                }
            });

            // Crash Test
            Object.keys(snakes).forEach(sId => {
                if(sId !== playerId && snakes[sId].alive) {
                    let otherTail = snakes[sId].tail || [];
                    for(let i = 4; i < otherTail.length; i += 3) {
                        if(Math.abs(myX - otherTail[i].x) < 12 && Math.abs(myY - otherTail[i].y) < 12) {
                            alive = false;
                            
                            // 1. Punkte auf der Map verteilen vor dem Löschen
                            dropPointsAsFood();
                            
                            // 2. Datenbank updaten
                            database.ref(roomId + "/snakes/" + playerId).update({ alive: false });
                            database.ref(roomId + "/chat").push({ user: "🚨", text: `${playerId} wurde zerlegt! 🍏`, color: "#ef4444" });
                            
                            setTimeout(respawn, 1000);
                        }
                    }
                }
            });
        }

        function uploadDataLoop() {
            if(!alive) return;
            database.ref(roomId + "/snakes/" + playerId).set({ id: playerId, x: myX, y: myY, tail: myTail, length: myLength, color: myColor, alive: true });
        }

        function drawArena() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(-(myX - canvas.width/2), -(myY - canvas.height/2));

            // Map-Border
            ctx.strokeStyle = "#1f2937"; ctx.lineWidth = 4; ctx.strokeRect(0, 0, MAP_WIDTH, MAP_HEIGHT);

            // Futter zeichnen
            Object.keys(foods).forEach(fId => {
                let f = foods[fId]; ctx.beginPath(); 
                // Gedropptes Futter von Spielern machen wir etwas größer, damit man sieht, dass es fette Punkte gibt!
                let size = fId.startsWith("drop_") ? 6 : 4;
                ctx.arc(f.x, f.y, size, 0, Math.PI*2); ctx.fillStyle = f.color; ctx.fill();
            });

            // Schlangen zeichnen
            let list = [];
            Object.keys(snakes).forEach(sId => {
                let s = snakes[sId]; if(!s.alive) return;
                list.push({id: s.id, score: s.length});
                let t = s.tail || []; if(t.length < 2) return;

                ctx.beginPath();
                ctx.moveTo(t[0].x, t[0].y);
                for(let i = 1; i < t.length; i++) { ctx.lineTo(t[i].x, t[i].y); }
                ctx.strokeStyle = s.color; ctx.lineWidth = 16; ctx.lineCap = "round"; ctx.lineJoin = "round";
                ctx.stroke();

                ctx.beginPath(); ctx.arc(s.x, s.y, 9, 0, Math.PI*2); ctx.fillStyle = "white"; ctx.fill();
                ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.font = "11px sans-serif"; ctx.fillText(s.id, s.x - 15, s.y - 15);
            });

            ctx.restore();

            // Bestenliste
            list.sort((a,b) => b.score - a.score); let html = "";
            list.slice(0, 4).forEach((p, i) => { html += `<div>${i+1}. ${p.id===playerId?"<b>DU</b>":p.id} (${p.score})</div>`; });
            document.getElementById("leaderboardList").innerHTML = html;

            requestAnimationFrame(drawArena);
        }
        requestAnimationFrame(drawArena);

        window.addEventListener("resize", () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        window.onbeforeunload = function() { if(roomId && playerId) database.ref(roomId + "/snakes/" + playerId).remove(); };
    </script>
</body>
</html>
