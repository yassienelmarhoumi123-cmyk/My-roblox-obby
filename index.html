<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Bugatti Professional Real-Drive System</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: 'Consolas', monospace; }
        #debug { position: absolute; top: 20px; left: 20px; color: #00ff00; background: rgba(0,0,0,0.8); padding: 20px; border: 1px solid #333; }
    </style>
</head>
<body>
    <div id="debug">
        <h3>BUGATTI CHIRON ENGINE V1.0</h3>
        <p>Gang: <span id="gear">N</span></p>
        <p>Speed: <span id="speed">0</span> km/h</p>
        <p>Input: <span id="input">IDLE</span></p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        /**
         * 1. PHYSICS ENGINE KLASSE
         * Berechnet Drehmoment, Reibung und Gangschaltung
         */
        class PhysicsEngine {
            constructor() {
                this.speed = 0;
                this.gear = 1;
                this.rpm = 800;
                this.torqueCurve = [0, 400, 600, 800, 700, 500]; // Nm pro Gang
            }

            update(input, dt) {
                // Beschleunigung basierend auf Gang
                let acceleration = (input.w ? (this.torqueCurve[this.gear] * 0.001) : 0);
                
                // Rollwiderstand & Bremse
                if(input.s) acceleration -= 2.0;
                else if(!input.w) acceleration -= 0.5;

                this.speed += acceleration * dt;
                this.speed = Math.max(0, this.speed);

                // Gangschaltung (Simulation)
                if (this.speed > 80) this.gear = 4;
                else if (this.speed > 50) this.gear = 3;
                else if (this.speed > 25) this.gear = 2;
                else this.gear = 1;

                return this.speed;
            }
        }

        /**
         * 2. CAR CONTROLLER KLASSE
         * Handhabt Lenkung und Position
         */
        class CarController {
            constructor(model) {
                this.model = model;
                this.angle = 0;
                this.pos = new THREE.Vector3(0, 0, 0);
            }

            steer(input, speed, dt) {
                // Lenkungsdämpfung: Je schneller, desto träger die Lenkung (Realismus!)
                let steeringDamping = 1 / (1 + speed * 0.02);
                if (speed > 1) {
                    if (input.a) this.angle += 0.05 * steeringDamping;
                    if (input.d) this.angle -= 0.05 * steeringDamping;
                }
            }

            move(speed) {
                this.pos.x += Math.sin(this.angle) * (speed * 0.1);
                this.pos.z += Math.cos(this.angle) * (speed * 0.1);
                this.model.position.set(this.pos.x, 0, this.pos.z);
                this.model.rotation.y = this.angle;
            }
        }

        /**
         * 3. MAIN SIMULATION SETUP
         */
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Licht & Umgebung
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(100, 100, 100);
        scene.add(dirLight);

        // Boden-Layer-Trennung (Verhindert Z-Fighting)
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(5000, 5000), new THREE.MeshStandardMaterial({ color: 0x1a472a }));
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        const road = new THREE.Mesh(new THREE.PlaneGeometry(40, 5000), new THREE.MeshStandardMaterial({ color: 0x222 }));
        road.rotation.x = -Math.PI / 2;
        road.position.y = 0.01; // Straße schwebt minimal
        scene.add(road);

        // Instanzen
        const physics = new PhysicsEngine();
        let car;
        const keys = { w: false, a: false, s: false, d: false };

        const loader = new THREE.GLTFLoader();
        loader.load('2016_bugatti_chiron.glb', (gltf) => {
            car = new CarController(gltf.scene);
            car.model.scale.set(450, 450, 450);
            scene.add(car.model);
        });

        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        // Loop
        let lastTime = 0;
        function animate(time) {
            requestAnimationFrame(animate);
            let dt = (time - lastTime) * 0.001; // DeltaTime für frame-unabhängige Physik
            lastTime = time;

            if (car) {
                let speed = physics.update(keys, dt);
                car.steer(keys, speed, dt);
                car.move(speed);

                // Kamera Follow
                camera.position.set(car.pos.x - Math.sin(car.angle) * 40, 15, car.pos.z - Math.cos(car.angle) * 40);
                camera.lookAt(car.pos.x, 0, car.pos.z);

                // UI Update
                document.getElementById('gear').innerText = physics.gear;
                document.getElementById('speed').innerText = Math.round(speed);
                document.getElementById('input').innerText = Object.keys(keys).filter(k => keys[k]).join('+') || 'IDLE';
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
