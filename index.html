<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Halal Games Portal</title>
    <style>
        body { 
            background: radial-gradient(circle, #1a0033, #000000); 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
        }

        /* WARTUNGS-SCREEN */
        #maintenance-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* ONLINE STUFE ANZEIGE (Unten Rechts) */
        #status-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #8a2be2;
            padding: 10px 15px;
            border-radius: 50px;
            cursor: pointer;
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 14px;
            transition: transform 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        #status-indicator:active { transform: scale(0.9); }
        
        .dot {
            width: 10px;
            height: 10px;
            background: #00ff00;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff00;
        }

        /* GAME VIEW */
        #game-view { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 5000; 
        }
        
        iframe { width: 100%; height: calc(100% - 60px); border: none; }

        /* DESIGN ELEMENTE */
        h1 { font-size: 2.5em; text-shadow: 0 0 15px #8a2be2; margin-top: 40px; }
        .grid { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 20px; }
        .card { 
            background: rgba(255,255,255,0.05); 
            border-radius: 20px; 
            padding: 10px; 
            width: 150px; 
            border: 1px solid rgba(255,255,255,0.1);
        }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 15px; }
        .btn-ui { background: #8a2be2; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body onload="checkStatus()">

    <!-- WARTUNGS-SCREEN -->
    <div id="maintenance-overlay">
        <h1 style="color: red;">WARTUNG</h1>
        <p>Dieses Portal ist momentan im Wartungsmodus.</p>
        <p>Bitte versuche es später erneut.</p>
    </div>

    <!-- ONLINE STUFE BUTTON -->
    <div id="status-indicator" onclick="adminPrompt()">
        <div class="dot" id="status-dot"></div>
        <span id="status-text">Online Stufe</span>
    </div>

    <!-- GAME OVERLAY -->
    <div id="game-view">
        <div style="height: 60px; display: flex; justify-content: center; align-items: center;">
            <button class="btn-ui" style="background: red;" onclick="closeGame()">✖ SCHLIESSEN</button>
        </div>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <!-- HAUPTINHALT -->
    <div id="content">
        <h1>HALAL PORTAL</h1>
        <div class="grid">
            <!-- Murder Spiel -->
            <div class="card" onclick="launchGame('https://murder-unblocked.github.io/')">
                <img src="Murder.png" alt="Murder">
                <p style="color: #ff4444; font-weight: bold;">MURDER</p>
            </div>
            
            <!-- Halal Chat -->
            <div class="card" onclick="launchGame('https://ommogle.com/')">
                <img src="halal-chat.png" alt="Chat">
                <p style="color: #00d4ff; font-weight: bold;">CHAT</p>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_CODE = "9999";
        const USER_CODE = "6767";

        function checkStatus() {
            const isMaint = localStorage.getItem("maint_mode") === "true";
            const dot = document.getElementById('status-dot');
            const overlay = document.getElementById('maintenance-overlay');
            const content = document.getElementById('content');

            if (isMaint) {
                overlay.style.display = 'flex';
                content.style.display = 'none';
                dot.style.background = '#ff0000';
                dot.style.boxShadow = '0 0 10px #ff0000';
            } else {
                overlay.style.display = 'none';
                content.style.display = 'block';
                dot.style.background = '#00ff00';
                dot.style.boxShadow = '0 0 10px #00ff00';
            }
        }

        function adminPrompt() {
            const code = prompt("Admin-Code eingeben:");
            if (code === ADMIN_CODE) {
                const isMaint = localStorage.getItem("maint_mode") === "true";
                localStorage.setItem("maint_mode", !isMaint);
                location.reload();
            } else if (code !== null) {
                alert("Falscher Code!");
            }
        }

        function launchGame(url) {
            if (localStorage.getItem("maint_mode") === "true") return;
            
            const code = prompt("Geheimcode für Spiele:");
            if (code === USER_CODE) {
                document.getElementById('game-frame').src = url;
                document.getElementById('game-view').style.display = 'block';
                document.body.style.overflow = 'hidden';
            } else if (code !== null) {
                alert("Zugriff verweigert!");
            }
        }

        function closeGame() {
            document.getElementById('game-view').style.display = 'none';
            document.getElementById('game-frame').src = "";
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
