<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Bugatti Realistic Race</title>
    <style>
        body { margin: 0; overflow: hidden; background: #5c940d; font-family: 'Segoe UI', sans-serif; }
        #info { position: absolute; top: 15px; left: 15px; color: white; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 10px; pointer-events: none; }
    </style>
</head>
<body>

    <div id="info">
        🏎️ <b>REAL-DRIVE SIMULATOR</b><br>
        P1: W,A,S,D | P2: Pfeiltasten<br>
        Gangschaltung & Grip simuliert.
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Himmelblau
        scene.fog = new THREE.Fog(0x87CEEB, 50, 400);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Licht
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const sun = new THREE.DirectionalLight(0xffffff, 1);
        sun.position.set(50, 100, 50);
        sun.castShadow = true;
        scene.add(sun);

        // Boden & Landschaft
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(10000, 10000), new THREE.MeshStandardMaterial({ color: 0x228B22 }));
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Straße
        const road = new THREE.Mesh(new THREE.PlaneGeometry(40, 10000), new THREE.MeshStandardMaterial({ color: 0x333333 }));
        road.rotation.x = -Math.PI / 2;
        road.position.y = 0.05;
        scene.add(road);

        // Bäume als Landschaft
        for(let i = 0; i < 500; i++) {
            const tree = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 10), new THREE.MeshStandardMaterial({ color: 0x3e2723 }));
            const x = (Math.random() - 0.5) * 2000;
            const z = (Math.random() - 0.5) * 5000;
            if(Math.abs(x) > 30) {
                tree.position.set(x, 5, z);
                scene.add(tree);
            }
        }

        const keys = { w: false, a: false, s: false, d: false, arrowup: false, arrowdown: false, arrowleft: false, arrowright: false };
        window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        function createCar(x) {
            return { pos: {x, z: 0}, speed: 0, angle: 0, model: null };
        }
        let car1 = createCar(-10);
        let car2 = createCar(10);

        const loader = new THREE.GLTFLoader();
        loader.load('2016_bugatti_chiron.glb', (gltf) => {
            car1.model = gltf.scene.clone(); scene.add(car1.model);
            car2.model = gltf.scene.clone(); scene.add(car2.model);
        });

        function drive(car, f, b, l, r) {
            // Realistische Physik: Drehmoment-Kurve
            const torque = (car.speed < 2) ? 0.08 : (car.speed < 3.5 ? 0.04 : 0.01);
            if (keys[f]) car.speed = Math.min(car.speed + torque, 5.0);
            else if (keys[b]) car.speed = Math.max(car.speed - 0.1, -1.5);
            else car.speed *= 0.985; // Motorbremse

            // Grip-abhängiges Lenken (bei höherem Speed weniger direkt)
            const steer = 0.03 / (1 + Math.abs(car.speed) * 0.2);
            if (keys[l] && Math.abs(car.speed) > 0.1) car.angle += steer;
            if (keys[r] && Math.abs(car.speed) > 0.1) car.angle -= steer;

            car.pos.x += Math.sin(car.angle) * car.speed;
            car.pos.z += Math.cos(car.angle) * car.speed;

            if (car.model) {
                car.model.position.set(car.pos.x, 0, car.pos.z);
                car.model.rotation.set(0, car.angle, 0);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            drive(car1, 'w', 's', 'a', 'd');
            drive(car2, 'arrowup', 'arrowdown', 'arrowleft', 'arrowright');

            const w = window.innerWidth, h = window.innerHeight;
            renderer.setScissorTest(true);

            // P1
            renderer.setViewport(0, 0, w/2, h); renderer.setScissor(0, 0, w/2, h);
            renderer.render(scene, setupCam(car1));
            // P2
            renderer.setViewport(w/2, 0, w/2, h); renderer.setScissor(w/2, 0, w/2, h);
            renderer.render(scene, setupCam(car2));
        }

        function setupCam(car) {
            const cam = new THREE.PerspectiveCamera(60, (window.innerWidth/2)/window.innerHeight, 0.1, 1000);
            cam.position.set(car.pos.x - Math.sin(car.angle)*60, 25, car.pos.z - Math.cos(car.angle)*60);
            cam.lookAt(car.pos.x, 5, car.pos.z);
            return cam;
        }
        animate();
    </script>
</body>
</html>
