<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halal Games & Chat Portal</title>
    <style>
        body { 
            background: radial-gradient(circle, #1a0033, #000000); 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 40px 20px; 
        }

        h1 { 
            font-size: 3em; 
            margin-bottom: 50px; 
            text-shadow: 0 0 20px rgba(138, 43, 226, 0.8);
            letter-spacing: 2px;
        }

        .grid { 
            display: flex; 
            justify-content: center; 
            gap: 25px; 
            flex-wrap: wrap; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        .card { 
            background: rgba(255, 255, 255, 0.05); 
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px; 
            padding: 15px; 
            width: 200px; 
            cursor: pointer; 
            transition: all 0.4s ease; 
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .card:hover { 
            transform: translateY(-10px); 
            background: rgba(255, 255, 255, 0.12); 
            border-color: #8a2be2; 
        }

        .card img { 
            width: 100%; 
            aspect-ratio: 1/1; 
            object-fit: cover; 
            border-radius: 20px; 
            margin-bottom: 15px; 
        }

        .game-title { font-size: 1em; font-weight: bold; text-transform: uppercase; }

        /* Overlay & Controls */
        #game-overlay { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: black; 
            z-index: 9999; 
        }

        .controls {
            position: absolute; top: 0; width: 100%; height: 60px;
            background: #111; display: flex; justify-content: space-around; align-items: center;
            border-bottom: 1px solid #333;
        }

        iframe { width: 100%; height: calc(100% - 60px); border: none; margin-top: 60px; }

        .btn { 
            padding: 10px 20px; border-radius: 10px; border: none; 
            cursor: pointer; font-weight: bold; color: white;
        }
        .btn-tab { background: #8a2be2; }
        .btn-close { background: #ff0000; }
    </style>
</head>
<body>

    <div id="game-overlay">
        <div class="controls">
            <button class="btn btn-tab" onclick="openExternal()">🌐 Falls Screen schwarz: Hier klicken</button>
            <button class="btn btn-close" onclick="closeGame()">✖ SCHLIESSEN</button>
        </div>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <h1>HALAL PORTAL</h1>

    <div class="grid">
        <!-- Basket Random -->
        <div class="card" onclick="openGame('https://basketballrandom.gitlab.io/')">
            <img src="basket.png">
            <div class="game-title">Basket Random</div>
        </div>

        <!-- Wordle -->
        <div class="card" onclick="openGame('https://wordledeutsch.org/')">
            <img src="wordle.png">
            <div class="game-title" style="color: #4CAF50;">Halal Wordle</div>
        </div>

        <!-- Ommogle mit Halal Profilbild -->
        <div class="card" onclick="openGame('https://ommogle.com/')">
            <img src="halal-chat.png" alt="Halal Chat">
            <div class="game-title" style="color: #00d4ff;">Halal Chat</div>
        </div>

        <!-- DTA 6 -->
        <div class="card" onclick="openGame('https://gamulo.com/game/dta-6-unblocked/')">
            <img src="dta6.png">
            <div class="game-title" style="color: #ffaa00;">Halal DTA 6</div>
        </div>

        <!-- Granny 2 -->
        <div class="card" onclick="openGame('https://horrorgamesfree.com/granny2')">
            <img src="halalgranny.png">
            <div class="game-title" style="color: #ff4444;">Halal Granny 2</div>
        </div>
    </div>

    <script>
        let lastUrl = "";
        function openGame(url) {
            lastUrl = url;
            document.getElementById('game-frame').src = url;
            document.getElementById('game-overlay').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }
        function closeGame() {
            document.getElementById('game-overlay').style.display = 'none';
            document.getElementById('game-frame').src = '';
            document.body.style.overflow = 'auto';
        }
        function openExternal() {
            window.open(lastUrl, '_blank');
        }
    </script>
</body>
</html>
