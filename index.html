<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Arena - Multiplayer</title>
    <!-- PeerJS für die Serverlose Multiplayer-Verbindung -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050510;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 15, 30, 0.9);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
            text-align: center;
            width: 350px;
            z-index: 10;
        }
        h1 { margin-top: 0; color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            background: #000;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            border-radius: 5px;
            text-align: center;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: transparent;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s;
        }
        button:hover {
            background: #00ffcc;
            color: #000;
            box-shadow: 0 0 15px #00ffcc;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            display: none;
            z-index: 5;
        }
        .hud-text { font-size: 20px; font-weight: bold; margin-bottom: 5px; color: #fff; }
        .score { color: #ff0055; text-shadow: 0 0 5px #ff0055; }
    </style>
</head>
<body>

    <!-- User Interface fürs Verbinden -->
    <div id="ui">
        <h1>NEON ARENA</h1>
        <p id="statusMsg">Verbinde zum Netzwerk...</p>
        
        <div id="hostSection" style="display: none;">
            <p>Deine Spieler-ID (Gib sie deinem Freund):</p>
            <input type="text" id="myIdDisplay" readonly>
            <button id="copyBtn">ID Kopieren</button>
            <hr style="border-color: #333; margin: 20px 0;">
            <p>Oder trete einem Freund bei:</p>
            <input type="text" id="friendIdInput" placeholder="ID des Freundes eingeben">
            <button id="joinBtn">Spiel Beitreten</button>
        </div>
    </div>

    <!-- Ingame HUD -->
    <div id="hud">
        <div class="hud-text">Leben: <span id="healthDisplay" style="color: #00ffcc;">100</span></div>
        <div class="hud-text">Kills: <span id="scoreDisplay" class="score">0</span></div>
    </div>

    <!-- Das Spielfeld -->
    <canvas id="gameCanvas"></canvas>

<script>
/** 
 * ==========================================
 * NETZWERK & MULTIPLAYER LOGIK (PEERJS)
 * ==========================================
 */
const peer = new Peer(); 
let conn; 
let isHost = false;
let myId = '';
let gameStarted = false;

// UI Elemente
const ui = document.getElementById('ui');
const statusMsg = document.getElementById('statusMsg');
const hostSection = document.getElementById('hostSection');
const myIdDisplay = document.getElementById('myIdDisplay');
const friendIdInput = document.getElementById('friendIdInput');
const hud = document.getElementById('hud');

// PeerJS Events
peer.on('open', function(id) {
    myId = id;
    myIdDisplay.value = id;
    statusMsg.innerText = "Verbunden! Warte auf Gegner...";
    hostSection.style.display = "block";
});

document.getElementById('copyBtn').addEventListener('click', () => {
    myIdDisplay.select();
    document.execCommand('copy');
    document.getElementById('copyBtn').innerText = "Kopiert!";
    setTimeout(() => document.getElementById('copyBtn').innerText = "ID Kopieren", 2000);
});

// Wenn man als CLIENT beitritt
document.getElementById('joinBtn').addEventListener('click', () => {
    const friendId = friendIdInput.value.trim();
    if (!friendId) return alert("Bitte eine ID eingeben!");
    
    statusMsg.innerText = "Verbinde...";
    conn = peer.connect(friendId);
    setupConnection(conn, false);
});

// Wenn man als HOST jemanden empfängt
peer.on('connection', function(connection) {
    if (conn) return; // Nur 1v1 erlaubt
    conn = connection;
    setupConnection(conn, true);
});

function setupConnection(connection, hostMode) {
    isHost = hostMode;
    connection.on('open', function() {
        startGame();
    });

    connection.on('data', function(data) {
        if (isHost) {
            // Host empfängt Inputs vom Client
            if (data.type === 'input') {
                clientInput = data;
            }
        } else {
            // Client empfängt den Spielstatus vom Host
            if (data.type === 'gameState') {
                gameState = data.state;
                createParticlesFromEvents(data.events);
            }
        }
    });

    connection.on('close', () => {
        alert("Verbindung abgebrochen!");
        location.reload();
    });
}

function startGame() {
    ui.style.display = 'none';
    hud.style.display = 'block';
    gameStarted = true;
    
    // Resize Event
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    
    if (isHost) {
        initGameState();
    }
    
    // Start Game Loop
    requestAnimationFrame(gameLoop);
}

/** 
 * ==========================================
 * SPIEL LOGIK & ENGINE
 * ==========================================
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let width, height;

// Inputs des lokalen Spielers
let keys = { w: false, a: false, s: false, d: false };
let mouse = { x: 0, y: 0, down: false };

// Input des Clients (Nur für Host relevant)
let clientInput = { keys: {}, mouse: {x:0, y:0, down:false} };

// Der globale Spielstatus (Host hat die Autorität)
let gameState = {
    host: { x: 400, y: 300, hp: 100, score: 0, color: '#00ffcc', vx: 0, vy: 0, cooldown: 0 },
    client: { x: 800, y: 600, hp: 100, score: 0, color: '#ff0055', vx: 0, vy: 0, cooldown: 0 },
    bullets: []
};

let particles = [];
let networkEvents = []; // Für Sounds/Effekte beim Client

// Arena Größe
const ARENA_WIDTH = 2000;
const ARENA_HEIGHT = 1500;
let camera = { x: 0, y: 0 };

function resizeCanvas() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}

function initGameState() {
    gameState.host.x = ARENA_WIDTH * 0.25;
    gameState.host.y = ARENA_HEIGHT / 2;
    gameState.client.x = ARENA_WIDTH * 0.75;
    gameState.client.y = ARENA_HEIGHT / 2;
    gameState.host.hp = 100;
    gameState.client.hp = 100;
}

// Input Listener
window.addEventListener('keydown', (e) => {
    if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true;
});
window.addEventListener('keyup', (e) => {
    if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false;
});
canvas.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});
canvas.addEventListener('mousedown', () => mouse.down = true);
canvas.addEventListener('mouseup', () => mouse.down = false);

/** 
 * ==========================================
 * GAME LOOP (Update & Render)
 * ==========================================
 */
let lastTime = Date.now();

function gameLoop() {
    if (!gameStarted) return;
    let now = Date.now();
    let dt = (now - lastTime) / 1000; // Delta Time
    lastTime = now;

    if (isHost) {
        updateHost(dt);
        // Sende Status an Client
        conn.send({ type: 'gameState', state: gameState, events: networkEvents });
        networkEvents = []; // Reset nach senden
    } else {
        // Client sendet nur seine Eingaben an den Host
        // Maus in Welt-Koordinaten umrechnen
        let worldMouseX = mouse.x + camera.x;
        let worldMouseY = mouse.y + camera.y;
        conn.send({ type: 'input', keys: keys, mouse: { x: worldMouseX, y: worldMouseY, down: mouse.down } });
    }

    updateParticles(dt);
    updateCamera();
    draw();

    requestAnimationFrame(gameLoop);
}

// Physik & Logik (Läuft nur auf dem Host)
function updateHost(dt) {
    const SPEED = 400;
    const FRICTION = 0.85;
    const BULLET_SPEED = 800;
    
    // --- HOST BEWEGUNG ---
    if (keys.w) gameState.host.vy -= SPEED * dt;
    if (keys.s) gameState.host.vy += SPEED * dt;
    if (keys.a) gameState.host.vx -= SPEED * dt;
    if (keys.d) gameState.host.vx += SPEED * dt;

    // --- CLIENT BEWEGUNG ---
    if (clientInput.keys.w) gameState.client.vy -= SPEED * dt;
    if (clientInput.keys.s) gameState.client.vy += SPEED * dt;
    if (clientInput.keys.a) gameState.client.vx -= SPEED * dt;
    if (clientInput.keys.d) gameState.client.vx += SPEED * dt;

    // Physik anwenden (Reibung und Position)
    ['host', 'client'].forEach(playerKey => {
        let p = gameState[playerKey];
        p.vx *= FRICTION;
        p.vy *= FRICTION;
        p.x += p.vx;
        p.y += p.vy;

        // Rand-Kollision
        if (p.x < 20) { p.x = 20; p.vx = 0; }
        if (p.x > ARENA_WIDTH - 20) { p.x = ARENA_WIDTH - 20; p.vx = 0; }
        if (p.y < 20) { p.y = 20; p.vy = 0; }
        if (p.y > ARENA_HEIGHT - 20) { p.y = ARENA_HEIGHT - 20; p.vy = 0; }
        
        if (p.cooldown > 0) p.cooldown -= dt;
    });

    // --- SCHIESSEN (HOST) ---
    if (mouse.down && gameState.host.cooldown <= 0 && gameState.host.hp > 0) {
        let worldMx = mouse.x + camera.x;
        let worldMy = mouse.y + camera.y;
        let angle = Math.atan2(worldMy - gameState.host.y, worldMx - gameState.host.x);
        gameState.bullets.push({
            x: gameState.host.x, y: gameState.host.y,
            vx: Math.cos(angle) * BULLET_SPEED, vy: Math.sin(angle) * BULLET_SPEED,
            owner: 'host', color: gameState.host.color, life: 1.5
        });
        gameState.host.cooldown = 0.15; // Schussrate
    }

    // --- SCHIESSEN (CLIENT) ---
    if (clientInput.mouse.down && gameState.client.cooldown <= 0 && gameState.client.hp > 0) {
        let angle = Math.atan2(clientInput.mouse.y - gameState.client.y, clientInput.mouse.x - gameState.client.x);
        gameState.bullets.push({
            x: gameState.client.x, y: gameState.client.y,
            vx: Math.cos(angle) * BULLET_SPEED, vy: Math.sin(angle) * BULLET_SPEED,
            owner: 'client', color: gameState.client.color, life: 1.5
        });
        gameState.client.cooldown = 0.15;
    }

    // --- KUGELN UPDATEN & KOLLISION ---
    for (let i = gameState.bullets.length - 1; i >= 0; i--) {
        let b = gameState.bullets[i];
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.life -= dt;

        let hit = false;

        // Trefferprüfung
        ['host', 'client'].forEach(targetKey => {
            let target = gameState[targetKey];
            if (b.owner !== targetKey && target.hp > 0) {
                let dist = Math.hypot(target.x - b.x, target.y - b.y);
                if (dist < 25) { // Radius Spieler + Kugel
                    target.hp -= 10;
                    hit = true;
                    // Event für Partikel generieren
                    networkEvents.push({ type: 'hit', x: b.x, y: b.y, color: b.color });
                    createExplosion(b.x, b.y, b.color, 10);
                    
                    if (target.hp <= 0) {
                        // Jemand ist gestorben
                        let killer = gameState[b.owner];
                        killer.score += 1;
                        networkEvents.push({ type: 'death', x: target.x, y: target.y, color: target.color });
                        createExplosion(target.x, target.y, target.color, 50);
                        
                        // Respawn nach 3 Sekunden
                        setTimeout(() => {
                            target.hp = 100;
                            target.x = Math.random() * (ARENA_WIDTH - 100) + 50;
                            target.y = Math.random() * (ARENA_HEIGHT - 100) + 50;
                            target.vx = 0; target.vy = 0;
                        }, 3000);
                    }
                }
            }
        });

        // Kugel am Rand löschen
        if (b.life <= 0 || hit || b.x < 0 || b.x > ARENA_WIDTH || b.y < 0 || b.y > ARENA_HEIGHT) {
            gameState.bullets.splice(i, 1);
        }
    }
}

/** 
 * ==========================================
 * RENDERING (Grafik)
 * ==========================================
 */
function updateCamera() {
    let me = isHost ? gameState.host : gameState.client;
    // Weiche Kameraverfolgung (Lerp)
    let targetX = me.x - width / 2;
    let targetY = me.y - height / 2;
    
    // Kamera an Ränder binden
    targetX = Math.max(0, Math.min(targetX, ARENA_WIDTH - width));
    targetY = Math.max(0, Math.min(targetY, ARENA_HEIGHT - height));

    camera.x += (targetX - camera.x) * 0.1;
    camera.y += (targetY - camera.y) * 0.1;
}

function draw() {
    // Hintergrund löschen
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, width, height);

    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    // Raster zeichnen (Cyber-Grid)
    ctx.strokeStyle = 'rgba(0, 255, 204, 0.05)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for(let x = 0; x <= ARENA_WIDTH; x += 100) { ctx.moveTo(x, 0); ctx.lineTo(x, ARENA_HEIGHT); }
    for(let y = 0; y <= ARENA_HEIGHT; y += 100) { ctx.moveTo(0, y); ctx.lineTo(ARENA_WIDTH, y); }
    ctx.stroke();
    
    // Arena Umrandung
    ctx.strokeStyle = '#00ffcc';
    ctx.lineWidth = 5;
    ctx.strokeRect(0, 0, ARENA_WIDTH, ARENA_HEIGHT);

    // Kugeln zeichnen
    gameState.bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = b.color;
        ctx.fill();
        ctx.shadowBlur = 0; // Reset
    });

    // Partikel zeichnen
    particles.forEach(p => {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.globalAlpha = 1.0;
    });

    // Spieler zeichnen
    ['host', 'client'].forEach(playerKey => {
        let p = gameState[playerKey];
        if (p.hp <= 0) return; // Wenn tot, nicht zeichnen

        // Leuchteffekt
        ctx.shadowBlur = 20;
        ctx.shadowColor = p.color;

        ctx.beginPath();
        ctx.arc(p.x, p.y, 20, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        
        ctx.shadowBlur = 0;
        
        // Inneres Design
        ctx.beginPath();
        ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
        ctx.fillStyle = '#111';
        ctx.fill();

        // HP Balken über Spieler
        ctx.fillStyle = 'rgba(255,0,0,0.5)';
        ctx.fillRect(p.x - 25, p.y - 40, 50, 6);
        ctx.fillStyle = '#00ffcc';
        ctx.fillRect(p.x - 25, p.y - 40, (p.hp / 100) * 50, 6);
    });

    ctx.restore();

    // HUD Updaten (Lokal)
    let myStats = isHost ? gameState.host : gameState.client;
    document.getElementById('healthDisplay').innerText = Math.max(0, myStats.hp);
    document.getElementById('scoreDisplay').innerText = myStats.score;
}

/** 
 * ==========================================
 * PARTIKEL SYSTEM (Visuelle Effekte)
 * ==========================================
 */
function createExplosion(x, y, color, amount) {
    for (let i = 0; i < amount; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = Math.random() * 300 + 50;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            life: Math.random() * 0.5 + 0.2,
            maxLife: 0.7,
            size: Math.random() * 4 + 2,
            color: color
        });
    }
}

function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.9; // Partikel-Reibung
        p.vy *= 0.9;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

// Wenn der Client Netzwerk-Events für Partikel vom Host erhält
function createParticlesFromEvents(events) {
    if (!events) return;
    events.forEach(e => {
        if (e.type === 'hit') createExplosion(e.x, e.y, e.color, 10);
        if (e.type === 'death') createExplosion(e.x, e.y, e.color, 50);
    });
}
</script>
</body>
</html>
