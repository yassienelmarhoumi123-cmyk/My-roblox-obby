<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash Royale 3D - FPS & Third Person</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: Arial, sans-serif;
            touch-action: none; 
            user-select: none;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 15px;
            border-radius: 5px;
            pointer-events: none;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div id="info">
        <b>W, A, S, D</b> zum Laufen<br>
        <b>Display wischen / Maus ziehen</b> zum Umsehen<br>
        <b>Taste C</b> für Perspektiven-Wechsel (Ego / Third-Person)
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 20, 150);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Kamera startet jetzt exakt in der Mitte der Map (X:0, Z:0)
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 0); 
        camera.rotation.order = 'YXZ';
        scene.add(camera);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
        directionalLight.position.set(20, 30, 20);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const loader = new THREE.GLTFLoader();

        loader.load('enviroment_clash_royal 3.glb', function (gltf) {
            const arena = gltf.scene;
            arena.position.set(0, 0, 0);
            arena.scale.set(4, 4, 4); 
            scene.add(arena);
        });

        let hogRider = null;
        let isFirstPerson = true;

        loader.load('hog_rider_adventure.glb', function (gltf) {
            hogRider = gltf.scene;
            // Hog Rider deutlich kleiner gemacht
            hogRider.scale.set(0.08, 0.08, 0.08); 
            
            // Ego-Perspektive-Startposition (angepasst an das kleinere Modell)
            hogRider.position.set(0, -0.6, -0.5); 
            hogRider.rotation.y = Math.PI;

            camera.add(hogRider);
        });

        // Wischen / Maussteuerung
        let isDragging = false;
        let previousTouch = { x: 0, y: 0 };
        let yaw = 0;
        let pitch = 0;

        document.addEventListener('pointerdown', (e) => {
            isDragging = true;
            previousTouch.x = e.clientX;
            previousTouch.y = e.clientY;
        });

        document.addEventListener('pointermove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - previousTouch.x;
                const deltaY = e.clientY - previousTouch.y;

                yaw -= deltaX * 0.005;
                pitch -= deltaY * 0.005;

                pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));

                camera.rotation.y = yaw;
                camera.rotation.x = pitch;

                previousTouch.x = e.clientX;
                previousTouch.y = e.clientY;
            }
        });

        document.addEventListener('pointerup', () => {
            isDragging = false;
        });

        // Steuerung und Perspektiven-Wechsel (Taste C)
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        
        // Geschwindigkeit stark reduziert, damit die Map sich größer anfühlt
        const moveSpeed = 0.08; 

        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W') moveForward = true;
            if (e.key === 'a' || e.key === 'A') moveLeft = true;
            if (e.key === 's' || e.key === 'S') moveBackward = true;
            if (e.key === 'd' || e.key === 'D') moveRight = true;
            
            // Taste C schaltet Perspektive um
            if (e.key === 'c' || e.key === 'C') {
                if (hogRider) {
                    isFirstPerson = !isFirstPerson;
                    if (isFirstPerson) {
                        // Position für Ego-Perspektive
                        hogRider.position.set(0, -0.6, -0.5); 
                    } else {
                        // Position für Third-Person (Hog Rider wird weiter vor die Kamera geschoben)
                        hogRider.position.set(0, -1.5, -3.5); 
                    }
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W') moveForward = false;
            if (e.key === 'a' || e.key === 'A') moveLeft = false;
            if (e.key === 's' || e.key === 'S') moveBackward = false;
            if (e.key === 'd' || e.key === 'D') moveRight = false;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Grenzwert-Variablen für unsichtbare Wände (Kollision)
        // Verkleinere oder vergrößere diese Werte, um die Spielfeldgrenze anzupassen
        const BOUNDARY_X = 22; 
        const BOUNDARY_Z = 35; 

        function animate() {
            requestAnimationFrame(animate);

            if (moveForward || moveBackward || moveLeft || moveRight) {
                const moveX = (moveRight ? 1 : 0) - (moveLeft ? 1 : 0);
                const moveZ = (moveBackward ? 1 : 0) - (moveForward ? 1 : 0);

                const direction = new THREE.Vector3(moveX, 0, moveZ);
                const rotation = new THREE.Euler(0, camera.rotation.y, 0, 'YXZ');
                
                direction.applyEuler(rotation);
                
                if (direction.length() > 0) {
                    direction.normalize().multiplyScalar(moveSpeed);
                    camera.position.add(direction);
                }
            }

            // Kollisionsabfrage (Unsichtbare Wände)
            if (camera.position.x > BOUNDARY_X) camera.position.x = BOUNDARY_X;
            if (camera.position.x < -BOUNDARY_X) camera.position.x = -BOUNDARY_X;
            if (camera.position.z > BOUNDARY_Z) camera.position.z = BOUNDARY_Z;
            if (camera.position.z < -BOUNDARY_Z) camera.position.z = -BOUNDARY_Z;

            // Feste Höhe einhalten
            camera.position.y = 2;

            renderer.render(scene, camera);
        }
        
        animate();
    </script>
</body>
</html>
