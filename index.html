<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bugatti High-End Simulator</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #hud {
            position: absolute; top: 20px; left: 20px;
            color: white; background: rgba(0, 0, 0, 0.7);
            padding: 20px; border-radius: 15px;
            pointer-events: none; border: 1px solid #38bdf8;
        }
        #error-log { position: absolute; bottom: 20px; left: 20px; color: red; font-weight: bold; }
    </style>
</head>
<body>

    <div id="hud">
        <h1>🏎️ BUGATTI SIMULATOR PRO</h1>
        <p>Steuerung: <b>W, A, S, D</b></p>
        <p id="status">Status: Initialisiere...</p>
    </div>
    <div id="error-log"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        /**
         * 1. GLOBALE VARIABLEN & KONFIGURATION
         */
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 20, 1000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
        const logElement = document.getElementById('error-log');

        /**
         * 2. LICHT & UMGEBUNG
         */
        function setupLighting() {
            const ambient = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xffffff, 1.2);
            sun.position.set(100, 200, 100);
            sun.castShadow = true;
            scene.add(sun);
        }

        function createEnvironment() {
            // Gras-Boden (Ebene Y=0)
            const grassGeo = new THREE.PlaneGeometry(10000, 10000);
            const grassMat = new THREE.MeshStandardMaterial({ color: 0x228B22 });
            const grass = new THREE.Mesh(grassGeo, grassMat);
            grass.rotation.x = -Math.PI / 2;
            scene.add(grass);

            // Straße (Ebene Y=0.05, leicht erhöht gegen Flackern)
            const roadGeo = new THREE.PlaneGeometry(60, 10000);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.y = 0.05; 
            scene.add(road);
        }

        /**
         * 3. AUTO-LOGIK
         */
        let car = { model: null, speed: 0, angle: 0, pos: {x: 0, z: 0} };

        function loadCar() {
            const loader = new THREE.GLTFLoader();
            loader.load(
                '2016_bugatti_chiron.glb', 
                (gltf) => {
                    car.model = gltf.scene;
                    car.model.scale.set(450, 450, 450); // Skalierung
                    scene.add(car.model);
                    document.getElementById('status').innerText = "Status: Auto geladen!";
                },
                (xhr) => {
                    console.log((xhr.loaded / xhr.total * 100) + '% geladen');
                },
                (error) => {
                    logElement.innerText = "FEHLER: Modell konnte nicht geladen werden. Pfad prüfen!";
                    console.error(error);
                }
            );
        }

        /**
         * 4. EINGABE-HANDLING
         */
        const keys = { w: false, a: false, s: false, d: false };
        window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        /**
         * 5. ANIMATIONS-LOOP
         */
        function animate() {
            requestAnimationFrame(animate);

            if (car.model) {
                // Fahrphysik-Berechnung
                if (keys.w) car.speed = Math.min(car.speed + 0.05, 5);
                if (keys.s) car.speed = Math.max(car.speed - 0.05, -2);
                if (!keys.w && !keys.s) car.speed *= 0.98; // Rollwiderstand

                if (Math.abs(car.speed) > 0.01) {
                    if (keys.a) car.angle += 0.04;
                    if (keys.d) car.angle -= 0.04;
                }

                car.pos.x += Math.sin(car.angle) * car.speed;
                car.pos.z += Math.cos(car.angle) * car.speed;

                // Positionierung
                car.model.position.set(car.pos.x, 0.2, car.pos.z);
                car.model.rotation.y = car.angle;

                // Kamera-Verfolgung
                const camOffset = new THREE.Vector3(0, 20, 50);
                camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), car.angle);
                camera.position.copy(car.model.position).add(camOffset);
                camera.lookAt(car.model.position);
            }

            renderer.render(scene, camera);
        }

        /**
         * 6. INITIALISIERUNG
         */
        setupLighting();
        createEnvironment();
        loadCar();
        animate();

        // Fenstergröße anpassen
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
