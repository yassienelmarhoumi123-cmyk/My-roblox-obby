<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimative 3D Third-Person Obby</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #55b4ff; font-family: 'Arial', sans-serif; touch-action: none; user-select: none; }
        canvas { display: block; }
        
        /* UI & Leaderboard */
        #ui-container { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.7); color: white; padding: 15px 25px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.5); z-index: 10; text-shadow: 2px 2px 4px black; font-size: 20px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .ui-text { margin: 8px 0; display: flex; align-items: center; }
        #stage-text { color: #55ff55; }
        #death-text { color: #ff5555; }
        .icon { display: inline-block; width: 20px; height: 20px; margin-right: 10px; background-size: contain; }

        /* Mobile Controls */
        #joystick-zone { position: absolute; bottom: 40px; left: 40px; width: 140px; height: 140px; background: rgba(0,0,0,0.2); border: 3px solid rgba(255,255,255,0.4); border-radius: 50%; z-index: 9; touch-action: none; backdrop-filter: blur(4px); }
        #joystick-knob { position: absolute; top: 40px; left: 40px; width: 60px; height: 60px; background: rgba(255,255,255,0.8); border-radius: 50%; pointer-events: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #jump-btn { position: absolute; bottom: 50px; right: 50px; width: 90px; height: 90px; background: rgba(0,0,0,0.3); border: 3px solid rgba(255,255,255,0.5); border-radius: 50%; z-index: 9; display: flex; align-items: center; justify-content: center; color: white; font-size: 40px; font-weight: bold; backdrop-filter: blur(4px); }
        #jump-btn:active { background: rgba(255,255,255,0.5); transform: scale(0.95); }
        
        /* Start-Screen */
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(0,0,0,0.9), rgba(20,20,50,0.9)); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; z-index: 20; text-align: center; }
        #start-screen h1 { font-size: 48px; color: #00ffff; text-shadow: 0 0 20px #00ffff; margin-bottom: 10px; }
        .btn-start { margin-top: 30px; padding: 15px 40px; font-size: 24px; font-weight: bold; color: black; background: #55ff55; border: none; border-radius: 30px; cursor: pointer; box-shadow: 0 0 20px #55ff55; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="start-screen">
        <h1>ROBLOX OBBY HERO</h1>
        <p>Benutze den Joystick zum Bewegen, wische auf dem Bildschirm um dich umzusehen!</p>
        <button class="btn-start" id="start-btn">SPIEL STARTEN</button>
    </div>

    <div id="ui-container">
        <div class="ui-text" id="stage-text"><span style="margin-right:10px;">🏆</span> Stage: 0</div>
        <div class="ui-text" id="death-text"><span style="margin-right:10px;">💀</span> Tode: 0</div>
    </div>

    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="jump-btn">↑</div>

    <script>
        // --- 1. ENGINE & SCHATTEN SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x6eb8ff);
        scene.fog = new THREE.FogExp2(0x6eb8ff, 0.005); // Schönerer Nebel

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // SCHATTEN AN!
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Licht für Schatten & Realismus
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        
        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(50, 100, 30);
        sunLight.castShadow = true;
        sunLight.shadow.camera.left = -100; sunLight.shadow.camera.right = 100;
        sunLight.shadow.camera.top = 100; sunLight.shadow.camera.bottom = -100;
        sunLight.shadow.bias = -0.001;
        scene.add(sunLight);

        // --- 2. PROZEDURALE TEXTUREN MACHEN ---
        // Generiert Texturen mit HTML Canvas, damit alles cool aussieht ohne Bilder herunterzuladen
        function createTexture(type) {
            const cvs = document.createElement('canvas');
            cvs.width = 128; cvs.height = 128;
            const ctx = cvs.getContext('2d');

            if (type === 'checker') {
                ctx.fillStyle = '#cccccc'; ctx.fillRect(0,0,128,128);
                ctx.fillStyle = '#ffffff'; 
                ctx.fillRect(0,0,64,64); ctx.fillRect(64,64,64,64);
            } else if (type === 'lava') {
                ctx.fillStyle = '#ff2200'; ctx.fillRect(0,0,128,128);
                for(let i=0; i<30; i++) {
                    ctx.fillStyle = (Math.random()>0.5)? '#ff5500' : '#880000';
                    ctx.beginPath();
                    ctx.arc(Math.random()*128, Math.random()*128, Math.random()*15+5, 0, Math.PI*2);
                    ctx.fill();
                }
            } else if (type === 'checkpoint') {
                ctx.fillStyle = '#00aa00'; ctx.fillRect(0,0,128,128);
                ctx.strokeStyle = '#55ff55'; ctx.lineWidth = 10;
                ctx.strokeRect(10,10,108,108);
            } else if (type === 'bounce') {
                ctx.fillStyle = '#8800ff'; ctx.fillRect(0,0,128,128);
                ctx.strokeStyle = '#dd88ff'; ctx.lineWidth = 8;
                ctx.beginPath(); ctx.arc(64,64, 40, 0, Math.PI*2); ctx.stroke();
                ctx.beginPath(); ctx.arc(64,64, 20, 0, Math.PI*2); ctx.stroke();
            }

            const tex = new THREE.CanvasTexture(cvs);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        const mats = {
            safe: new THREE.MeshLambertMaterial({ map: createTexture('checker') }),
            lava: new THREE.MeshBasicMaterial({ map: createTexture('lava') }), // Leuchtet!
            checkpoint: new THREE.MeshLambertMaterial({ map: createTexture('checkpoint') }),
            bounce: new THREE.MeshLambertMaterial({ map: createTexture('bounce') }),
            spinner: new THREE.MeshLambertMaterial({ color: 0xffaa00 })
        };

        // --- 3. ROBLOX CHARAKTER (R6 RIG) ---
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        // Materialien für den Noob
        const matHead = new THREE.MeshLambertMaterial({color: 0xf5cd30}); // Gelb
        const matShirt = new THREE.MeshLambertMaterial({color: 0x0d69ac}); // Blau
        const matPants = new THREE.MeshLambertMaterial({color: 0x27462d}); // Grün

        function createLimb(w, h, d, mat) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            mesh.castShadow = true; mesh.receiveShadow = true;
            return mesh;
        }

        const torso = createLimb(1.0, 1.0, 0.5, matShirt);
        torso.position.y = 1.5; playerGroup.add(torso);

        const head = createLimb(0.6, 0.6, 0.6, matHead);
        head.position.y = 0.8; torso.add(head);

        // Arme und Beine brauchen Pivot-Punkte zum Animieren
        const leftArmGroup = new THREE.Group(); leftArmGroup.position.set(-0.75, 0.4, 0); torso.add(leftArmGroup);
        const leftArm = createLimb(0.4, 1.0, 0.4, matHead); leftArm.position.y = -0.4; leftArmGroup.add(leftArm);

        const rightArmGroup = new THREE.Group(); rightArmGroup.position.set(0.75, 0.4, 0); torso.add(rightArmGroup);
        const rightArm = createLimb(0.4, 1.0, 0.4, matHead); rightArm.position.y = -0.4; rightArmGroup.add(rightArm);

        const leftLegGroup = new THREE.Group(); leftLegGroup.position.set(-0.25, -0.5, 0); torso.add(leftLegGroup);
        const leftLeg = createLimb(0.4, 1.0, 0.4, matPants); leftLeg.position.y = -0.5; leftLegGroup.add(leftLeg);

        const rightLegGroup = new THREE.Group(); rightLegGroup.position.set(0.25, -0.5, 0); torso.add(rightLegGroup);
        const rightLeg = createLimb(0.4, 1.0, 0.4, matPants); rightLeg.position.y = -0.5; rightLegGroup.add(rightLeg);

        // Spieler Physik Variablen
        const player = {
            pos: new THREE.Vector3(0, 5, 0),
            vel: new THREE.Vector3(0, 0, 0),
            height: 2.5, radius: 0.6, onGround: false
        };
        let spawnPoint = new THREE.Vector3(0, 5, 0);

        // --- 4. OBBY MAP BAUEN (JETZT VIEL GRÖSSER!) ---
        const platforms = [];
        let stage = 0, deaths = 0;

        function addBlock(x, y, z, w, h, d, type, stageNum = -1, moveData = null) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mats[type]);
            mesh.position.set(x, y, z);
            
            // Textur Kachelung anpassen
            if(mesh.material.map) {
                mesh.material.map = mesh.material.map.clone();
                mesh.material.map.repeat.set(w/4, d/4);
            }

            if(type !== 'lava') { mesh.castShadow = true; mesh.receiveShadow = true; }
            scene.add(mesh);
            
            const p = { mesh, type, stage: stageNum, w, h, d, moveData };
            platforms.push(p);
            return p;
        }

        // --- DIE LEVEL ---
        // Stage 0: Start
        addBlock(0, 0, 0, 10, 1, 10, 'checkpoint', 0);
        
        // Stage 1: Einfache Lücken
        addBlock(0, 0, -10, 4, 1, 4, 'safe');
        addBlock(0, 0, -20, 4, 1, 4, 'safe');
        addBlock(0, 0, -30, 8, 1, 8, 'checkpoint', 1);

        // Stage 2: Lava überqueren (längerer Weg)
        addBlock(0, 0, -40, 4, 1, 2, 'safe');
        addBlock(0, -0.5, -48, 12, 1, 14, 'lava'); // Große Lava-Grube
        addBlock(-3, 0, -45, 3, 1, 3, 'safe');
        addBlock(3, 0, -51, 3, 1, 3, 'safe');
        addBlock(0, 0, -60, 8, 1, 8, 'checkpoint', 2);

        // Stage 3: MEGA TRAMPOLIN (Fix!)
        addBlock(0, 0, -70, 4, 1, 4, 'bounce'); 
        // Die Plattform ist weit oben und weit weg, das Pad ballert dich hoch!
        addBlock(0, 20, -95, 8, 1, 8, 'checkpoint', 3);

        // Stage 4: Bewegliche Plattformen (Neu!)
        addBlock(0, 20, -105, 4, 1, 4, 'safe', -1, { speed: 2, range: 6, axis: 'x', startPos: 0 });
        addBlock(0, 20, -118, 4, 1, 4, 'safe', -1, { speed: 2, range: 6, axis: 'x', startPos: Math.PI });
        addBlock(0, 20, -130, 8, 1, 8, 'checkpoint', 4);

        // Stage 5: Der Rotator (Spinner)
        addBlock(0, 20, -145, 12, 1, 12, 'safe');
        const spinner = addBlock(0, 21.5, -145, 14, 1, 1, 'spinner'); // Rotiert im Game Loop!
        addBlock(0, 20, -160, 8, 1, 8, 'checkpoint', 5);

        // --- 5. STEUERUNG (Third Person Touch) ---
        let camAngleX = 0, camAngleY = 0.3; // Kamera guckt leicht nach unten
        let moveVector = {x: 0, y: 0}, jumpTrigger = false;

        const startScreen = document.getElementById('start-screen');
        document.getElementById('start-btn').addEventListener('click', () => {
            startScreen.style.display = 'none';
        });

        // Joystick (Links)
        const joyZone = document.getElementById('joystick-zone');
        const joyKnob = document.getElementById('joystick-knob');
        let joyId = null, lookId = null;
        let joyStart = {x:0, y:0}, prevLook = {x:0, y:0};

        window.addEventListener('touchstart', (e) => {
            for(let t of e.changedTouches) {
                if (t.clientX < window.innerWidth/2 && !joyId) {
                    joyId = t.identifier; joyStart = {x: t.clientX, y: t.clientY};
                } else if (t.clientX >= window.innerWidth/2 && !lookId && t.target.id !== 'jump-btn') {
                    lookId = t.identifier; prevLook = {x: t.clientX, y: t.clientY};
                }
            }
        });

        window.addEventListener('touchmove', (e) => {
            for(let t of e.touches) {
                if(t.identifier === joyId) {
                    let dx = t.clientX - joyStart.x, dy = t.clientY - joyStart.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    let maxDist = 40;
                    if(dist > maxDist) { dx = (dx/dist)*maxDist; dy = (dy/dist)*maxDist; }
                    joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
                    moveVector.x = dx / maxDist; 
                    moveVector.y = -dy / maxDist;
                }
                if(t.identifier === lookId) {
                    camAngleX -= (t.clientX - prevLook.x) * 0.01; 
                    camAngleY += (t.clientY - prevLook.y) * 0.01;
                    camAngleY = Math.max(0.1, Math.min(Math.PI/2 - 0.1, camAngleY)); // Nicht unter den Boden gucken
                    prevLook = {x: t.clientX, y: t.clientY};
                }
            }
        });

        window.addEventListener('touchend', (e) => {
            for(let t of e.changedTouches) {
                if(t.identifier === joyId) {
                    joyId = null; moveVector = {x:0, y:0};
                    joyKnob.style.transform = `translate(0px, 0px)`;
                }
                if(t.identifier === lookId) lookId = null;
            }
        });

        // Sprung Button
        const jumpBtn = document.getElementById('jump-btn');
        jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); jumpTrigger = true; });
        jumpBtn.addEventListener('touchend', (e) => { e.preventDefault(); jumpTrigger = false; });

        // PC Support (nur falls du am Laptop testest)
        let keys = {w:0, s:0, a:0, d:0, left:0, right:0};
        document.addEventListener('keydown', (e) => {
            if(e.key==='w') keys.w=1; if(e.key==='s') keys.s=1; 
            if(e.key==='a') keys.a=1; if(e.key==='d') keys.d=1;
            if(e.key==='ArrowLeft') keys.left=1; if(e.key==='ArrowRight') keys.right=1;
            if(e.code==='Space') jumpTrigger = true;
        });
        document.addEventListener('keyup', (e) => {
            if(e.key==='w') keys.w=0; if(e.key==='s') keys.s=0; 
            if(e.key==='a') keys.a=0; if(e.key==='d') keys.d=0;
            if(e.key==='ArrowLeft') keys.left=0; if(e.key==='ArrowRight') keys.right=0;
            if(e.code==='Space') jumpTrigger = false;
        });

        // --- 6. GAME LOOP, PHYSIK & ANIMATIONEN ---
        const clock = new THREE.Clock();
        const SPEED = 12.0, JUMP_FORCE = 16.0, GRAVITY = -40.0;
        let walkTime = 0;

        function updateUI() {
            document.getElementById('stage-text').innerHTML = `<span style="margin-right:10px;">🏆</span> Stage: ${stage}`;
            document.getElementById('death-text').innerHTML = `<span style="margin-right:10px;">💀</span> Tode: ${deaths}`;
        }

        function killPlayer() {
            deaths++; updateUI();
            player.pos.copy(spawnPoint);
            player.vel.set(0,0,0);
            document.body.style.backgroundColor = "red";
            setTimeout(() => { document.body.style.backgroundColor = "#55b4ff"; }, 150);
        }

        function animate() {
            requestAnimationFrame(animate);
            let dt = Math.min(clock.getDelta(), 0.1);
            let time = clock.getElapsedTime();

            // Bewegliche Hindernisse updaten
            for(let p of platforms) {
                if(p.moveData) {
                    p.mesh.position[p.moveData.axis] = Math.sin(time * p.moveData.speed + p.moveData.startPos) * p.moveData.range;
                }
            }
            spinner.mesh.rotation.y += 2.5 * dt; // Balken dreht sich!

            // PC Kamera Rotation
            if(keys.left) camAngleX += 2 * dt;
            if(keys.right) camAngleX -= 2 * dt;

            // Bewegungsvektor relativ zur Kamera berechnen
            let mx = keys.d - keys.a + moveVector.x;
            let mz = keys.w - keys.s + moveVector.y;
            
            let moveLen = Math.sqrt(mx*mx + mz*mz);
            if(moveLen > 1) { mx /= moveLen; mz /= moveLen; } // Diagonal nicht schneller

            let moveDir = new THREE.Vector3(mx, 0, -mz);
            let camRot = new THREE.Matrix4().makeRotationY(camAngleX);
            moveDir.applyMatrix4(camRot);

            player.pos.x += moveDir.x * SPEED * dt;
            player.pos.z += moveDir.z * SPEED * dt;
            
            // Schwerkraft
            player.vel.y += GRAVITY * dt;
            player.pos.y += player.vel.y * dt;

            // Charakter in Laufrichtung drehen (Smooth!)
            if (moveLen > 0.1) {
                let targetRot = Math.atan2(moveDir.x, moveDir.z);
                // Simple lerp für Rotation
                let diff = targetRot - playerGroup.rotation.y;
                while(diff < -Math.PI) diff += Math.PI*2;
                while(diff > Math.PI) diff -= Math.PI*2;
                playerGroup.rotation.y += diff * 10 * dt;
                
                // Lauf-Animation (Schwingen)
                walkTime += dt * 15;
                leftArmGroup.rotation.x = Math.sin(walkTime) * 0.8;
                rightArmGroup.rotation.x = Math.sin(walkTime + Math.PI) * 0.8;
                leftLegGroup.rotation.x = Math.sin(walkTime + Math.PI) * 0.8;
                rightLegGroup.rotation.x = Math.sin(walkTime) * 0.8;
            } else {
                // Zurück in Idle-Pose
                leftArmGroup.rotation.x *= 0.8; rightArmGroup.rotation.x *= 0.8;
                leftLegGroup.rotation.x *= 0.8; rightLegGroup.rotation.x *= 0.8;
            }

            // Kollisionsprüfung (AABB Bounding Box)
            player.onGround = false;
            let pMinX = player.pos.x - player.radius, pMaxX = player.pos.x + player.radius;
            let pMinY = player.pos.y, pMaxY = player.pos.y + player.height;
            let pMinZ = player.pos.z - player.radius, pMaxZ = player.pos.z + player.radius;

            for(let p of platforms) {
                let b = p.mesh.position;
                let bMinX = b.x - p.w/2, bMaxX = b.x + p.w/2;
                let bMinY = b.y - p.h/2, bMaxY = b.y + p.h/2;
                let bMinZ = b.z - p.d/2, bMaxZ = b.z + p.d/2;

                // Box Intersection
                if (pMinX <= bMaxX && pMaxX >= bMinX && 
                    pMinY <= bMaxY && pMaxY >= bMinY && 
                    pMinZ <= bMaxZ && pMaxZ >= bMinZ) {
                    
                    if (p.type === 'lava' || p.type === 'spinner') {
                        killPlayer(); return;
                    }

                    if (p.type === 'checkpoint' && p.stage > stage) {
                        stage = p.stage;
                        spawnPoint.set(b.x, bMaxY, b.z);
                        updateUI();
                    }

                    // Steht auf dem Block?
                    if (player.vel.y <= 0 && player.pos.y - player.vel.y * dt >= bMaxY - 0.2) {
                        player.pos.y = bMaxY;
                        player.vel.y = 0;
                        player.onGround = true;

                        // Mega-Trampolin Physik
                        if (p.type === 'bounce') {
                            player.vel.y = 40; // Genug Power um 20 Blöcke hoch zu fliegen!
                            player.onGround = false;
                        }
                    }
                }
            }

            // Fall ins Nichts
            if (player.pos.y < -20) killPlayer();

            // Springen
            if (jumpTrigger && player.onGround) {
                player.vel.y = JUMP_FORCE;
                player.onGround = false;
            }

            // 3D Charakter updaten
            playerGroup.position.copy(player.pos);

            // Kamera-Verfolgung (Third Person Offset)
            let camDist = 8;
            let camOffsetX = Math.sin(camAngleX) * camDist * Math.cos(camAngleY);
            let camOffsetZ = Math.cos(camAngleX) * camDist * Math.cos(camAngleY);
            let camOffsetY = Math.sin(camAngleY) * camDist + 1.5; // Guckt über den Kopf

            let targetCamPos = new THREE.Vector3(
                player.pos.x + camOffsetX,
                player.pos.y + camOffsetY,
                player.pos.z + camOffsetZ
            );

            // Weiches Kamera-Folgen (Lerp)
            camera.position.lerp(targetCamPos, 0.15);
            camera.lookAt(player.pos.x, player.pos.y + 1.5, player.pos.z);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
