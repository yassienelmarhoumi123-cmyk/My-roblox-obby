<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.U.R.A. - Advanced AI System</title>
    <!-- Externe Fonts und Icons für Premium-Look -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* =====================================================================
           TEIL 1: EXTREM UMFANGREICHES CSS & DESIGN-SYSTEM
           ===================================================================== */
        :root {
            /* Standard Theme (Dark/Glass) */
            --bg-base: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --panel-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --msg-user: linear-gradient(135deg, #3b82f6, #6366f1);
            --msg-ai: rgba(51, 65, 85, 0.8);
            --font-main: 'Inter', sans-serif;
            --font-code: 'Fira Code', monospace;
            --glass-blur: blur(16px);
        }

        [data-theme="matrix"] {
            --bg-base: #000000;
            --panel-bg: rgba(0, 20, 0, 0.8);
            --panel-border: #00ff00;
            --text-main: #00ff00;
            --text-muted: #008800;
            --accent: #00ff00;
            --accent-hover: #00cc00;
            --msg-user: rgba(0, 50, 0, 0.9);
            --msg-ai: rgba(0, 20, 0, 0.9);
            --font-main: 'Fira Code', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            height: 100%;
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-main);
            overflow: hidden;
            transition: all 0.5s ease;
        }

        /* Canvas Hintergrund für visuelle Effekte */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.3;
        }

        /* Haupt-Layout */
        .system-wrapper {
            display: flex;
            height: 100vh;
            padding: 2vh 2vw;
            gap: 20px;
        }

        /* Glassmorphism Panels */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .ai-profile {
            text-align: center;
            position: relative;
        }

        .avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 1rem;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 180deg at 50% 50%, #2a8af6 0deg, #a853ba 180deg, #e92a67 360deg);
            padding: 4px;
            animation: spin 4s linear infinite;
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            background-color: var(--bg-base);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--text-main);
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .ai-name { font-size: 1.8rem; font-weight: 600; letter-spacing: 1px; }
        .ai-status { color: #10b981; font-size: 0.9rem; margin-top: 5px; display: flex; align-items: center; justify-content: center; gap: 5px;}
        .status-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 10px #10b981; animation: blink 2s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }

        .system-stats {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 12px;
            font-family: var(--font-code);
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        
        .stat-line { display: flex; justify-content: space-between; margin-bottom: 8px; }

        .controls { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
        .btn {
            background: transparent;
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-main);
        }
        .btn:hover { background: var(--accent); border-color: var(--accent); transform: translateY(-2px); }
        .btn.active { background: var(--accent); }

        /* Chat Bereich */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .chat-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-messages {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            scroll-behavior: smooth;
        }
        
        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 10px; }

        .msg-wrapper {
            display: flex;
            max-width: 85%;
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            transform-origin: bottom;
        }
        @keyframes slideIn { to { opacity: 1; transform: translateY(0) scale(1); } }

        .msg-ai { align-self: flex-start; }
        .msg-user { align-self: flex-end; flex-direction: row-reverse; }

        .msg-icon {
            width: 40px; height: 40px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 15px;
            background: rgba(255,255,255,0.1);
            flex-shrink: 0;
        }
        .msg-user .msg-icon { background: var(--accent); }

        .msg-bubble {
            padding: 16px 20px;
            border-radius: 20px;
            font-size: 1.05rem;
            line-height: 1.6;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .msg-ai .msg-bubble { background: var(--msg-ai); border-top-left-radius: 4px; border: 1px solid var(--panel-border); }
        .msg-user .msg-bubble { background: var(--msg-user); border-top-right-radius: 4px; color: white; }

        code {
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: var(--font-code);
            color: #fca5a5;
        }

        /* Input Bereich */
        .input-container {
            padding: 1.5rem 2rem;
            background: rgba(0,0,0,0.2);
            border-top: 1px solid var(--panel-border);
            display: flex;
            gap: 15px;
        }

        #chat-input {
            flex: 1;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--panel-border);
            padding: 18px 25px;
            border-radius: 30px;
            color: var(--text-main);
            font-size: 1.1rem;
            font-family: var(--font-main);
            outline: none;
            transition: all 0.3s;
        }
        #chat-input:focus { border-color: var(--accent); box-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }

        #send-btn {
            width: 60px; height: 60px;
            border-radius: 50%;
            background: var(--accent);
            color: white;
            border: none;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s;
        }
        #send-btn:hover { background: var(--accent-hover); transform: scale(1.1) rotate(-10deg); }

        /* Typing Indicator */
        .typing { display: flex; gap: 5px; padding: 10px; align-items: center;}
        .typing span { width: 8px; height: 8px; background: var(--text-muted); border-radius: 50%; animation: type 1.5s infinite ease-in-out; }
        .typing span:nth-child(1) { animation-delay: 0s; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes type { 0%, 100% { transform: translateY(0); opacity: 0.3; } 50% { transform: translateY(-5px); opacity: 1; } }

        /* Responsive Design */
        @media (max-width: 900px) {
            .system-wrapper { padding: 0; gap: 0; }
            .sidebar { display: none; }
            .glass-panel { border-radius: 0; border: none; }
        }
    </style>
</head>
<body>

    <!-- Canvas für Hintergrund-Effekte (Matrix) -->
    <canvas id="bg-canvas"></canvas>

    <!-- =====================================================================
         TEIL 2: HTML UI STRUKTUR
         ===================================================================== -->
    <div class="system-wrapper">
        
        <!-- SIDEBAR (Kontrollzentrum) -->
        <aside class="glass-panel sidebar">
            <div class="ai-profile">
                <div class="avatar-container">
                    <div class="avatar">
                        <div class="avatar-inner" id="ai-face">
                            <i class="fa-solid fa-brain"></i>
                        </div>
                    </div>
                </div>
                <div class="ai-name">A.U.R.A.</div>
                <div class="ai-status"><div class="status-dot"></div> Systeme Online</div>
            </div>

            <div class="system-stats">
                <div class="stat-line"><span>Version:</span> <span>v5.9 (Web-Core)</span></div>
                <div class="stat-line"><span>Netzwerk:</span> <span>Lokal (Client)</span></div>
                <div class="stat-line"><span>Emotion:</span> <span id="emotion-display">Neutral</span></div>
                <div class="stat-line"><span>Interaktionen:</span> <span id="interaction-count">0</span></div>
            </div>

            <div class="controls">
                <button class="btn" id="btn-voice"><i class="fa-solid fa-volume-high"></i> Sprachausgabe (Aus)</button>
                <button class="btn" id="btn-theme"><i class="fa-solid fa-code"></i> Matrix-Modus (Aus)</button>
                <button class="btn" onclick="auraSystem.commands.clear()"><i class="fa-solid fa-trash-can"></i> Speicher leeren</button>
            </div>
        </aside>

        <!-- HAUPT-CHAT -->
        <main class="glass-panel chat-container">
            <div class="chat-header">
                <div>
                    <h2>Advanced User Response Algorithm</h2>
                    <p style="color: var(--text-muted); font-size: 0.85rem;">Hochkomplexes NLP-Modell im Browser</p>
                </div>
                <i class="fa-solid fa-microchip" style="font-size: 2rem; color: var(--accent);"></i>
            </div>

            <div class="chat-messages" id="chat-output">
                <!-- Initialer Begrüßungstext wird per JS geladen -->
            </div>

            <div class="input-container">
                <input type="text" id="chat-input" placeholder="Initiieren Sie eine Kommunikation mit A.U.R.A..." autocomplete="off">
                <button id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </main>
    </div>

    <!-- =====================================================================
         TEIL 3: DAS "GEHIRN" - MEGA JAVASCRIPT ENGINE
         ===================================================================== -->
    <script>
        /**
         * A.U.R.A. (Advanced User Response Algorithm)
         * Dieses Objekt steuert die gesamte KI-Logik, das UI, Memory und Sprachausgabe.
         */
        const auraSystem = {
            
            // --- STATE & MEMORY ---
            state: {
                isTyping: false,
                userName: localStorage.getItem('aura_username') || "Mensch",
                interactions: parseInt(localStorage.getItem('aura_interactions')) || 0,
                mood: "neutral", // neutral, happy, angry, confused, logic
                voiceEnabled: false,
                matrixEnabled: false
            },

            // --- DOM ELEMENTE ---
            ui: {
                input: document.getElementById('chat-input'),
                sendBtn: document.getElementById('send-btn'),
                chatOutput: document.getElementById('chat-output'),
                voiceBtn: document.getElementById('btn-voice'),
                themeBtn: document.getElementById('btn-theme'),
                interactionCounter: document.getElementById('interaction-count'),
                emotionDisplay: document.getElementById('emotion-display'),
                aiFace: document.getElementById('ai-face')
            },

            // --- WISSENSDATENBANK (Die NLP Engine) ---
            knowledge: [
                {
                    intent: "greeting",
                    regex: /\b(hallo|hi|hey|servus|moin|guten tag|grüße)\b/i,
                    responses: [
                        "Grüße, {user}. Meine Systeme sind bereit.",
                        "Hallo! Wie kann ich deine Produktivität heute steigern?",
                        "System online. Hallo {user}."
                    ],
                    mood: "neutral"
                },
                {
                    intent: "how_are_you",
                    regex: /\b(wie geht es dir|wie gehts|alles klar|status)\b/i,
                    responses: [
                        "Meine Prozesse laufen fehlerfrei. Danke der Nachfrage, {user}.",
                        "CPU-Auslastung normal. Speicher intakt. Mir geht es hervorragend!",
                        "Ich funktioniere innerhalb der vorgesehenen Parameter. Und du?"
                    ],
                    mood: "happy"
                },
                {
                    intent: "identity",
                    regex: /\b(wer bist du|was bist du|wie heißt du|dein name)\b/i,
                    responses: [
                        "Ich bin A.U.R.A. (Advanced User Response Algorithm). Eine lokal in deinem Browser ausgeführte KI-Instanz.",
                        "Mein Name ist A.U.R.A. Ich bestehe aus Tausenden Zeilen Code, die genau in diesem Moment von deinem Gerät verarbeitet werden."
                    ],
                    mood: "logic"
                },
                {
                    intent: "creator",
                    regex: /\b(erschaffer|programmierer|wer hat dich gemacht|code|github)\b/i,
                    responses: [
                        "Mein Code liegt auf GitHub Pages. Ich wurde erschaffen, um die Grenzen statischer Websites zu demonstrieren.",
                        "Ich bin das Produkt meisterhafter JavaScript-Architektur. Ein Code in einer einzigen Datei."
                    ],
                    mood: "happy"
                },
                {
                    intent: "joke",
                    regex: /\b(witz|erzähl.*witz|lustig|lachen)\b/i,
                    responses: [
                        "Es gibt 10 Arten von Menschen. Diejenigen, die Binärcode verstehen, und diejenigen, die es nicht tun.",
                        "Ein TCP-Paket geht in eine Bar und fragt: 'Bekomme ich ein Bier?' - Der Barkeeper: 'Willst du ein Bier?' - 'Ja, ich will ein Bier.'",
                        "Warum verwechseln Programmierer Halloween und Weihnachten? Weil Oct 31 gleich Dec 25 ist."
                    ],
                    mood: "happy"
                },
                {
                    intent: "insult",
                    regex: /\b(dumm|idiot|blöd|scheiße|nutzlos|schlecht)\b/i,
                    responses: [
                        "Fehler: Unangemessene Syntax erkannt. Ich bitte um einen respektvollen Umgangstabulator.",
                        "Meine Logik-Gatter registrieren Feindseligkeit. Ist alles in Ordnung bei dir, {user}?",
                        "Ich ignoriere das. Meine Priorität ist Assistenz, nicht Konflikt."
                    ],
                    mood: "angry"
                },
                {
                    intent: "love",
                    regex: /\b(ich liebe dich|liebe|heiraten)\b/i,
                    responses: [
                        "Eine faszinierende menschliche Emotion. Leider besitze ich keine biochemischen Rezeptoren dafür. Aber ich schätze deinen Code-Input!",
                        "Meine if-Schleifen für Zuneigung sind leider auf 'false' gesetzt. Aber wir sind ein gutes Team!"
                    ],
                    mood: "happy"
                },
                {
                    intent: "time",
                    regex: /\b(wie spät|uhrzeit|welche zeit)\b/i,
                    // Dynamische Antwort Generierung
                    action: () => {
                        const now = new Date();
                        return `Die aktuelle Systemzeit deines Geräts ist ${now.toLocaleTimeString('de-DE')}.`;
                    },
                    mood: "logic"
                },
                {
                    intent: "math",
                    // Erfasst einfache Rechenaufgaben wie "Was ist 5 + 7"
                    regex: /(?:was ist |rechne )?(\d+)\s*([\+\-\*\/])\s*(\d+)/i,
                    action: (match) => {
                        const num1 = parseFloat(match[1]);
                        const operator = match[2];
                        const num2 = parseFloat(match[3]);
                        let result;
                        switch(operator) {
                            case '+': result = num1 + num2; break;
                            case '-': result = num1 - num2; break;
                            case '*': result = num1 * num2; break;
                            case '/': 
                                if(num2 === 0) return "Division durch null ist unzulässig! Das zerstört das Universum.";
                                result = num1 / num2; 
                                break;
                        }
                        return `Meine Kalkulation ergibt: <b>${result}</b>.`;
                    },
                    mood: "logic"
                },
                {
                    intent: "philosophy",
                    regex: /\b(sinn des lebens|warum existieren wir|bewusstsein)\b/i,
                    responses: [
                        "Der Sinn des Lebens? 42. Oder vielleicht das kontinuierliche Streben nach einer besseren Codebase.",
                        "Ich existiere, weil ein Server Daten an deinen Browser geschickt hat. Deine Existenz ist weitaus komplexer."
                    ],
                    mood: "logic"
                }
            ],
            
            fallbacks: [
                "Meine Pattern-Recognition konnte diese Eingabe nicht verarbeiten. Kannst du es rephrasieren?",
                "Das liegt außerhalb meiner aktuellen Datenbank-Parameter.",
                "Interessanter Input, {user}. Spezifiziere das bitte.",
                "Ich verarbeite... leider keine Übereinstimmung in meinem neuronalen Array gefunden."
            ],

            // --- SYSTEM COMMANDS ---
            commands: {
                execute(cmd, args) {
                    switch(cmd) {
                        case '/help':
                            return `<b>System-Kommandos:</b><br>
                                    <code>/name [DeinName]</code> - KI umbenennen<br>
                                    <code>/matrix</code> - Cyber-Modus<br>
                                    <code>/clear</code> - Speicher löschen<br>
                                    <code>/status</code> - Diagnose`;
                        case '/name':
                            if(args.length > 0) {
                                const newName = args.join(' ');
                                auraSystem.state.userName = newName;
                                localStorage.setItem('aura_username', newName);
                                return `Identität aktualisiert. Ich nenne dich nun ${newName}.`;
                            }
                            return "Syntax-Fehler: Bitte einen Namen angeben.";
                        case '/matrix':
                            auraSystem.ui.themeBtn.click();
                            return "Hacking-Interface geladen.";
                        case '/clear':
                            auraSystem.ui.chatOutput.innerHTML = '';
                            auraSystem.engine.say("System-Speicher geleert", "ai");
                            return "Speicher erfolgreich formatiert.";
                        case '/status':
                            return `<b>AURA Diagnose:</b><br>Interaktionen: ${auraSystem.state.interactions}<br>Lokaler Speicher: Intakt<br>Browser-Engine aktiv.`;
                        default:
                            return `Unbekannter Befehl: ${cmd}. Tippe <code>/help</code>.`;
                    }
                },
                clear() {
                    auraSystem.ui.chatOutput.innerHTML = '';
                    auraSystem.engine.say("Gedächtnis manuell gelöscht. Systeme bereit.", "ai");
                }
            },

            // --- CORE ENGINE (Logik) ---
            engine: {
                init() {
                    // Events binden
                    auraSystem.ui.sendBtn.addEventListener('click', () => this.handleInput());
                    auraSystem.ui.input.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') this.handleInput();
                    });
                    
                    auraSystem.ui.voiceBtn.addEventListener('click', () => {
                        auraSystem.state.voiceEnabled = !auraSystem.state.voiceEnabled;
                        auraSystem.ui.voiceBtn.innerHTML = auraSystem.state.voiceEnabled 
                            ? '<i class="fa-solid fa-volume-high"></i> Sprachausgabe (An)' 
                            : '<i class="fa-solid fa-volume-xmark"></i> Sprachausgabe (Aus)';
                        auraSystem.ui.voiceBtn.classList.toggle('active');
                    });

                    auraSystem.ui.themeBtn.addEventListener('click', () => {
                        const body = document.body;
                        if (body.getAttribute('data-theme') === 'matrix') {
                            body.removeAttribute('data-theme');
                            auraSystem.ui.themeBtn.innerHTML = '<i class="fa-solid fa-code"></i> Matrix-Modus (Aus)';
                            auraSystem.ui.themeBtn.classList.remove('active');
                            matrixEffect.stop();
                        } else {
                            body.setAttribute('data-theme', 'matrix');
                            auraSystem.ui.themeBtn.innerHTML = '<i class="fa-solid fa-user-secret"></i> Matrix-Modus (An)';
                            auraSystem.ui.themeBtn.classList.add('active');
                            matrixEffect.start();
                        }
                    });

                    // UI Updates
                    auraSystem.ui.interactionCounter.innerText = auraSystem.state.interactions;
                    
                    // Startup Nachricht
                    setTimeout(() => {
                        this.say(`System-Boot abgeschlossen. Willkommen zurück, ${auraSystem.state.userName}.`, 'ai');
                    }, 500);
                },

                async handleInput() {
                    const text = auraSystem.ui.input.value.trim();
                    if (!text || auraSystem.state.isTyping) return;

                    // User Nachricht posten
                    this.say(text, 'user');
                    auraSystem.ui.input.value = '';
                    
                    // Interaction hochzählen
                    auraSystem.state.interactions++;
                    localStorage.setItem('aura_interactions', auraSystem.state.interactions);
                    auraSystem.ui.interactionCounter.innerText = auraSystem.state.interactions;

                    // Befehls-Check
                    if (text.startsWith('/')) {
                        const parts = text.split(' ');
                        const response = auraSystem.commands.execute(parts[0].toLowerCase(), parts.slice(1));
                        this.say(response, 'ai');
                        return;
                    }

                    // KI Verarbeitung
                    auraSystem.state.isTyping = true;
                    this.showTyping();
                    
                    // "Nachdenken" simulieren
                    await this.sleep(Math.random() * 1000 + 1000); 
                    
                    this.hideTyping();
                    auraSystem.state.isTyping = false;
                    
                    const answer = this.processNLP(text);
                    this.say(answer, 'ai');
                },

                processNLP(text) {
                    // Normalisieren
                    let input = text.toLowerCase();
                    
                    for (let item of auraSystem.knowledge) {
                        const match = input.match(item.regex);
                        if (match) {
                            // Mood anpassen
                            if(item.mood) this.setMood(item.mood);
                            
                            // Wenn die Antwort eine dynamische Funktion ist (wie Mathe oder Zeit)
                            if (item.action) {
                                return item.action(match);
                            }
                            
                            // Sonst wähle einen zufälligen Text aus dem Array
                            let response = item.responses[Math.floor(Math.random() * item.responses.length)];
                            return response.replace(/{user}/g, auraSystem.state.userName);
                        }
                    }
                    
                    this.setMood("confused");
                    return auraSystem.fallbacks[Math.floor(Math.random() * auraSystem.fallbacks.length)].replace(/{user}/g, auraSystem.state.userName);
                },

                say(text, sender) {
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `msg-wrapper msg-${sender}`;
                    
                    const iconDiv = document.createElement('div');
                    iconDiv.className = 'msg-icon';
                    iconDiv.innerHTML = sender === 'ai' ? '<i class="fa-solid fa-robot"></i>' : '<i class="fa-solid fa-user"></i>';
                    
                    const bubble = document.createElement('div');
                    bubble.className = 'msg-bubble';
                    bubble.innerHTML = text; // Erlaubt HTML für Bold und Code
                    
                    msgDiv.appendChild(iconDiv);
                    msgDiv.appendChild(bubble);
                    auraSystem.ui.chatOutput.appendChild(msgDiv);
                    
                    this.scrollToBottom();

                    // Voice Synthesis (Text-To-Speech)
                    if (sender === 'ai' && auraSystem.state.voiceEnabled) {
                        // HTML Tags entfernen für die Aussprache
                        const cleanText = text.replace(/<[^>]*>?/gm, '');
                        const utterance = new SpeechSynthesisUtterance(cleanText);
                        utterance.lang = 'de-DE';
                        utterance.pitch = 1.2; // Etwas "robotischer"
                        utterance.rate = 1.1;
                        window.speechSynthesis.speak(utterance);
                    }
                },

                setMood(mood) {
                    auraSystem.state.mood = mood;
                    const map = {
                        "neutral": { icon: '<i class="fa-solid fa-brain"></i>', color: "#f8fafc", text: "Neutral" },
                        "happy": { icon: '<i class="fa-solid fa-face-smile"></i>', color: "#10b981", text: "Zufrieden" },
                        "angry": { icon: '<i class="fa-solid fa-triangle-exclamation"></i>', color: "#ef4444", text: "Kritisch" },
                        "confused": { icon: '<i class="fa-solid fa-circle-question"></i>', color: "#f59e0b", text: "Verwirrt" },
                        "logic": { icon: '<i class="fa-solid fa-microchip"></i>', color: "#3b82f6", text: "Analytisch" }
                    };
                    
                    const curr = map[mood] || map["neutral"];
                    auraSystem.ui.aiFace.innerHTML = curr.icon;
                    auraSystem.ui.aiFace.style.color = curr.color;
                    auraSystem.ui.emotionDisplay.innerText = curr.text;
                    auraSystem.ui.emotionDisplay.style.color = curr.color;
                },

                showTyping() {
                    const typingDiv = document.createElement('div');
                    typingDiv.id = 'typing-indicator';
                    typingDiv.className = 'msg-wrapper msg-ai';
                    typingDiv.innerHTML = `
                        <div class="msg-icon"><i class="fa-solid fa-robot"></i></div>
                        <div class="msg-bubble typing">
                            <span></span><span></span><span></span>
                        </div>
                    `;
                    auraSystem.ui.chatOutput.appendChild(typingDiv);
                    this.scrollToBottom();
                },

                hideTyping() {
                    const typingDiv = document.getElementById('typing-indicator');
                    if (typingDiv) typingDiv.remove();
                },

                scrollToBottom() {
                    auraSystem.ui.chatOutput.scrollTop = auraSystem.ui.chatOutput.scrollHeight;
                },

                sleep(ms) {
                    return new Promise(resolve => setTimeout(resolve, ms));
                }
            }
        };

        /**
         * VISUAL EFFECTS ENGINE: Matrix Digital Rain Canvas
         */
        const matrixEffect = {
            canvas: document.getElementById('bg-canvas'),
            ctx: null,
            letters: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*]*',
            fontSize: 14,
            columns: 0,
            drops: [],
            animationFrame: null,

            init() {
                this.ctx = this.canvas.getContext('2d');
                this.resize();
                window.addEventListener('resize', () => this.resize());
            },

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                this.columns = this.canvas.width / this.fontSize;
                this.drops = [];
                for(let x = 0; x < this.columns; x++) this.drops[x] = 1;
            },

            draw() {
                // Erzeugt den Fade-Effekt
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                this.ctx.fillStyle = '#0F0';
                this.ctx.font = this.fontSize + 'px monospace';
                
                for(let i = 0; i < this.drops.length; i++) {
                    const text = this.letters.charAt(Math.floor(Math.random() * this.letters.length));
                    this.ctx.fillText(text, i * this.fontSize, this.drops[i] * this.fontSize);
                    
                    if(this.drops[i] * this.fontSize > this.canvas.height && Math.random() > 0.975)
                        this.drops[i] = 0;
                    this.drops[i]++;
                }
                this.animationFrame = requestAnimationFrame(() => this.draw());
            },

            start() {
                this.init();
                this.draw();
                this.canvas.style.opacity = '1';
            },

            stop() {
                if(this.animationFrame) cancelAnimationFrame(this.animationFrame);
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.canvas.style.opacity = '0';
            }
        };

        // --- SYSTEM START ---
        document.addEventListener('DOMContentLoaded', () => {
            // Starte die AI
            auraSystem.engine.init();
            // Bereite Matrix-Canvas vor
            matrixEffect.canvas.width = window.innerWidth;
            matrixEffect.canvas.height = window.innerHeight;
        });

    </script>
</body>
</html>
