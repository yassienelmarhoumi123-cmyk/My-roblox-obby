<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash Royale 3D - FPS Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        /* Startbildschirm (Blocker), da Browser eine Interaktion erfordern, um die Maus einzufangen */
        #blocker {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
            z-index: 10;
        }
        #instructions {
            text-align: center;
            cursor: pointer;
        }
        #instructions h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }
        #instructions p {
            font-size: 20px;
        }
    </style>
</head>
<body>

    <!-- Overlay für den Spielstart -->
    <div id="blocker">
        <div id="instructions">
            <h1>Clash Royale Arena</h1>
            <p>Klicke in das Fenster, um das Spiel zu starten.</p>
            <br/>
            <p><b>Maus:</b> Umsehen | <b>W, A, S, D:</b> Bewegen | <b>ESC:</b> Menü</p>
        </div>
    </div>

    <!-- Three.js Basis -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <!-- WICHTIG: PointerLockControls anstelle von OrbitControls für echtes Spielgefühl -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        // 1. Szene & Renderer einrichten
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Himmelblau statt dunkelgrau für bessere Atmosphäre
        scene.fog = new THREE.Fog(0x87CEEB, 20, 150); // Leichter Nebel kaschiert die Ränder der Map

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Weichere Schatten
        document.body.appendChild(renderer.domElement);

        // 2. First-Person Kamera & Spieler-Einrichtung
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        // Spawnpunkt: Mittig in der Arena, Höhe (Y) auf 2 (Augenhöhe)
        camera.position.set(0, 2, 10); 
        scene.add(camera);

        // 3. Licht[cite: 3]
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
        directionalLight.position.set(20, 30, 20);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        // 4. Steuerung (PointerLock)
        const controls = new THREE.PointerLockControls(camera, document.body);
        
        const blocker = document.getElementById('blocker');
        const instructions = document.getElementById('instructions');

        // Klick in den Bildschirm fängt die Maus ein (Spiel startet)
        instructions.addEventListener('click', function () {
            controls.lock();
        });

        controls.addEventListener('lock', function () {
            blocker.style.display = 'none'; // Menü ausblenden
        });

        controls.addEventListener('unlock', function () {
            blocker.style.display = 'flex'; // Menü wieder anzeigen
        });

        // 5. 3D-Modelle laden (Fest codiert, Arena größer, Hog Rider kleiner)
        const loader = new THREE.GLTFLoader();[cite: 3]

        // --- ARENA LADEN ---
        loader.load('enviroment_clash_royal 3.glb', function (gltf) {[cite: 3]
            const arena = gltf.scene;
            arena.position.set(0, 0, 0);
            
            // MAP GRÖSSER MACHEN: (z.B. 4x so groß)
            arena.scale.set(4, 4, 4); 
            
            // Schattenwurf für alle Teile der Arena aktivieren
            arena.traverse(function(node) {
                if (node.isMesh) {
                    node.castShadow = true;
                    node.receiveShadow = true;
                }
            });
            scene.add(arena);
            console.log('Arena geladen und vergrößert!');
        });

        // --- HOG RIDER LADEN (ICH-PERSPEKTIVE) ---
        let hogRider = null;[cite: 3]
        loader.load('hog_rider_adventure.glb', function (gltf) {[cite: 3]
            hogRider = gltf.scene;
            
            // HOG RIDER KLEINER MACHEN:
            hogRider.scale.set(0.2, 0.2, 0.2); 
            
            // Positionierung relativ zur Kamera (Ich-Perspektive)
            // Er sitzt etwas unterhalb (-1.2) und leicht vor der Kamera (-1.0),
            // damit man den Kopf des Hogs und evtl. den Hammer sehen kann.
            hogRider.position.set(0, -1.2, -1.0); 
            
            // Um 180 Grad drehen, damit er in die gleiche Richtung schaut wie die Kamera
            hogRider.rotation.y = Math.PI;

            // WICHTIG: Der Hog Rider wird an die Kamera geheftet!
            // Bewegst du die Kamera, bewegt sich der Hog Rider automatisch mit.
            camera.add(hogRider);
            console.log('Hog Rider geladen und an Kamera gebunden!');
        });

        // 6. Bewegungs-Logik einrichten (Richtige Steuerung)
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        
        const moveSpeed = 0.25; // Laufgeschwindigkeit

        window.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyD': moveRight = true; break;
            }
        });

        window.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyD': moveRight = false; break;
            }
        });

        // 7. Fenster anpassen[cite: 3]
        window.addEventListener('resize', onWindowResize, false);[cite: 3]
        function onWindowResize() {[cite: 3]
            camera.aspect = window.innerWidth / window.innerHeight;[cite: 3]
            camera.updateProjectionMatrix();[cite: 3]
            renderer.setSize(window.innerWidth, window.innerHeight);[cite: 3]
        }[cite: 3]

        // 8. Game Loop[cite: 3]
        function animate() {[cite: 3]
            requestAnimationFrame(animate);[cite: 3]

            // Bewegung nur ausführen, wenn das Spiel aktiv (Maus gesperrt) ist
            if (controls.isLocked === true) {
                // Steuerung relativ zur Blickrichtung
                if (moveForward) controls.moveForward(moveSpeed);
                if (moveBackward) controls.moveForward(-moveSpeed);
                if (moveLeft) controls.moveRight(-moveSpeed);
                if (moveRight) controls.moveRight(moveSpeed);

                // Optionale Begrenzung der Y-Achse (damit man nicht fliegt oder durch den Boden fällt)
                // Hält die Kamera immer auf einer Höhe von 2
                if (camera.position.y !== 2) {
                    camera.position.y = 2;
                }
            }

            renderer.render(scene, camera);[cite: 3]
        }[cite: 3]
        
        animate();[cite: 3]
    </script>
</body>
</html>
