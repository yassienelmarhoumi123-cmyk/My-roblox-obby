<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AeroCombat.io - Jet Showdown</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: #0b0f19; color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden; user-select: none;
            touch-action: none;
        }
        #lobby {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95); padding: 30px; border-radius: 15px;
            border: 2px solid #38bdf8; z-index: 20; width: 85%; max-width: 320px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3); text-align: center;
        }
        input, button { font-size: 18px; padding: 12px; width: 100%; border-radius: 8px; margin-top: 10px; box-sizing: border-box; }
        input { border: 1px solid #334155; background: #1e293b; color: white; text-align: center; }
        button { background: #38bdf8; border: none; font-weight: bold; color: #0f172a; cursor: pointer; }
        #gameCanvas { background: #0f172a; display: none; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        #scoreBoard {
            position: absolute; top: 15px; right: 15px;
            background: rgba(15, 23, 42, 0.85); padding: 10px 15px;
            border-radius: 8px; font-size: 14px; display: none; pointer-events: none; z-index: 10;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

    <div id="lobby">
        <h2 style="color: #38bdf8; margin-top: 0;">✈️ AEROCOMBAT.IO</h2>
        <p style="font-size: 14px; color: #94a3b8;">Fliege mit dem Finger und schieße deine Klasse ab!</p>
        <input type="number" id="roomInput" placeholder="Raum-Nummer (4-stellig)" value="1234">
        <button onclick="joinRoom()">Abheben! 🚀</button>
    </div>

    <div id="scoreBoard">
        <b style="color: #38bdf8;">TOP PILOTEN:</b>
        <div id="leaderboard" style="margin-top: 5px;"></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDVCk8f0nhfJLLwycEZJN0-zJ05KURuGSQ",
            authDomain: "halal-bomben-spiel.firebaseapp.com",
            databaseURL: "https://halal-bomben-spiel-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "halal-bomben-spiel",
            storageBucket: "halal-bomben-spiel.firebasestorage.app",
            messagingSenderId: "709287849072",
            appId: "1:709287849072:web:0a477d52580b2cd3d598b5"
        };

        let database;
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            database = firebase.database();
        } catch(e) {
            alert("Firebase Fehler beim Laden: " + e.message);
        }

        let roomId = "", playerId = "";
        let myColor = 'hsl(' + Math.random() * 360 + ', 90%, 55%)';
        
        let players = {};
        let myBullets = [];
        
        let myX = window.innerWidth / 2;
        let myY = window.innerHeight / 2;
        let myAngle = 0;
        let myKills = 0;
        let alive = true;

        let targetX = myX;
        let targetY = myY;
        let isTouching = false;

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function joinRoom() {
            try {
                const input = document.getElementById("roomInput").value;
                if(input.length < 4) { alert("Bitte eine 4-stellige Nummer eingeben!"); return; }
                
                roomId = "aero_" + input;
                playerId = "Pilot_" + Math.floor(Math.random() * 900 + 100);

                // 🔥 ERZWINGE ZUERST DAS DESIGNSHIFT (Die Lobby MUSS sofort verschwinden)
                document.getElementById("lobby").style.display = "none";
                canvas.style.display = "block";
                document.getElementById("scoreBoard").style.display = "block";

                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

                // Position zurücksetzen, falls das iPad eine komische Auflösung meldet
                myX = canvas.width / 2;
                myY = canvas.height / 2;
                targetX = myX; targetY = myY;

                if (database) {
                    // Bei Verbindungsabbruch Spieler entfernen
                    database.ref(roomId + "/players/" + playerId).onDisconnect().remove();

                    // Synchronisation der Spieler aus Firebase
                    database.ref(roomId + "/players").on("value", snapshot => {
                        players = snapshot.val() || {};
                        if (players[playerId] && players[playerId].kills !== undefined) {
                            myKills = players[playerId].kills;
                        }
                    });

                    // Signal-Empfänger für Kugeln
                    database.ref(roomId + "/bullets").on("child_added", snapshot => {
                        let b = snapshot.val();
                        if(b && b.owner !== playerId && alive) {
                            let dist = Math.hypot(myX - b.x, myY - b.y);
                            if(dist < 22) { 
                                triggerDeath();
                                database.ref(roomId + "/players/" + b.owner + "/kills").set(firebase.database.ServerValue.increment(1));
                            }
                        }
                        snapshot.ref.remove();
                    });
                }

                // Pointer Events (für iPads)
                canvas.addEventListener("pointerdown", e => { isTouching = true; updateTarget(e); });
                canvas.addEventListener("pointermove", e => { if(isTouching) updateTarget(e); });
                canvas.addEventListener("pointerup", () => { isTouching = false; });

                // Maus-Backup
                canvas.addEventListener("mousedown", e => { isTouching = true; updateTarget(e); });
                canvas.addEventListener("mousemove", e => { if(isTouching) updateTarget(e); });
                canvas.addEventListener("mouseup", () => { isTouching = false; });

                // Touch-Backup speziell für ältere iPads/Safari
                canvas.addEventListener("touchstart", e => { isTouching = true; if(e.touches[0]) updateTarget(e.touches[0]); }, {passive: true});
                canvas.addEventListener("touchmove", e => { if(isTouching && e.touches[0]) updateTarget(e.touches[0]); }, {passive: true});
                canvas.addEventListener("touchend", () => { isTouching = false; });

                // Spiel-Schleifen starten
                setInterval(gameLoop, 1000 / 50); 
                setInterval(shootLoop, 350); 

            } catch(err) {
                alert("Fehler beim Spielstart: " + err.message);
            }
        }

        function updateTarget(e) {
            targetX = e.clientX || e.pageX;
            targetY = e.clientY || e.pageY;
        }

        function shootLoop() {
            if(!alive || !database) return;

            let bullet = {
                owner: playerId,
                x: myX + Math.cos(myAngle) * 20,
                y: myY + Math.sin(myAngle) * 20,
                vx: Math.cos(myAngle) * 11,
                vy: Math.sin(myAngle) * 11,
                life: 50
            };

            myBullets.push(bullet);
            database.ref(roomId + "/bullets").push(bullet);
        }

        function triggerDeath() {
            alive = false;
            if(database) database.ref(roomId + "/players/" + playerId).remove();
            setTimeout(() => {
                myX = Math.random() * (canvas.width - 100) + 50;
                myY = Math.random() * (canvas.height - 100) + 50;
                targetX = myX; targetY = myY;
                alive = true;
            }, 2500); 
        }

        function gameLoop() {
            if(alive) {
                if (isTouching) {
                    let dx = targetX - myX;
                    let dy = targetY - myY;
                    let dist = Math.hypot(dx, dy);

                    if (dist > 10) {
                        myAngle = Math.atan2(dy, dx);
                        myX += Math.cos(myAngle) * 6; 
                        myY += Math.sin(myAngle) * 6;
                    }
                }

                myX = Math.max(20, Math.min(canvas.width - 20, myX));
                myY = Math.max(20, Math.min(canvas.height - 20, myY));

                if(database) {
                    database.ref(roomId + "/players/" + playerId).set({
                        id: playerId, x: myX, y: myY, angle: myAngle, color: myColor, kills: myKills
                    });
                }
            }

            for (let i = myBullets.length - 1; i >= 0; i--) {
                let b = myBullets[i];
                b.x += b.vx;
                b.y += b.vy;
                b.life--;
                if(b.life <= 0) myBullets.splice(i, 1);
            }

            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Gitter-Hintergrund
            ctx.strokeStyle = "#1e293b"; ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=80) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
            for(let i=0; i<canvas.height; i+=80) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }

            // Schüsse zeichnen
            ctx.fillStyle = "#facc15";
            myBullets.forEach(b => {
                ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill();
            });

            // Spieler zeichnen
            let leaderboardList = [];
            Object.keys(players).forEach(pId => {
                let p = players[pId];
                leaderboardList.push({ id: p.id, kills: p.kills || 0 });

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);

                // Jet-Form
                ctx.beginPath();
                ctx.moveTo(22, 0);     
                ctx.lineTo(-14, -14);  
                ctx.lineTo(-8, 0);     
                ctx.lineTo(-14, 14);   
                ctx.closePath();
                
                ctx.fillStyle = p.color; ctx.fill();
                ctx.strokeStyle = "#ffffff"; ctx.lineWidth = p.id === playerId ? 2.5 : 1; ctx.stroke();

                ctx.restore();

                ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.font = "12px sans-serif"; ctx.textAlign = "center";
                ctx.fillText(p.id, p.x, p.y - 24);
            });

            if(!alive) {
                ctx.fillStyle = "rgba(239, 68, 68, 0.2)"; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = "#ef4444"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
                ctx.fillText("ABGESCHOSSEN! 💥", canvas.width/2, canvas.height/2);
            }

            // Bestenliste
            leaderboardList.sort((a,b) => b.kills - a.kills);
            let lbHtml = "";
            leaderboardList.slice(0, 4).forEach((p, i) => {
                lbHtml += `<div>${i+1}. ${p.id === playerId ? "<b>DU</b>" : p.id} (Kills: ${p.kills})</div>`;
            });
            document.getElementById("leaderboard").innerHTML = lbHtml;
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resizeCanvas);
    </script>
</body>
</html>
