<div id="login-overlay">
    <div class="login-box">
        <h2>Einloggen</h2>
        <input type="text" id="username" placeholder="Benutzername...">
        <br>
        <input type="password" id="password" placeholder="Passwort...">
        <br>
        <button onclick="login()">Spielen</button>
    </div>
</div>

<script>
    function login() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        // Hier kannst du dein Passwort festlegen
        const korrektesPasswort = "1234"; 

        if(user.length > 2 && pass === korrektesPasswort) {
            // Login erfolgreich
            document.getElementById('login-overlay').style.display = 'none';
            
            // Speichert den Namen dauerhaft im Browser
            localStorage.setItem("user", user);
            
            alert("Willkommen zurück, " + user + "!");
        } else {
            alert("Falsches Passwort oder Name zu kurz!");
        }
    }
</script>
